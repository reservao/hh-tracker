<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HH Tracker — Monitoreo de Horas por Proyecto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --navy: #1E2A5E;
  --navy-dark: #141B3D;
  --accent: #6366F1;
  --accent-bg: #EEF0FD;
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --border: #E7E9F1;
  --text: #1A1D29;
  --muted: #6B7280;
  --teal: #1E9E8B;
  --teal-bg: #E6F5F2;
  --amber: #DB9A2E;
  --amber-bg: #FBF1DF;
  --red: #D6493E;
  --red-bg: #FBE7E5;
  --card-shadow: 0 1px 2px rgba(20, 27, 61, 0.04), 0 8px 24px -4px rgba(20, 27, 61, 0.08);
  --card-shadow-hover: 0 2px 4px rgba(20, 27, 61, 0.05), 0 16px 36px -8px rgba(20, 27, 61, 0.14);
  --radius: 14px;
  --radius-sm: 9px;
}

[data-theme="dark"]{
  --navy: #38BDF8;
  --navy-dark: #0F172A;
  --accent: #818CF8;
  --accent-bg: rgba(129, 140, 248, 0.15);
  --bg: #0B0F19;
  --surface: #151D2A;
  --border: #232D3F;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --teal: #2DD4BF;
  --teal-bg: rgba(45, 212, 191, 0.15);
  --amber: #F59E0B;
  --amber-bg: rgba(245, 158, 11, 0.15);
  --red: #F87171;
  --red-bg: rgba(248, 113, 113, 0.15);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 28px -4px rgba(0, 0, 0, 0.4);
  --card-shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.25), 0 18px 40px -8px rgba(0, 0, 0, 0.55);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{ scrollbar-color: var(--border) transparent; }
body{
  font-family:'Inter', system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:60px;
  transition: background 0.25s ease, color 0.25s ease;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.005em;
}
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:20px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
.mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; letter-spacing:-0.02em; }
.muted{ color:var(--muted); }
button{ font-family:inherit; cursor:pointer; }
input, select, textarea{ font-family:inherit; font-size:14px; color:var(--text); background:var(--surface); }

.topbar{
  background:
    radial-gradient(ellipse 900px 480px at 12% -20%, rgba(99,102,241,0.35), transparent 60%),
    radial-gradient(ellipse 700px 420px at 100% 0%, rgba(30,158,139,0.22), transparent 55%),
    linear-gradient(160deg, #171F44 0%, #0F172A 100%);
  color:#fff;
  padding:22px 32px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position:relative;
}
.topbar-inner{ max-width:1180px; margin:0 auto; position:relative; }
.topbar h1{ font-size:23px; font-weight:700; letter-spacing:-0.02em; }
.topbar .subtitle{ color:#AEB6DC; font-size:13.5px; margin-top:3px; }

.kpi-strip{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-top:22px; }
.kpi{ background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.045)); border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius); padding:14px 16px; transition:transform .18s ease, border-color .18s ease; }
.kpi:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,0.24); }
.kpi .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:#A9B1D6; font-weight:600; }
.kpi .kpi-value{ font-size:21px; font-weight:600; margin-top:5px; font-family:'JetBrains Mono', monospace; letter-spacing:-0.01em; }
.kpi .kpi-value.teal{ color:#5FE3CC; }
.kpi .kpi-value.amber{ color:#F5C15A; }
.kpi .kpi-value.red{ color:#F28A81; }

.tabs{ max-width:1180px; margin:0 auto; display:flex; gap:4px; padding:0 32px; margin-top:18px; border-bottom:1px solid var(--border); background:var(--bg); flex-wrap:wrap; }
.tab-btn{ background:none; border:none; padding:12px 16px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2.5px solid transparent; transition:all .15s; }
.tab-btn:hover{ color:var(--navy); }
.tab-btn.active{ color:var(--navy); border-bottom-color:var(--teal); }

.content{ max-width:1180px; margin:24px auto 0; padding:0 32px; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:16px; box-shadow:var(--card-shadow); transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
.card-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
.card-title{ font-size:16px; font-weight:700; letter-spacing:-0.01em; }
.card-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.5; }
tr.expand-toggle{ transition:background-color .15s ease; }
tr.expand-toggle:hover{ background:var(--bg); }
.card.expand-toggle:hover{ box-shadow:var(--card-shadow-hover); transform:translateY(-2px); border-color:color-mix(in srgb, var(--teal) 30%, var(--border)); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3.5px 10px 3.5px 8px; border-radius:20px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; border:1px solid transparent; }
.badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
.badge.activo{ background:var(--teal-bg); color:var(--teal); }
.badge.pausa{ background:var(--amber-bg); color:var(--amber); }
.badge.cerrado{ background:var(--bg); color:var(--muted); border-color:var(--border); }
.badge.iniciar{ background:var(--teal-bg); color:var(--teal); }

.btn{ border-radius:var(--radius-sm); padding:9px 16px; font-size:13.5px; font-weight:600; border:1px solid transparent; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary{ background:var(--teal); color:#0F172A; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 16px -4px color-mix(in srgb, var(--teal) 45%, transparent); }
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 2px 4px rgba(0,0,0,.08), 0 10px 22px -4px color-mix(in srgb, var(--teal) 55%, transparent); }
.btn-primary:active{ transform:translateY(0); }
.btn-secondary{ background:var(--surface); color:var(--text); border-color:var(--border); }
.btn-secondary:hover{ background:var(--bg); border-color:color-mix(in srgb, var(--teal) 35%, var(--border)); }
.btn-ghost{ background:none; color:var(--muted); padding:6px 10px; border-radius:7px; }
.btn-ghost:hover{ color:var(--red); background:var(--red-bg); }
.btn-sm{ padding:6px 11px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.gauge{ width:100%; }
.gauge-track{ position:relative; height:9px; background:var(--bg); border-radius:5px; overflow:visible; border:1px solid var(--border); }
.gauge-fill{ height:100%; border-radius:5px; transition:width .3s; }
.gauge-marker{ position:absolute; top:-3px; width:2px; height:15px; background:var(--text); border-radius:1px; opacity:0.5; }
.gauge-label{ display:flex; align-items:baseline; gap:5px; margin-top:7px; font-size:12.5px; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:700; padding:9px 10px; border-bottom:1.5px solid var(--border); }
td{ padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle; color:var(--text); }
tr:last-child td{ border-bottom:none; }
td.mono, th.num{ text-align:right; }
tbody tr{ transition:background-color .15s ease; }
tbody tr:hover{ background:var(--bg); }

.form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
.field input, .field select, .field textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); transition:border-color .15s ease, box-shadow .15s ease; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px color-mix(in srgb, var(--teal) 20%, transparent); }

.empty{ text-align:center; padding:50px 20px; color:var(--muted); }
.empty .display{ font-size:17px; color:var(--text); margin-bottom:6px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(10,14,26,0.6); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; backdrop-filter:blur(6px); }
.modal-overlay.open{ display:flex; }
.modal{ background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:16px; padding:26px; width:100%; max-width:540px; box-shadow:var(--card-shadow-hover); }
.modal h3{ font-size:17px; margin-bottom:16px; color:var(--text); letter-spacing:-0.01em; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); color:var(--text); border:1px solid var(--border); padding:11px 20px; border-radius:var(--radius-sm); font-size:13.5px; opacity:0; transition:all .25s; z-index:200; pointer-events:none; max-width:80vw; box-shadow:var(--card-shadow-hover); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.person-row{ display:grid; grid-template-columns:1.4fr 1fr 1.6fr auto; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.person-row:last-child{ border-bottom:none; }
.person-name{ font-weight:600; font-size:13.5px; color:var(--text); }
.person-role{ font-size:12px; color:var(--muted); }

.section-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:700; margin:18px 0 8px; display:flex; align-items:center; gap:7px; }
.section-label::before{ content:''; width:3px; height:12px; border-radius:2px; background:var(--accent); display:inline-block; }
.loading{ text-align:center; padding:80px; color:var(--muted); }
.link-btn{ background:none; border:none; color:var(--teal); font-weight:600; font-size:13px; }
.hidden{ display:none !important; }
.expand-toggle{ cursor:pointer; user-select:none; }
.chip{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:3px 9px; font-size:11.5px; color:var(--muted); }
.info-tip{ display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:var(--border); color:var(--muted); font-size:10px; font-weight:700; font-style:normal; cursor:help; flex-shrink:0; transition:background .15s ease, color .15s ease; }
.info-tip:hover{ background:var(--accent); color:#fff; }
.filter-bar{ display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.breadcrumb{ margin-bottom:16px; font-size:13px; display:flex; align-items:center; flex-wrap:wrap; }
.breadcrumb a{ cursor:pointer; color:var(--muted); font-weight:600; }
.breadcrumb a:hover{ color:var(--teal); text-decoration:underline; }
.breadcrumb a.active{ color:var(--text); }
.crumb-sep{ margin:0 6px; color:var(--border); }
.topbar-btn{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); color:#D7DBEF; padding:9px 18px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; transition:all .15s; backdrop-filter:blur(6px); }
.topbar-btn:hover{ background:rgba(255,255,255,0.15); color:#fff; border-color:rgba(255,255,255,0.28); }
.topbar-btn.active{ background:var(--teal); color:#0F172A; border-color:var(--teal); box-shadow:0 4px 14px -4px rgba(30,158,139,0.55); }
.topbar-btn-secondary{ padding:7px 13px; font-size:12px; font-weight:600; opacity:0.78; }
.topbar-btn-secondary:hover{ opacity:1; }
.topbar-btn-secondary.active{ opacity:1; }
.topbar-divider{ width:1px; align-self:stretch; background:rgba(255,255,255,0.18); margin:2px 2px; }

.macro-nav-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.macro-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
.macro-tab{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16); color:#B9C0E0; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px; }
.macro-tab:hover{ color:#fff; border-color:rgba(255,255,255,0.4); background:rgba(255,255,255,0.09); }
.macro-tab.active{ background:#fff; color:#1E2A5E; border-color:#fff; box-shadow:0 4px 14px -4px rgba(0,0,0,0.35); }
.macro-tab .soon-badge{ background:rgba(255,255,255,0.18); color:#D7DBEF; font-size:10px; font-weight:800; padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; }
.macro-tab.active .soon-badge{ background:var(--bg); color:var(--muted); }
.alert-item{ padding:10px 12px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:6px; border:1px solid transparent; }
.alert-item.red{ background:var(--red-bg); color:var(--red); border-color:color-mix(in srgb, var(--red) 20%, transparent); }
.alert-item.amber{ background:var(--amber-bg); color:var(--amber); border-color:color-mix(in srgb, var(--amber) 20%, transparent); }


/* Responsive Design (PC, Tablet y Celular) */
@media (max-width: 992px) {
  .topbar { padding: 20px 20px 16px; }
  .tabs, .content { padding: 0 20px; }
  .kpi-strip { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}

@media (max-width: 640px) {
  .topbar { padding: 16px 14px 14px; }
  .topbar h1 { font-size: 20px; }
  .topbar .subtitle { font-size: 12px; }
  .topbar-btn { padding: 7px 12px; font-size: 12px; }
  #topNavButtons { width: 100%; justify-content: flex-start; margin-top: 8px; flex-wrap: wrap; gap: 6px; }
  
  .tabs { padding: 0 14px; overflow-x: auto; flex-wrap: nowrap; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  .tab-btn { padding: 10px 12px; font-size: 13px; flex-shrink: 0; }
  
  .content { padding: 0 12px; margin-top: 14px; }
  .card { padding: 14px; border-radius: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .card-title { font-size: 15px; }
  
  .kpi-strip { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
  .kpi { padding: 10px 12px; }
  .kpi .kpi-value { font-size: 17px; }
  
  .person-row { grid-template-columns: 1fr; gap: 8px; padding: 12px 0; }
  .filter-bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .filter-bar select, .filter-bar input, .filter-bar button { width: 100%; }

  .modal-overlay { padding: 16px 10px; }
  .modal { padding: 18px 14px; width: 96%; max-height: 90vh; overflow-y: auto; }

  /* Tablas con desplazamiento suave táctil en celulares */
  table {
    min-width: 100%;
    -webkit-overflow-scrolling: touch;
  }
}

/* Styles for Print / PDF Export */
@media print {
  body { background:#fff; padding-bottom:0; }
  .topbar-btn, #topNavButtons, .modal-overlay, .toast, .no-print, button, input[type="file"], .filter-card-actions { display:none !important; }
  .card { border:1px solid #ccc; box-shadow:none; break-inside:avoid; }
  .topbar { background:#141B3D !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div id="macroNav"></div>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap">
      <div class="expand-toggle" onclick="goToHome()">
        <h1>HH Tracker</h1>
        <div class="subtitle">Monitoreo de horas hombre por proyecto y persona — proyectado vs. real</div>
      </div>
      <div style="display:flex; flex:1; align-items:center; flex-wrap:wrap; min-width:280px" id="topNavButtons"></div>
    </div>
    <div class="kpi-strip" id="kpiStrip"></div>
  </div>
</div>

<div id="subnav"></div>

<div class="content" id="content">
  <div class="loading">Cargando datos…</div>
</div>

<footer style="max-width:1180px; margin:40px auto 0; padding:20px 32px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px">
  <div><strong>HH Tracker v2.0</strong> — Monitoreo Consolidado de Horas Hombre</div>
  <div>Desarrollado por <strong>Ricardo Klempau</strong></div>
  <div style="display:flex; align-items:center; gap:8px"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--teal)"></span> Prototipo local — datos guardados en este navegador</div>
</footer>


<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// ---------- State ----------
let state = {
  projects: [],      // {id,name,client,status,startMonth,endMonth,assignments:[{personId,projectedByMonth:{'YYYY-MM':hrs}}]}
  people: [],         // {id,name,role,capacityOverride}
  realEntries: [],    // {id,category:'project'|'admin',projectId,personId,month,hours,note,source,loggedBy,createdAt}
  config: {unidades:[], lineasNegocio:[], targetProjectPct:80, targetAdminPct:20, monthlyCapacity:180},
  mainView: 'dashboard',
  hhSubTab: 'proyectos',
  dashMode: 'global', // 'global' | 'hierarchy' | 'unidades' | 'lineas' | 'proyectos' | 'personas'
  loaded: false,
  dashNav: {unidad:null, linea:null, projectId:null, personId:null},
  entryFilterMonth: 'all',
  capacityMonth: null,
  userName: '',
  viewAsRole: 'Administrador',
  detailView: null, // {type:'project'|'person', id}
  macroSection: 'hh' // 'hh' (Horas y Márgenes por Proyecto) | 'comercial' (Pipeline y Comercial)
};

const ORG_ROLES = ['Dirección FCh', 'Gerente de Unidad', 'Director de Línea', 'Jefe de Proyecto', 'Administrador'];

let activeCharts = {};

const STATUS_OPTS = [
  {v:'iniciar', label:'Por iniciar', cls:'iniciar'},
  {v:'activo', label:'Activo', cls:'activo'},
  {v:'pausa', label:'En pausa', cls:'pausa'},
  {v:'cerrado', label:'Cerrado', cls:'cerrado'}
];
const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_ES_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function normalizeStr(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}
function monthLabelFull(m){ // 'YYYY-MM' -> 'Marzo 2026'
  const parts = m.split('-');
  const name = MONTHS_ES_FULL[parseInt(parts[1],10)-1];
  return name.charAt(0).toUpperCase()+name.slice(1)+' '+parts[0];
}
function parseMonthLabel(label){ // 'marzo 2026' / 'MarzO   2026' / 'Marzo, 2026' -> 'YYYY-MM' o null
  const norm = normalizeStr(label).replace(/,/g,' ').replace(/\s+/g,' ');
  const match = norm.match(/^([a-z]+)\s+(\d{4})$/);
  if(!match) return null;
  let word = match[1];
  if(word==='setiembre') word='septiembre';
  const idx = MONTHS_ES_FULL.indexOf(word);
  if(idx===-1) return null;
  return match[2]+'-'+String(idx+1).padStart(2,'0');
}

// ---------- Storage (Firebase Firestore) ----------
function defaultConfig(){ return {unidades:[], lineasNegocio:[], targetProjectPct:80, targetAdminPct:20, monthlyCapacity:180, valorUF:40873.77, valorUFFecha:null, tarifasPorRol:[], costoEmpresaPorRol:[], metasFacturacion:[], currencyMigratedToCLP:true}; }
function migrateConfigShape(){
  if(!state.config.unidades) state.config.unidades=[];
  if(!state.config.lineasNegocio) state.config.lineasNegocio=[];
  let changed=false;
  state.config.lineasNegocio = state.config.lineasNegocio.map(l=>{
    if(typeof l === 'string'){ changed=true; return {nombre:l, unidad:''}; }
    return l;
  });
  if(!state.config.valorUF){ state.config.valorUF = 40873.77; changed = true; }
  if(!state.config.tarifasPorRol){ state.config.tarifasPorRol = []; changed = true; }
  if(!state.config.costoEmpresaPorRol){ state.config.costoEmpresaPorRol = []; changed = true; }
  if(!state.config.metasFacturacion){ state.config.metasFacturacion = []; changed = true; }
  return changed;
}
// Todos los montos de la app se muestran y calculan en CLP (nunca UF): un monto
// vendido o una tarifa quedan fijos en pesos al momento de ingresarlos, y no se
// vuelven a recalcular con el valor UF del día (eso movería márgenes y metas sin
// que nada haya cambiado realmente). Quien ya tenía datos cargados en UF (antes de
// este cambio) los convierte una sola vez aquí, usando el valor UF vigente al
// momento de actualizar la app — de ahí en adelante todo queda en CLP fijo.
function migrateCurrencyToCLP(){
  if(state.config.currencyMigratedToCLP) return false;
  const valorUF = Number(state.config.valorUF)||0;
  if(valorUF>0){
    state.projects.forEach(p=>{
      if(p.montoVenta) p.montoVenta = Math.round(p.montoVenta*valorUF);
      (p.costosAdicionales||[]).forEach(c=>{
        if(c.montoUF) c.montoUF = Math.round(c.montoUF*valorUF);
        if(c.tarifaUFHora) c.tarifaUFHora = Math.round(c.tarifaUFHora*valorUF);
      });
    });
    (state.config.tarifasPorRol||[]).forEach(t=>{ if(t.valorUF) t.valorUF = Math.round(t.valorUF*valorUF); });
    (state.config.costoEmpresaPorRol||[]).forEach(t=>{ if(t.valorUF) t.valorUF = Math.round(t.valorUF*valorUF); });
    (state.config.metasFacturacion||[]).forEach(m=>{ if(m.metaUF) m.metaUF = Math.round(m.metaUF*valorUF); });
  }
  state.config.currencyMigratedToCLP = true;
  return true;
}
function getUnidadForLinea(lineaNombre){
  const l = (state.config.lineasNegocio||[]).find(x=>x.nombre===lineaNombre);
  return l ? (l.unidad||'') : '';
}
function lineasDeUnidad(unidad){
  return (state.config.lineasNegocio||[]).filter(l=>l.unidad===unidad).map(l=>l.nombre);
}
function peopleInLinea(lineaNombre){ return state.people.filter(p=>p.lineaNegocio===lineaNombre); }
function peopleInUnidad(unidad){ return state.people.filter(p=>getUnidadForLinea(p.lineaNegocio)===unidad); }
function projectsInLinea(lineaNombre){ return state.projects.filter(p=>p.tipo!=='admin' && p.lineaNegocio===lineaNombre); }
function projectsInUnidad(unidad){ return state.projects.filter(p=>p.tipo!=='admin' && getUnidadForLinea(p.lineaNegocio)===unidad); }
function projectsInScope(tipo, nombre){ return tipo==='unidad' ? projectsInUnidad(nombre) : projectsInLinea(nombre); }
function peopleInScope(tipo, nombre){ return tipo==='unidad' ? peopleInUnidad(nombre) : peopleInLinea(nombre); }
// Suma facturada (hitos marcados "facturado") de un conjunto de proyectos, en un año dado.
function facturadoUFEnAnio(projects, year){
  let total = 0;
  projects.forEach(p=>{
    (p.hitosFacturacion||[]).forEach(h=>{
      if(h.estado!=='facturado') return;
      const fecha = h.fechaFacturado || h.fecha || '';
      if(!year || fecha.slice(0,4)===String(year)) total += Number(p.montoVenta||0)*Number(h.pctVenta||0)/100;
    });
  });
  return total;
}
function projectsForPeopleIds(personIds){
  return state.projects.filter(p=>(p.assignments||[]).some(a=>personIds.has(a.personId)));
}
function projectTotalsForPeople(project, personIds){
  let projectedHours=0, actualHours=0;
  (project.assignments||[]).forEach(a=>{
    if(personIds && !personIds.has(a.personId)) return;
    const person = getPerson(a.personId); if(!person) return;
    const proj = assignmentProjectedTotal(a);
    const act = projectRealHoursForPerson(project.id, a.personId);
    projectedHours += proj; actualHours += act;
  });
  return {projectedHours, actualHours};
}

// ---------- Almacenamiento 100% local (localStorage del navegador) ----------
// Prototipo local: sin backend ni cuentas. Cuando se apruebe el paso a producción,
// estas funciones se reemplazan por llamadas a Supabase sin tocar el resto de la app,
// porque todo el resto del código solo conoce persistProjects/persistPeople/persistEntries/persistConfig.
const LS_PREFIX = 'hhtracker_';

function lsSet(key, jsonString){
  try{
    localStorage.setItem(LS_PREFIX + key, jsonString);
    return true;
  }catch(e){ console.error('lsSet error', key, e); return false; }
}
function lsGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('lsGet error', key, e); return null; }
}

function initLocalStorageSync(){
  state.userName = localStorage.getItem('hh_username') || '';
  state.viewAsRole = localStorage.getItem('hh_viewAsRole') || 'Administrador';
  state.macroSection = localStorage.getItem('hh_macroSection') || 'hh';

  const storedProjects = lsGet('projects');
  const storedPeople = lsGet('people');
  const isFirstLaunch = storedProjects === null && storedPeople === null;

  state.projects = storedProjects || [];
  state.people = storedPeople || [];
  state.realEntries = lsGet('real_entries') || [];
  state.config = lsGet('config') || defaultConfig();

  if(isFirstLaunch){
    loadDemoData();

  state.loaded = true;
  state.capacityMonth = currentMonth();
  migrateProjectPeople();
  let configChanged = migrateConfigShape();
  if(migrateCurrencyToCLP()){ configChanged = true; persistProjects(); }

  renderAll();
  actualizarValorUFAutomatico();
}

function migrateProjectPeople(){
  let changed = false;
  const nameToId = {};
  state.people.forEach(p=> nameToId[p.name.trim().toLowerCase()] = p.id);
  state.projects.forEach(proj=>{
    if(proj.people && Array.isArray(proj.people)){
      changed = true;
      if(!proj.assignments) proj.assignments = [];
      proj.people.forEach(op=>{
        const key = (op.name||'').trim().toLowerCase();
        let gid = nameToId[key];
        const person = getPerson(gid);
        const role = person ? person.role : (op.role || 'Consultor');
        const pbm = {};
        if(op.projectedHours) pbm[currentMonth()] = op.projectedHours;
        let existingRoleAssignment = proj.assignments.find(a => a.role === role);
        if(!existingRoleAssignment){
          existingRoleAssignment = { role, projectedByMonth: {} };
          proj.assignments.push(existingRoleAssignment);
        }
        Object.entries(pbm).forEach(([m, h]) => {
          existingRoleAssignment.projectedByMonth[m] = (existingRoleAssignment.projectedByMonth[m]||0) + Number(h);
        });
      });
      delete proj.people;
    }
    if(proj.assignments && Array.isArray(proj.assignments)){
      const newAssignmentsMap = {};
      let hasPersonId = false;
      proj.assignments.forEach(a => {
        if(a.personId){
          hasPersonId = true;
          const person = getPerson(a.personId);
          const role = person ? person.role : (a.role || 'Consultor');
          if(!newAssignmentsMap[role]) newAssignmentsMap[role] = {};
          Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
            newAssignmentsMap[role][m] = (newAssignmentsMap[role][m]||0) + Number(h||0);
          });
        } else if(a.role) {
          if(!newAssignmentsMap[a.role]) newAssignmentsMap[a.role] = {};
          Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
            newAssignmentsMap[a.role][m] = (newAssignmentsMap[a.role][m]||0) + Number(h||0);
          });
        }
      });
      if(hasPersonId){
        changed = true;
        proj.assignments = Object.entries(newAssignmentsMap).map(([role, projectedByMonth]) => ({ role, projectedByMonth }));
      }
    } else {
      proj.assignments = [];
    }
    if(!proj.startMonth) proj.startMonth = '';
    if(!proj.endMonth) proj.endMonth = '';
  });
  if(changed){ persistProjects(); persistPeople(); persistConfig(); }
}

// ---------- Helpers ----------
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtH(n){ return new Intl.NumberFormat('es-CL',{maximumFractionDigits:1}).format(n||0); }

function currentMonth(){ return new Date().toISOString().slice(0,7); }
function fmtMonth(m){ if(!m) return '—'; const parts=m.split('-'); return MONTHS_ES[parseInt(parts[1],10)-1] + ' ' + parts[0]; }
function monthRange(start,end){
  if(!start||!end) return [];
  const sp=start.split('-').map(Number), ep=end.split('-').map(Number);
  let y=sp[0], m=sp[1]; const ye=ep[0], me=ep[1];
  const res=[]; let guard=0;
  while((y<ye || (y===ye && m<=me)) && guard<120){
    res.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
    guard++;
  }
  return res;
}
function addMonthsAgo(n){
  const d = new Date(); const res=[];
  for(let i=n-1;i>=0;i--){
    const dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
    res.push(dt.toISOString().slice(0,7));
  }
  return res;
}
function monthsForward(n){
  const d = new Date(); const res=[];
  for(let i=0;i<n;i++){
    const dt = new Date(d.getFullYear(), d.getMonth()+i, 1);
    res.push(dt.toISOString().slice(0,7));
  }
  return res;
}

function getRolePriority(r){
  const norm = normalizeStr(r);
  if(norm.includes('director')) return 1;
  if(norm.includes('jefe') || norm.includes('lider') || norm.includes('lead') || norm.includes('manager')) return 2;
  if(norm.includes('consultor') || norm.includes('especialista') || norm.includes('analista')) return 3;
  return 4;
}

function getAllRoles(){
  const set = new Set();
  state.people.forEach(p => { if(p.role && p.role.trim()) set.add(p.role.trim()); });
  state.projects.forEach(pr => {
    (pr.assignments||[]).forEach(a => { if(a.role && a.role.trim()) set.add(a.role.trim()); });

  const list = Array.from(set);
  list.sort((a, b) => {
    const prioA = getRolePriority(a);
    const prioB = getRolePriority(b);
    if(prioA !== prioB) return prioA - prioB;
    return a.localeCompare(b);
  });
  return list;
}
function peopleWithRole(roleName){
  return state.people.filter(p => p.role === roleName);
}
function roleCapacity(roleName){
  const people = peopleWithRole(roleName);
  if(people.length > 0){
    return people.reduce((sum, p) => sum + personCapacity(p), 0);
  }
  return Number(state.config.monthlyCapacity || 180);
}
function projectRealHoursForRole(projectId, roleName){
  const personIds = new Set(peopleWithRole(roleName).map(p => p.id));
  return state.realEntries.filter(e => e.category === 'project' && e.projectId === projectId && personIds.has(e.personId)).reduce((s, e) => s + Number(e.hours || 0), 0);
}
function roleProjectHoursInMonth(roleName, month){
  const personIds = new Set(peopleWithRole(roleName).map(p => p.id));
  return state.realEntries.filter(e => e.category === 'project' && personIds.has(e.personId) && e.month === month).reduce((s, e) => s + Number(e.hours || 0), 0);
}
function roleAdminHoursInMonth(roleName, month){
  const personIds = new Set(peopleWithRole(roleName).map(p => p.id));
  return state.realEntries.filter(e => e.category === 'admin' && personIds.has(e.personId) && e.month === month).reduce((s, e) => s + Number(e.hours || 0), 0);
}

function getRoleLineaPairs(){
  const pairsMap = new Map();
  state.people.forEach(p => {
    const l = p.lineaNegocio || 'Sin línea';
    const r = p.role || 'Consultor';
    const key = l + '|||' + r;
    if(!pairsMap.has(key)) pairsMap.set(key, { linea: l, role: r });
  });
  state.projects.forEach(pr => {
    const l = pr.lineaNegocio || 'Sin línea';
    (pr.assignments||[]).forEach(a => {
      if(a.role){
        const key = l + '|||' + a.role;
        if(!pairsMap.has(key)) pairsMap.set(key, { linea: l, role: a.role });
      }
    });
  });
  const list = Array.from(pairsMap.values());
  list.sort((a,b) => {
    const lineaCmp = a.linea.localeCompare(b.linea);
    if(lineaCmp !== 0) return lineaCmp;
    const prioA = getRolePriority(a.role);
    const prioB = getRolePriority(b.role);
    if(prioA !== prioB) return prioA - prioB;
    return a.role.localeCompare(b.role);
  });
  return list;
}
function peopleWithRoleAndLinea(roleName, lineaName){
  return state.people.filter(p => p.role === roleName && (p.lineaNegocio || 'Sin línea') === lineaName);
}
function roleLineaCapacity(roleName, lineaName){
  const people = peopleWithRoleAndLinea(roleName, lineaName);
  if(people.length > 0){
    return people.reduce((sum, p) => sum + personCapacity(p), 0);
  }
  return Number(state.config.monthlyCapacity || 180);
}
function roleLineaProjectHoursInMonth(roleName, lineaName, month){
  let proj = 0;
  state.projects.forEach(pr => {
    const pLinea = pr.lineaNegocio || 'Sin línea';
    if(pLinea === lineaName){
      (pr.assignments||[]).forEach(a => {
        if(a.role === roleName && a.projectedByMonth && a.projectedByMonth[month]){
          proj += Number(a.projectedByMonth[month] || 0);
        }
      });
    }
  });
  return proj;
}
function roleLineaRealHoursInMonth(roleName, lineaName, month){
  const personIds = new Set(peopleWithRoleAndLinea(roleName, lineaName).map(p => p.id));
  return state.realEntries.filter(e => personIds.has(e.personId) && e.month === month).reduce((s, e) => s + Number(e.hours || 0), 0);
}

function projectTotals(project){
  let projectedHours = 0, actualHours = 0;
  (project.assignments||[]).forEach(a => {
    projectedHours += assignmentProjectedTotal(a);
  });
  state.realEntries.forEach(e => {
    if(e.projectId === project.id){
      actualHours += Number(e.hours||0);
    }
  });
  return { projectedHours, actualHours };
}

// ---------- Capa financiera: tarifas, costos y márgenes (CLP) ----------
// Todo monto de la app (venta, tarifas, metas, costos) se guarda y calcula en
// CLP fijo, nunca en UF: si se re-derivara desde el valor UF del día, los
// márgenes y metas ya cerrados irían "moviéndose solos" con la inflación aunque
// nada del proyecto haya cambiado — justo lo que la consultora quiere evitar.
// La UF solo se usa como ayuda para tipear: estos pares de campos UF/CLP
// enlazados permiten cargar el dato en cualquiera de las dos unidades, pero lo
// que realmente se guarda es siempre el campo CLP, convertido una sola vez al
// momento de ingresarlo (no se vuelve a recalcular después).
function fmtUF(n){ return new Intl.NumberFormat('es-CL',{maximumFractionDigits:1}).format(n||0)+' UF'; }
function fmtCLP(n){ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0); }
function ufToCLP(uf){ return Number(uf||0) * Number(state.config.valorUF||0); }
function clpToUF(clp){ const v=Number(state.config.valorUF||0); return v>0 ? Number(clp||0)/v : 0; }
function renderUfClpField(ufId, clpId, label, currentCLP, help){
  const clp = Math.round(Number(currentCLP||0));
  const uf = clpToUF(clp);
  return '<div class="field" style="grid-column:1/-1"><label>'+label+'</label>'
    + '<div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap">'
    + '<div style="flex:1; min-width:170px"><input id="'+clpId+'" type="number" min="0" step="1" value="'+(clp||'')+'" placeholder="$ 0" oninput="syncUfClp(\''+ufId+'\',\''+clpId+'\',\'clp\')"><div class="muted" style="font-size:11px; margin-top:3px">Pesos chilenos (CLP) — este es el valor que se guarda</div></div>'
    + '<div class="muted" style="padding-bottom:22px">o</div>'
    + '<div style="flex:1; min-width:130px"><input id="'+ufId+'" type="number" min="0" step="0.01" value="'+(clp>0?Number(uf.toFixed(2)):'')+'" placeholder="0" oninput="syncUfClp(\''+ufId+'\',\''+clpId+'\',\'uf\')"><div class="muted" style="font-size:11px; margin-top:3px">Unidades de Fomento (UF), solo de referencia al ingresar</div></div>'
    + '</div>'
    + (help ? '<p class="muted" style="font-size:11.5px; margin-top:6px">'+help+'</p>' : '')
    + '</div>';
}
function syncUfClp(ufId, clpId, source){
  const ufEl = document.getElementById(ufId), clpEl = document.getElementById(clpId);
  if(!ufEl || !clpEl) return;
  if(source==='uf'){
    const uf = Number(ufEl.value)||0;
    clpEl.value = uf>0 ? Math.round(ufToCLP(uf)) : '';
  } else {
    const clp = Number(clpEl.value)||0;
    ufEl.value = clp>0 ? Number(clpToUF(clp).toFixed(2)) : '';
  }
}

// ---------- Valor UF: se actualiza solo una vez al día contra un servicio público ----------
function todayISO(){ return new Date().toISOString().slice(0,10); }
// Actualiza el valor UF automáticamente desde mindicador.cl (API pública, sin costo,
// mantenida por la comunidad y usada ampliamente en Chile para este propósito exacto).
// Se llama una sola vez al abrir la app y no vuelve a pedir el dato si ya se actualizó
// hoy. Si falla (sin internet, servicio caído), se deja el último valor guardado y no
// se interrumpe el uso de la app — la UF se puede seguir editando a mano en Configuración.
async function actualizarValorUFAutomatico(force){
  if(!force && state.config.valorUFFecha === todayISO()) return;
  try{
    const resp = await fetch('https://mindicador.cl/api/uf');
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    const valor = data && data.serie && data.serie[0] && Number(data.serie[0].valor);
    if(valor > 0){
      state.config.valorUF = valor;
      state.config.valorUFFecha = todayISO();
      persistConfig();
      renderAll();
      if(force) showToast('Valor UF actualizado: '+fmtCLP(valor));
    }
  } catch(err){
    if(force) showToast('No se pudo obtener el valor UF automáticamente (revisa tu conexión). Puedes ingresarlo manualmente abajo.');
  }
}

// Tarifa/costo vigente de un rol a una fecha dada: toma, entre las entradas con
// vigenciaDesde <= mes, la de vigencia más reciente. Un cambio de tarifa nunca
// reescribe meses ya calculados con la tarifa anterior.
function vigenteParaRol(catalogo, roleName, month){
  const entradas = (catalogo||[]).filter(c => c.rol === roleName && (!c.vigenciaDesde || c.vigenciaDesde <= (month||currentMonth())));
  if(entradas.length === 0) return 0;
  entradas.sort((a,b)=> (a.vigenciaDesde||'').localeCompare(b.vigenciaDesde||''));
  return Number(entradas[entradas.length-1].valorUF || 0);
}
function tarifaCatalogoRol(roleName, month){ return vigenteParaRol(state.config.tarifasPorRol, roleName, month); }
function costoEmpresaCatalogoRol(roleName, month){ return vigenteParaRol(state.config.costoEmpresaPorRol, roleName, month); }

function canSeeCostoEmpresa(){
  return state.viewAsRole === 'Gerente de Unidad' || state.viewAsRole === 'Administrador';
}

function projectHorasProspectadasTotal(project){
  return (project.assignments||[]).reduce((s,a)=> s + assignmentProjectedTotal(a), 0);
}
// Tarifa efectiva = venta contratada / horas prospectadas totales. Valoriza el
// esfuerzo devengado para que, si el proyecto se ejecuta según lo prospectado,
// el ingreso devengado converja al monto vendido (sección 5.3 de la propuesta).
function tarifaEfectivaProject(project){
  const venta = Number(project.montoVenta||0);
  const horasProsp = projectHorasProspectadasTotal(project);
  if(venta > 0 && horasProsp > 0) return venta / horasProsp;
  return null; // sin línea base: se usa el catálogo por rol como referencia
}
// Costos adicionales del proyecto que no son horas del equipo interno: materiales,
// consultores externos (por hora o a monto fijo), licencias, viajes, etc.
function costoAdicionalMonto(c){
  return c.modalidad==='tarifa_hora' ? Number(c.tarifaUFHora||0)*Number(c.horas||0) : Number(c.montoUF||0);
}
function costosAdicionalesIncurridos(project){
  return (project.costosAdicionales||[]).filter(c=>c.estado==='incurrido').reduce((s,c)=>s+costoAdicionalMonto(c),0);
}
function costosAdicionalesEstimados(project){
  return (project.costosAdicionales||[]).filter(c=>c.estado==='estimado').reduce((s,c)=>s+costoAdicionalMonto(c),0);
}
function costoDevengadoProject(project){
  let costo = 0;
  state.realEntries.forEach(e=>{
    if(e.projectId !== project.id) return;
    const person = getPerson(e.personId);
    const role = person ? person.role : null;
    if(!role) return;
    costo += Number(e.hours||0) * costoEmpresaCatalogoRol(role, e.month);
  });
  costo += costosAdicionalesIncurridos(project);
  return costo;
}
function ingresoDevengadoProject(project){
  const venta = Number(project.montoVenta||0);
  const tarifaEfectiva = tarifaEfectivaProject(project);
  const t = projectTotals(project);
  let ingreso;
  if(tarifaEfectiva != null){
    ingreso = t.actualHours * tarifaEfectiva;
    if(venta > 0) ingreso = Math.min(ingreso, venta); // el ingreso devengado nunca supera la venta neta
  } else {
    // Sin línea base: se valoriza cada hora real con el catálogo del rol de quien la ejecutó
    ingreso = 0;
    state.realEntries.forEach(e=>{
      if(e.projectId !== project.id) return;
      const person = getPerson(e.personId);
      if(!person) return;
      ingreso += Number(e.hours||0) * tarifaCatalogoRol(person.role, e.month);
    });
  }
  return ingreso;
}
function costoPorTerminarProject(project){
  let costo = 0;
  const mesRef = project.endMonth || currentMonth();
  (project.assignments||[]).forEach(a=>{
    const totalProyectado = assignmentProjectedTotal(a);
    const realDelRol = projectRealHoursForRole(project.id, a.role);
    const restante = Math.max(0, totalProyectado - realDelRol);
    costo += restante * costoEmpresaCatalogoRol(a.role, mesRef);
  });
  costo += costosAdicionalesEstimados(project);
  return costo;
}
// Las tres lecturas de margen de la sección 5.1: cada una responde una pregunta
// distinta y se expresa sobre una base distinta (el % nunca comparte denominador).
function margenesProject(project){
  const venta = Number(project.montoVenta||0);
  const costoDevengado = costoDevengadoProject(project);
  const ingresoDevengado = ingresoDevengadoProject(project);
  const costoPorTerminar = costoPorTerminarProject(project);

  const devengadoMonto = ingresoDevengado - costoDevengado;
  const devengadoPct = ingresoDevengado > 0 ? (devengadoMonto/ingresoDevengado*100) : null;

  const proyectadoMonto = venta - (costoDevengado + costoPorTerminar);
  const proyectadoPct = venta > 0 ? (proyectadoMonto/venta*100) : null;

  const esCerrado = project.status === 'cerrado';
  const comercialMonto = esCerrado ? (venta - costoDevengado) : null;
  const comercialPct = (esCerrado && venta > 0) ? (comercialMonto/venta*100) : null;

  return {
    venta, costoDevengado, ingresoDevengado, costoPorTerminar,
    devengado: {monto: devengadoMonto, pct: devengadoPct},
    proyectadoCierre: {monto: proyectadoMonto, pct: proyectadoPct},
    comercialCierre: {monto: comercialMonto, pct: comercialPct}
  };
}
function pctBadgeColor(pct){
  if(pct == null) return 'var(--muted)';
  if(pct < 15) return 'var(--red)';
  if(pct < 30) return 'var(--amber)';
  return 'var(--teal)';
}

// ---------- Metas de facturación por Unidad / Línea de Negocio ----------
function findMetaConfig(tipo, nombre, year){
  return (state.config.metasFacturacion||[]).find(m=>m.tipo===tipo && m.nombre===nombre && String(m.periodo)===String(year));
}
// El "monto por persona" es un promedio referencial (meta ÷ dotación), no una cuota
// justa por persona: roles distintos facturan a tarifas distintas. Se etiqueta así
// en la interfaz para que no se lea como una meta individual real.
function metaScopeStats(tipo, nombre, year){
  const projects = projectsInScope(tipo, nombre);
  const projectsConVenta = projects.filter(p=>Number(p.montoVenta||0)>0);
  const venta = projectsConVenta.reduce((s,p)=>s+Number(p.montoVenta||0),0);
  const facturado = facturadoUFEnAnio(projects, year);
  const numPersonas = peopleInScope(tipo, nombre).length;
  const numProyectos = projectsConVenta.length;

  let margenPondSum = 0, margenPondPeso = 0;
  projectsConVenta.forEach(p=>{
    const m = margenesProject(p);
    if(m.proyectadoCierre.pct!=null){ margenPondSum += m.proyectadoCierre.pct*p.montoVenta; margenPondPeso += p.montoVenta; }
  });
  const margenPromedioPct = margenPondPeso>0 ? (margenPondSum/margenPondPeso) : null;
  const promedioPorProyecto = numProyectos>0 ? (venta/numProyectos) : 0;

  return {venta, facturado, numPersonas, numProyectos, margenPromedioPct, promedioPorProyecto};
}
// % del año ya transcurrido (para comparar el avance real contra el ritmo esperado).
function fraccionAnioTranscurrida(year){
  const hoy = new Date();
  if(String(hoy.getFullYear()) !== String(year)) return hoy.getFullYear() > Number(year) ? 1 : 0;
  const inicio = new Date(hoy.getFullYear(), 0, 1);
  const fin = new Date(hoy.getFullYear()+1, 0, 1);
  return (hoy - inicio) / (fin - inicio);
}

// ---------- Facturación: hitos y descalce esfuerzo-facturación ----------
function projectHitosTotalFacturadoPct(project){
  const hitos = project.hitosFacturacion || [];
  if(hitos.length === 0) return null;
  const totalPct = hitos.reduce((s,h)=> s + Number(h.pctVenta||0), 0);
  const facturadoPct = hitos.filter(h=>h.estado==='facturado').reduce((s,h)=> s + Number(h.pctVenta||0), 0);
  return {totalPct, facturadoPct};
}
// % de esfuerzo consumido (horas reales / horas prospectadas) vs % ya facturado:
// una brecha grande es la alerta de "trabajo ejecutado que no se ha cobrado".
function projectDescalce(project){
  const t = projectTotals(project);
  const pctEsfuerzo = t.projectedHours > 0 ? (t.actualHours/t.projectedHours*100) : null;
  const fact = projectHitosTotalFacturadoPct(project);
  const pctFacturado = fact ? fact.facturadoPct : 0;
  if(pctEsfuerzo == null) return null;
  return { pctEsfuerzo, pctFacturado, brecha: pctEsfuerzo - pctFacturado };
}

function gauge(projected, actual, fmtFn, suffix){
  projected = Number(projected)||0; actual = Number(actual)||0;
  fmtFn = fmtFn || (v => fmtH(v)+' h');
  suffix = suffix || 'proy.';
  const scale = Math.max(projected, actual, 1) * 1.15;
  const markerPct = (projected/scale*100).toFixed(2);
  const fillPct = (actual/scale*100).toFixed(2);
  const ratio = projected>0 ? actual/projected : (actual>0 ? 2 : 0);
  const color = ratioColor(ratio);
  const pctLabel = projected>0 ? (ratio*100).toFixed(0)+'%' : (actual>0 ? '—' : '0%');
  return '<div class="gauge">'
    + '<div class="gauge-track">'
    + '<div class="gauge-fill" style="width:'+fillPct+'%;background:'+color+'"></div>'
    + '<div class="gauge-marker" style="left:'+markerPct+'%"></div>'
    + '</div>'
    + '<div class="gauge-label"><span class="mono" style="font-weight:600">'+fmtFn(actual)+'</span><span class="muted">/ '+fmtFn(projected)+' '+suffix+'</span><span class="mono" style="color:'+color+';font-weight:700;margin-left:auto">'+pctLabel+'</span></div>'
    + '</div>';
}

// Gantt de facturación: una fila por proyecto, una columna por mes, con lo
// planificado (según fecha de hitos) y lo realmente facturado — la vista mensual
// que pedía el usuario para ver de un vistazo cómo viene la facturación del año.
function renderGanttFacturacion(){
  if(!state.ganttYear) state.ganttYear = String(new Date().getFullYear());
  const year = state.ganttYear;
  const monthsShort = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const projectsConHitos = state.projects.filter(p=>p.tipo!=='admin' && (p.hitosFacturacion||[]).length>0);

  const yearOpts = getAvailableYears().map(y=>'<option value="'+y+'" '+(y===year?'selected':'')+'>'+y+'</option>').join('');
  const header = '<div class="card-header"><div><div class="card-title">📆 Gantt de Facturación — '+year+'</div><div class="card-sub">Monto planificado (según hitos) y facturado real, mes a mes, por proyecto</div></div>'
    + '<select onchange="state.ganttYear=this.value; renderContent();" style="max-width:130px">'+yearOpts+'</select></div>';

  if(projectsConHitos.length===0){
    return '<div class="card">'+header+'<div class="empty"><p>Ningún proyecto tiene hitos de facturación definidos todavía. Agrégalos desde "Horas y Márgenes por Proyecto" → Gestionar Proyectos → detalle del proyecto → Hitos de facturación.</p></div></div>';
  }

  const hoy = todayISO().slice(0,7);
  const totalesPlan = Array(12).fill(0), totalesReal = Array(12).fill(0);

  const cellHtml = (plan, real, mesKey) => {
    if(plan===0 && real===0) return '<td class="muted" style="text-align:center; font-size:11px">—</td>';
    const vencidoSinFacturar = plan>0 && real<plan && mesKey<hoy;
    const color = (plan>0 && real>=plan) ? 'var(--teal)' : (vencidoSinFacturar ? 'var(--red)' : 'var(--amber)');
    return '<td style="text-align:center; padding:6px 4px" title="Plan: '+fmtCLP(plan)+' · Real: '+fmtCLP(real)+'">'
      + '<div style="font-weight:700; font-size:11px; color:'+color+'">'+(real>0?fmtCLP(real):'—')+'</div>'
      + (plan>0 ? '<div class="muted" style="font-size:9.5px; margin-top:1px">plan '+fmtCLP(plan)+'</div>' : '')
      + '</td>';
  };

  const rows = projectsConHitos.map(p=>{
    const planPorMes = Array(12).fill(0), realPorMes = Array(12).fill(0);
    (p.hitosFacturacion||[]).forEach(h=>{
      const montoHito = Number(p.montoVenta||0)*Number(h.pctVenta||0)/100;
      if(h.fecha && h.fecha.slice(0,4)===year){
        const mNum = parseInt(h.fecha.slice(5,7),10);
        if(mNum>=1 && mNum<=12) planPorMes[mNum-1] += montoHito;
      }
      if(h.estado==='facturado'){
        const fechaReal = h.fechaFacturado || h.fecha;
        if(fechaReal && fechaReal.slice(0,4)===year){
          const mNum = parseInt(fechaReal.slice(5,7),10);
          if(mNum>=1 && mNum<=12) realPorMes[mNum-1] += montoHito;
        }
      }
    });
    let totalPlan=0, totalReal=0;
    const cells = monthsShort.map((_,i)=>{
      totalesPlan[i]+=planPorMes[i]; totalesReal[i]+=realPorMes[i];
      totalPlan+=planPorMes[i]; totalReal+=realPorMes[i];
      return cellHtml(planPorMes[i], realPorMes[i], year+'-'+String(i+1).padStart(2,'0'));
    }).join('');
    return '<tr class="expand-toggle" onclick="openProjectDetail(\''+p.id+'\')">'
      + '<td><b>'+p.name+'</b><div class="muted" style="font-size:11px">'+(p.lineaNegocio||'Sin línea de negocio')+'</div></td>'
      + cells
      + '<td class="mono" style="text-align:right; font-weight:700">'+fmtCLP(totalPlan)+'</td>'
      + '<td class="mono" style="text-align:right; font-weight:700; color:var(--teal)">'+fmtCLP(totalReal)+'</td>'
      + '</tr>';
  }).join('');

  const totalPlanAnual = totalesPlan.reduce((a,b)=>a+b,0);
  const totalRealAnual = totalesReal.reduce((a,b)=>a+b,0);
  const totalRow = '<tr style="background:var(--bg)"><td><b>Total portafolio</b></td>'
    + monthsShort.map((_,i)=>cellHtml(totalesPlan[i], totalesReal[i], year+'-'+String(i+1).padStart(2,'0'))).join('')
    + '<td class="mono" style="text-align:right; font-weight:800">'+fmtCLP(totalPlanAnual)+'</td>'
    + '<td class="mono" style="text-align:right; font-weight:800; color:var(--teal)">'+fmtCLP(totalRealAnual)+'</td></tr>';

  return '<div class="card">'
    + header
    + '<div style="display:flex; gap:8px; align-items:center; font-size:12px; margin-bottom:12px; flex-wrap:wrap">'
    + '<span style="display:flex; align-items:center; gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block"></span> Facturado completo</span>'
    + '<span style="display:flex; align-items:center; gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block"></span> Pendiente (aún no vence)</span>'
    + '<span style="display:flex; align-items:center; gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block"></span> Vencido sin facturar</span>'
    + '</div>'
    + '<div style="overflow-x:auto"><table style="min-width:1040px"><thead><tr><th>Proyecto</th>'+monthsShort.map(m=>'<th style="text-align:center">'+m+'</th>').join('')+'<th class="num">Total Plan</th><th class="num">Total Real</th></tr></thead><tbody>'+rows+totalRow+'</tbody></table></div>'
    + '</div>';
}

function renderContent(){
  const el = document.getElementById('content');
  if(!state.loaded){ el.innerHTML = '<div class="loading">Cargando datos…</div>'; return; }
  renderSubnav();
  if(state.macroSection === 'comercial'){
    el.innerHTML = renderPipelineComercialPlaceholder();
    return;
  }
  if(state.macroSection === 'gantt'){
    el.innerHTML = renderGanttFacturacion();
    return;
  }
  if(state.detailView && state.detailView.type==='project'){
    el.innerHTML = renderProjectDetailPage(state.detailView.id);
    renderProjectDetailCharts(state.detailView.id);
    return;
  }
  if(state.detailView && state.detailView.type==='person'){
    el.innerHTML = renderPersonDetailPage(state.detailView.id);
    return;
  }
  if(state.mainView==='dashboard'){
    el.innerHTML = renderDashboard();
    renderDashboardCharts();
  }
  else if(state.mainView==='hh'){
    if(state.hhSubTab==='cargar') el.innerHTML = renderCargar();
    else el.innerHTML = renderProyectos();
  }
  else if(state.mainView==='config') el.innerHTML = renderConfig();
}

function dashBreadcrumb(){

  if(nav.unidad) parts.push('<a onclick="dashGoto({unidad:\''+nav.unidad+'\'})" class="'+(nav.unidad&&!nav.linea?'active':'')+'">'+nav.unidad+'</a>');
  if(nav.linea) parts.push('<a onclick="dashGoto({unidad:\''+nav.unidad+'\',linea:\''+nav.linea+'\'})" class="'+(nav.linea&&!nav.projectId?'active':'')+'">'+nav.linea+'</a>');

function getAvailableYears(){
  const set = new Set();
  const currentY = String(new Date().getFullYear());
  set.add(currentY);
  (state.realEntries||[]).forEach(e => { if(e.month) set.add(e.month.slice(0,4)); });
  (state.projects||[]).forEach(p => {
    (p.assignments||[]).forEach(a => {
      Object.keys(a.projectedByMonth||{}).forEach(m => set.add(m.slice(0,4)));
    });
  });
  return Array.from(set).sort().reverse();
}

function initDashFilters(){
  if(!Array.isArray(state.dashYearsFilter)) state.dashYearsFilter = [String(new Date().getFullYear())];
  if(!Array.isArray(state.dashMonthsFilter)) state.dashMonthsFilter = [];
  initEntityFilters();
}

function initEntityFilters(){
  if(!state.dashFilterUnidad) state.dashFilterUnidad = 'all';
  if(!state.dashFilterLinea) state.dashFilterLinea = 'all';
  if(!state.dashFilterProyecto) state.dashFilterProyecto = 'all';
}

function setDashEntityFilter(type, value){
  initEntityFilters();
  if(type === 'unidad') {
    state.dashFilterUnidad = value;
    if(value !== 'all' && state.dashFilterLinea !== 'all'){
      const lineasInU = new Set(lineasDeUnidad(value));
      if(!lineasInU.has(state.dashFilterLinea)) state.dashFilterLinea = 'all';
    }
  } else if(type === 'linea') {
    state.dashFilterLinea = value;
    if(value !== 'all'){
      const obj = (state.config.lineasNegocio||[]).find(l => l.nombre === value);
      if(obj && obj.unidad) state.dashFilterUnidad = obj.unidad;
    }
  } else if(type === 'proyecto') {
    state.dashFilterProyecto = value;
    if(value !== 'all'){
      const proj = state.projects.find(p => p.id === value);
      if(proj && proj.lineaNegocio) {
        state.dashFilterLinea = proj.lineaNegocio;
        const obj = (state.config.lineasNegocio||[]).find(l => l.nombre === proj.lineaNegocio);
        if(obj && obj.unidad) state.dashFilterUnidad = obj.unidad;
      }
    }
  }
  renderAll();
}

function resetDashEntityFilters(){
  state.dashFilterUnidad = 'all';
  state.dashFilterLinea = 'all';
  state.dashFilterProyecto = 'all';
  renderAll();
}

function isProjectInEntityFilter(p){
  initEntityFilters();
  if(!p) return true;

  if(state.dashFilterProyecto !== 'all' && p.id !== state.dashFilterProyecto) return false;
  if(state.dashFilterLinea !== 'all' && (p.lineaNegocio || '') !== state.dashFilterLinea) return false;

  if(state.dashFilterUnidad !== 'all'){
    const unidadPeople = new Set(peopleInUnidad(state.dashFilterUnidad).map(x=>x.id));
    const hasAssignedInUnidad = (p.assignments||[]).some(a => unidadPeople.has(a.personId));
    const lineasInU = new Set(lineasDeUnidad(state.dashFilterUnidad));
    const isLineInUnidad = p.lineaNegocio && lineasInU.has(p.lineaNegocio);
    if(!hasAssignedInUnidad && !isLineInUnidad) return false;
  }

  return true;
}

function isPersonInEntityFilter(person){
  initEntityFilters();
  if(!person) return true;

  if(state.dashFilterUnidad !== 'all'){
    const unidadPeople = new Set(peopleInUnidad(state.dashFilterUnidad).map(x=>x.id));
    if(!unidadPeople.has(person.id)) return false;
  }

  if(state.dashFilterLinea !== 'all'){
    if((person.lineaNegocio || '') !== state.dashFilterLinea) return false;
  }

  if(state.dashFilterProyecto !== 'all'){
    const proj = state.projects.find(x => x.id === state.dashFilterProyecto);
    if(proj){
      const assignedIds = new Set((proj.assignments||[]).map(a => a.personId));
      if(!assignedIds.has(person.id)) return false;
    }
  }

  return true;
}

function isMonthInFilter(monthStr){
  if(!monthStr) return false;
  initDashFilters();
  const parts = monthStr.split('-');
  if(parts.length < 2) return false;
  const y = parts[0], m = parts[1];

  const yearMatch = state.dashYearsFilter.length === 0 || state.dashYearsFilter.includes('all') || state.dashYearsFilter.includes(y);
  const monthMatch = state.dashMonthsFilter.length === 0 || state.dashMonthsFilter.includes('all') || state.dashMonthsFilter.includes(m);
  return yearMatch && monthMatch;
}

function toggleDashYear(year){
  initDashFilters();
  if(year === 'all'){
    state.dashYearsFilter = ['all'];
  } else {
    state.dashYearsFilter = state.dashYearsFilter.filter(x => x !== 'all');
    if(state.dashYearsFilter.includes(year)){
      state.dashYearsFilter = state.dashYearsFilter.filter(x => x !== year);
    } else {
      state.dashYearsFilter.push(year);
    }
    if(state.dashYearsFilter.length === 0) state.dashYearsFilter = ['all'];
  }
  renderContent();
}

function toggleDashMonth(monthNum){
  initDashFilters();
  if(monthNum === 'all'){
    state.dashMonthsFilter = [];
  } else {
    state.dashMonthsFilter = state.dashMonthsFilter.filter(x => x !== 'all');
    if(state.dashMonthsFilter.includes(monthNum)){
      state.dashMonthsFilter = state.dashMonthsFilter.filter(x => x !== monthNum);
    } else {
      state.dashMonthsFilter.push(monthNum);
    }
  }
  renderContent();
}

function renderDashTimeFilterPanel(){

  years.forEach(y => {
    const active = !allYearsActive && state.dashYearsFilter.includes(y);
    yearPills += '<button class="btn btn-sm '+(active?'btn-primary':'btn-secondary')+'" style="border-radius:14px; padding:3px 10px; font-size:12px;" onclick="toggleDashYear(\''+y+'\')">' + (active ? '✓ ' : '') + y + '</button>';
  });

  const allMonthsActive = state.dashMonthsFilter.length === 0 || state.dashMonthsFilter.includes('all');
  let monthPills = '<button class="btn btn-sm '+(allMonthsActive?'btn-primary':'btn-secondary')+'" style="border-radius:14px; padding:3px 10px; font-size:12px;" onclick="toggleDashMonth(\'all\')">Todos los Meses (12M)</button>';

    monthPills += '<button class="btn btn-sm '+(active?'btn-primary':'btn-secondary')+'" style="border-radius:14px; padding:3px 10px; font-size:12px;" onclick="toggleDashMonth(\''+mNum+'\')">' + (active ? '✓ ' : '') + mLabel + '</button>';
  });

  let periodText = '';
  if(allYearsActive) periodText += 'Años: Todos';
  else periodText += 'Años: ' + state.dashYearsFilter.join(', ');

  if(allMonthsActive) periodText += ' · Meses: Todos';
  else {
    const monthNames = state.dashMonthsFilter.map(m => monthsShort[parseInt(m, 10)-1]);
    periodText += ' · Meses: ' + monthNames.join(', ');

  // Dropdown options

  const lineas = state.config.lineasNegocio || [];

  } else if(state.dashFilterUnidad !== 'all') {
    filteredProjects = projects.filter(p => isProjectInEntityFilter(p));
  }
  const pOpts = '<option value="all">📊 Todos los Proyectos</option>'
    + filteredProjects.map(p => '<option value="'+p.id+'" '+(state.dashFilterProyecto===p.id?'selected':'')+'>' + (p.tipo==='admin'?'⚙️ ':'📂 ') + p.name + '</option>').join('');

  const hasEntityFilter = state.dashFilterUnidad !== 'all' || state.dashFilterLinea !== 'all' || state.dashFilterProyecto !== 'all';

  return '<div style="background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:18px; box-shadow:var(--card-shadow);">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">'
    + '<div style="display:flex; align-items:center; gap:8px;">'
    + '<span style="font-size:13px; font-weight:700; color:var(--text)">📅 Filtros de Dashboard (Tiempo y Estructura)</span>'
    + '<span class="chip" style="background:var(--bg); color:var(--muted); font-size:11.5px; font-weight:600;">' + periodText + '</span>'
    + '</div>'

function getFilteredTotals(){
  initEntityFilters();
  let projClient = 0, actClient = 0;
  let projAdmin = 0, actAdmin = 0;

  state.projects.forEach(p => {
    if(!isProjectInEntityFilter(p)) return;
    const isAdmin = p.tipo === 'admin';
    (p.assignments||[]).forEach(a => {
      Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
        if(isMonthInFilter(m)){
          if(isAdmin) projAdmin += Number(h||0);
          else projClient += Number(h||0);
        }
      });
    });
  });

  state.realEntries.forEach(e => {
    if(isMonthInFilter(e.month)){
      const hours = Number(e.hours||0);
      const proj = state.projects.find(p => p.id === e.projectId);
      if(proj && !isProjectInEntityFilter(proj)) return;
      if(e.category === 'admin') {
        actAdmin += hours;
      } else {
        if(proj && proj.tipo === 'admin') actAdmin += hours;
        else actClient += hours;
      }
    }
  });

  return { projClient, actClient, projAdmin, actAdmin };
}

// Curva de facturación acumulada (real facturado) con una línea por Unidad o por
// Línea de Negocio, para comparar el ritmo de facturación entre ellas.
function createFacturacionMultiLineChart(canvasId, chartKey, scopeType){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(activeCharts[chartKey]){ activeCharts[chartKey].destroy(); activeCharts[chartKey]=null; }

  const nombres = scopeType==='unidad' ? (state.config.unidades||[]) : (state.config.lineasNegocio||[]).map(l=>l.nombre);
  const monthsShort = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const palette = ['#1E2A5E','#1E9E8B','#DB9A2E','#D6493E','#7C5CBF','#2E86AB','#C2185B','#43A047'];

  const datasets = nombres.map((nombre, idx)=>{
    const projects = scopeType==='unidad' ? projectsInUnidad(nombre) : projectsInLinea(nombre);
    const monthly = Array(12).fill(0);
    projects.forEach(p=>{
      if(!p.montoVenta) return;
      (p.hitosFacturacion||[]).forEach(h=>{
        if(h.estado!=='facturado') return;
        const fecha = h.fechaFacturado || h.fecha;
        if(!fecha || !isMonthInFilter(fecha.slice(0,7))) return;
        const mNum = parseInt(fecha.slice(5,7),10);
        if(mNum>=1 && mNum<=12) monthly[mNum-1] += Number(p.montoVenta||0)*Number(h.pctVenta||0)/100;
      });
    });
    let cum=0; const cumData = monthly.map(v=>{ cum+=v; return cum; });
    return { label: nombre, data: cumData, borderColor: palette[idx%palette.length], backgroundColor: 'transparent', tension: 0.25 };
  });

  activeCharts[chartKey] = new Chart(ctx, {
    type: 'line',
    data: { labels: monthsShort, datasets: datasets.length ? datasets : [{label:'Sin datos', data:Array(12).fill(0), borderColor:'#94A3B8'}] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: function(c){ return c.dataset.label+': '+fmtCLP(c.raw); } } } },
      scales: { y: { beginAtZero: true, ticks: { callback: function(v){ return fmtCLP(v); } } } }
    }
  });
}

function createUnidadChart(canvasId, chartKey, filterType){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(activeCharts[chartKey]){ activeCharts[chartKey].destroy(); activeCharts[chartKey]=null; }

  const unidades = state.config.unidades || [];
  const labelsU = [];
  const projU = [];
  const actU = [];

  unidades.forEach(u => {
    labelsU.push(u);
    const personIds = new Set(peopleInUnidad(u).map(p=>p.id));
    let pH = 0, aH = 0;

    state.projects.forEach(p => {
      const matchProj = (filterType === 'all') || (filterType === 'proyectos' && p.tipo !== 'admin') || (filterType === 'admin' && p.tipo === 'admin');
      if(matchProj){
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId)){
            Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
              if(isMonthInFilter(m)) pH += Number(h||0);
            });
          }
        });
      }
    });

    state.realEntries.forEach(e => {
      if(isMonthInFilter(e.month) && personIds.has(e.personId)){
        let isAdmin = e.category === 'admin';
        if(!isAdmin && e.projectId){
          const proj = state.projects.find(p => p.id === e.projectId);
          if(proj && proj.tipo === 'admin') isAdmin = true;
        }
        const matchEntry = (filterType === 'all') || (filterType === 'proyectos' && !isAdmin) || (filterType === 'admin' && isAdmin);
        if(matchEntry){
          aH += Number(e.hours||0);
        }
      }
    });

    projU.push(pH);
    actU.push(aH);
  });

  const realColor = (filterType === 'admin') ? '#DB9A2E' : '#1E9E8B';

  activeCharts[chartKey] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labelsU.length ? labelsU : ['Sin unidades'],
      datasets: [
        { label: 'HH Proyectadas', data: projU.length ? projU : [0], backgroundColor: '#1E2A5E', borderRadius: 4, maxBarThickness: 35 },
        { label: 'HH Reales (Ejecutadas)', data: actU.length ? actU : [0], backgroundColor: realColor, borderRadius: 4, maxBarThickness: 35 }

    options: {
      indexAxis: 'y',

      plugins: {
        legend: { position: 'top' },
        tooltip: { callbacks: { label: function(c){ return c.dataset.label + ': ' + fmtH(c.raw) + ' h'; } } }
      },
      scales: { x: { beginAtZero: true, ticks: { callback: function(val){ return val + ' h'; } } } }
    }
  });

function exportFullReportExcel(){
  try {
    const wb = XLSX.utils.book_new();

    // Tab 1: Proyectos
    const projHeaders = ['PEP', 'Nombre Proyecto', 'Cliente', 'Estado', 'Fecha Inicio', 'Fecha Cierre', 'HH Proyectadas', 'HH Reales', 'Avance %'];
    const projRows = state.projects.map(p => {
      const t = projectTotals(p);
      const pct = t.projectedHours > 0 ? Math.round((t.actualHours / t.projectedHours) * 100) + '%' : '—';
      return [
        p.pep || '',
        p.name,
        p.client || '',
        p.status,
        p.fechaInicio || '',
        p.fechaCierre || '',
        t.projectedHours,
        t.actualHours,
        pct
      ];
    });
    const wsProj = XLSX.utils.aoa_to_sheet([projHeaders].concat(projRows));
    XLSX.utils.book_append_sheet(wb, wsProj, 'Resumen Proyectos');

    // Tab 2: Roles
    const roleHeaders = ['Rol / Cargo', 'Integrantes', 'Nombres Integrantes', 'Capacidad Total Mensual (h)', 'Total HH Proyectadas', 'Total HH Reales'];
    const roleRows = getAllRoles().map(r => {
      const peopleInR = peopleWithRole(r);
      const namesStr = peopleInR.map(p => p.name).join(', ');
      let totalProj = 0;
      state.projects.forEach(pr => {
        (pr.assignments || []).forEach(a => {
          if (a.role === r) totalProj += assignmentProjectedTotal(a);
        });
      });
      const personIds = new Set(peopleInR.map(p => p.id));
      let totalAct = state.realEntries.filter(e => personIds.has(e.personId)).reduce((s, e) => s + Number(e.hours||0), 0);
      return [
        r,
        peopleInR.length,
        namesStr,
        roleCapacity(r),
        totalProj,
        totalAct
      ];
    });
    const wsTeam = XLSX.utils.aoa_to_sheet([roleHeaders].concat(roleRows));
    XLSX.utils.book_append_sheet(wb, wsTeam, 'Resumen por Roles');

    // Tab 3: Registros Reales
    const entryHeaders = ['Mes', 'Categoría', 'Proyecto / Referencia', 'Persona', 'Rol', 'Horas Reales', 'Nota', 'Fuente'];
    const entryRows = state.realEntries.map(e => {
      const person = getPerson(e.personId);
      const proj = e.projectId ? state.projects.find(pr => pr.id === e.projectId) : null;
      return [
        e.month,
        e.category === 'admin' ? 'Administración' : 'Proyecto',
        e.category === 'admin' ? 'Administración' : (proj ? proj.name : 'Proyecto Eliminado'),
        person ? person.name : '',
        person ? person.role : '',
        e.hours,
        e.note || '',
        e.source || 'manual'
      ];
    });
    const wsEntries = XLSX.utils.aoa_to_sheet([entryHeaders].concat(entryRows));
    XLSX.utils.book_append_sheet(wb, wsEntries, 'Registros Reales');

    XLSX.writeFile(wb, 'HH_Tracker_Reporte_Consolidado_' + currentMonth() + '.xlsx');
    showToast('Reporte Excel generado correctamente.');
  } catch(err) {
    console.error(err);
    showToast('Error al exportar reporte Excel.');
  }
}

function renderDashAllUnits(){
  const unidades = state.config.unidades||[];

  const sinUnidad = state.people.filter(p=>!clasificados.has(p.id));

  let html = '<div class="section-label">Todas las Unidades de Negocio</div>';
  if(unidades.length===0 && sinUnidad.length===0){
    return html + '<div class="card"><div class="empty"><div class="display">Sin unidades configuradas</div></div></div>';
  }
  html += unidades.map(u=>{

function renderDashUnidadesComplianceTable(){
  initDashFilters();
  const year = (state.dashYearsFilter.length === 1 && state.dashYearsFilter[0] !== 'all')
    ? state.dashYearsFilter[0]
    : String(new Date().getFullYear());

  const monthsShort = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const monthsFull = monthsShort.map((m, idx) => {
    return { num: String(idx + 1).padStart(2, '0'), name: m };
  });

  const unidades = (state.config.unidades || []).filter(u => {
    if(state.dashFilterUnidad !== 'all' && u !== state.dashFilterUnidad) return false;
    return true;
  });
  if(unidades.length === 0){
    return '<div class="card"><div class="empty"><div class="display">Sin Unidades de Negocio configuradas o coincidentes con el filtro</div></div></div>';
  }

  let headCols = monthsFull.map(m => '<th class="num" style="font-size:11.5px; padding:6px 8px; text-align:center">' + m.name + '</th>').join('');
  headCols += '<th class="num" style="font-size:11.5px; padding:6px 8px; text-align:center; background:var(--surface)">Total %</th>';

  const rows = unidades.map(u => {
    const personIds = new Set(peopleInUnidad(u).map(p=>p.id));

    let totalProj = 0, totalAct = 0;
    const monthCells = monthsFull.map(m => {
      const monthKey = year + '-' + m.num;
      const isFiltered = isMonthInFilter(monthKey);

      let projM = 0, actM = 0;
      state.projects.forEach(p => {
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId) && a.projectedByMonth && a.projectedByMonth[monthKey]){
            projM += Number(a.projectedByMonth[monthKey] || 0);
          }
        });
      });

      state.realEntries.forEach(e => {
        if(isMonthInFilter(e.month) && e.month === monthKey && personIds.has(e.personId)){
          actM += Number(e.hours || 0);
        }
      });

      totalProj += projM;
      totalAct += actM;

      if(!isFiltered) return '<td class="muted" style="text-align:center; opacity:0.35; font-size:11px">—</td>';

      if(projM === 0 && actM === 0) return '<td class="muted" style="text-align:center; font-size:11px">—</td>';

      if(projM === 0 && actM > 0){
        return '<td style="text-align:center; font-size:11px; font-weight:700; color:var(--amber)" title="' + fmtH(actM) + 'h ejec. sin proyección">!' + fmtH(actM) + 'h</td>';
      }

      const ratio = actM / projM;
      const pctVal = Math.round(ratio * 100);
      let color = 'var(--teal)';
      if(ratio > 1.1) color = 'var(--red)';
      else if(ratio < 0.7) color = 'var(--amber)';

      return '<td style="text-align:center; font-size:11.5px; font-weight:700; color:' + color + '" title="Proy: ' + fmtH(projM) + 'h | Real: ' + fmtH(actM) + 'h">' + pctVal + '%</td>';
    }).join('');

    const totalRatio = totalProj > 0 ? (totalAct / totalProj) : (totalAct > 0 ? 2 : 0);
    const totalPct = totalProj > 0 ? Math.round(totalRatio * 100) + '%' : (totalAct > 0 ? '—' : '0%');
    let totalColor = 'var(--teal)';
    if(totalRatio > 1.1) totalColor = 'var(--red)';
    else if(totalRatio < 0.7 && totalProj > 0) totalColor = 'var(--amber)';

    return '<tr>'
      + '<td style="font-size:12.5px; padding:8px 10px; font-weight:700;">🏢 ' + u + '</td>'
      + monthCells
      + '<td class="mono" style="text-align:center; font-weight:800; font-size:12px; color:' + totalColor + '; background:var(--surface)">' + totalPct + '</td>'
      + '</tr>';
  }).join('');

  return '<div class="card" style="margin-bottom:20px;">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">'
    + '<div>'
    + '<div class="card-title" style="font-size:15px; font-weight:700">🏢 Nivel 1: Matriz de Cumplimiento por Unidad de Negocio (%)</div>'
    + '<div class="card-sub" style="font-size:12px">% Cumplimiento (HH Reales vs. Proyectadas) acumuladas por Unidad — Año ' + year + '</div>'
    + '</div>'
    + '</div>'
    + '<div style="overflow-x:auto">'
    + '<table style="width:100%; border-collapse:collapse; min-width:860px;">'
    + '<thead><tr style="border-bottom:2px solid var(--border)">'
    + '<th style="text-align:left; font-size:12px; padding:6px 10px;">Unidad de Negocio</th>'
    + headCols
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>'
    + '</div>'
    + '</div>';
}

function renderDashInsightsBanner(){
  initDashFilters();
  const year = (state.dashYearsFilter.length === 1 && state.dashYearsFilter[0] !== 'all')
    ? state.dashYearsFilter[0]
    : String(new Date().getFullYear());

  let totalProjH = 0, totalActH = 0, totalProjCost = 0, totalActCost = 0;
  let overbudgetProjects = [];
  let unprojectedHoursProjects = [];

  state.projects.forEach(p => {
    let pProjH = 0, pActH = 0;
    (p.assignments||[]).forEach(a => {
      Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
        if(isMonthInFilter(m)) pProjH += Number(h||0);
      });
    });
    state.realEntries.forEach(e => {
      if(isMonthInFilter(e.month)){
        if(e.category !== 'admin' && e.projectId === p.id){
          pActH += Number(e.hours||0);
        } else if(p.tipo === 'admin' && e.category === 'admin'){
          pActH += Number(e.hours||0);
        }
      }
    });

    totalProjH += pProjH;
    totalActH += pActH;
    
    if(pProjH > 0 && pActH > pProjH * 1.1){
      overbudgetProjects.push({ name: p.name, proj: pProjH, act: pActH });
    } else if(pProjH === 0 && pActH > 0){
      unprojectedHoursProjects.push({ name: p.name, act: pActH });
    }
  });

  // Find most efficient line
  let bestLine = '—', bestLineRatio = 999;
  (state.config.lineasNegocio||[]).forEach(l => {
    const personIds = new Set(peopleInLinea(l.nombre).map(p=>p.id));
    let pH = 0, aH = 0;
    state.projects.forEach(p => {
      (p.assignments||[]).forEach(a => {
        if(personIds.has(a.personId)){
          Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
            if(isMonthInFilter(m)) pH += Number(h||0);
          });
        }
      });
    });
    state.realEntries.forEach(e => {
      if(isMonthInFilter(e.month) && personIds.has(e.personId)){
        aH += Number(e.hours||0);
      }
    });

    if(pH > 0){
      const diff = Math.abs(1 - (aH / pH));
      if(diff < bestLineRatio){
        bestLineRatio = diff;
        bestLine = l.nombre + ' (' + Math.round((aH / pH)*100) + '% cumplimiento)';
      }
    }
  });

  let insightsList = [];
  if(overbudgetProjects.length > 0){
    insightsList.push('<div class="alert-item red">🚨 <b>Desviación Crítica:</b> ' + overbudgetProjects.length + ' proyecto(s) superan el 110% de HH planificadas (' + overbudgetProjects.map(p=>p.name).join(', ') + ').</div>');
  } else {
    insightsList.push('<div class="alert-item teal" style="background:var(--teal-bg); color:var(--teal)">🟢 <b>Presupuesto Saludable:</b> Ningún proyecto excede significativamente el margen proyectado.</div>');
  }

  if(unprojectedHoursProjects.length > 0){
    insightsList.push('<div class="alert-item amber">⚠️ <b>Horas No Planificadas:</b> ' + unprojectedHoursProjects.length + ' proyecto(s) registraron ejecuciones sin contar con proyección previa.</div>');
  }

  if(bestLine !== '—'){
    insightsList.push('<div class="alert-item" style="background:var(--accent-bg); color:var(--accent)">🏆 <b>Línea de Negocio Destacada:</b> ' + bestLine + '.</div>');
  }

  return '<div class="card" style="border-left:3px solid var(--accent); margin-bottom:20px;">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">'
    + '<div style="display:flex; align-items:center; gap:8px;">'
    + '<span style="font-size:20px;">💡</span>'
    + '<div>'
    + '<div class="card-title" style="font-size:15px; font-weight:700">Diagnóstico e Insights del Portafolio</div>'
    + '<div class="card-sub" style="font-size:12px">Análisis analítico automatizado 100% local en tiempo real — Año ' + year + '</div>'
    + '</div>'
    + '</div>'
    + '<div style="display:flex; gap:10px;">'
    + '<button class="btn btn-secondary btn-sm no-print" onclick="exportComplianceMatrixCSV()">📥 Exportar Matriz CSV/Excel</button>'
    + '</div>'
    + '</div>'
    + '<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:10px; margin-top:8px;">'
    + insightsList.join('')
    + '</div>'
    + '</div>';
}
