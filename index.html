  let csvRows = [];
  csvRows.push(['MATRIZ DE CUMPLIMIENTO DE HORAS HOMBRE (%) - AÑO ' + year]);
  csvRows.push([]);

  // 1. Unidades
  csvRows.push(['Nivel 1: Unidad de Negocio', ...monthsShort, 'Total %']);
  (state.config.unidades||[]).forEach(u => {
    const personIds = new Set(peopleInUnidad(u).map(p=>p.id));
    let totalProj = 0, totalAct = 0;
    const mPcts = monthsFull.map(mNum => {
      const monthKey = year + '-' + mNum;
      let pM = 0, aM = 0;
      state.projects.forEach(p => {
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId) && a.projectedByMonth && a.projectedByMonth[monthKey]) pM += Number(a.projectedByMonth[monthKey]||0);
        });
      });
      state.realEntries.forEach(e => {
        if(e.month === monthKey && personIds.has(e.personId)) aM += Number(e.hours||0);
      });
      totalProj += pM; totalAct += aM;
      return pM > 0 ? Math.round((aM/pM)*100) + '%' : (aM > 0 ? '!h' : '—');
    });
    const totPct = totalProj > 0 ? Math.round((totalAct/totalProj)*100) + '%' : '—';
    csvRows.push([u, ...mPcts, totPct]);
  });

  csvRows.push([]);
  // 2. Lineas
  csvRows.push(['Nivel 2: Linea de Negocio (Unidad)', ...monthsShort, 'Total %']);
  (state.config.lineasNegocio||[]).forEach(l => {
    const personIds = new Set(peopleInLinea(l.nombre).map(p=>p.id));
    const label = l.nombre + (l.unidad ? ' (' + l.unidad + ')' : '');
    let totalProj = 0, totalAct = 0;
    const mPcts = monthsFull.map(mNum => {
      const monthKey = year + '-' + mNum;
      let pM = 0, aM = 0;
      state.projects.forEach(p => {
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId) && a.projectedByMonth && a.projectedByMonth[monthKey]) pM += Number(a.projectedByMonth[monthKey]||0);
        });
      });
      state.realEntries.forEach(e => {
        if(e.month === monthKey && personIds.has(e.personId)) aM += Number(e.hours||0);
      });
      totalProj += pM; totalAct += aM;
      return pM > 0 ? Math.round((aM/pM)*100) + '%' : (aM > 0 ? '!h' : '—');
    });
    const totPct = totalProj > 0 ? Math.round((totalAct/totalProj)*100) + '%' : '—';
    csvRows.push([label, ...mPcts, totPct]);
  });

  csvRows.push([]);
  // 3. Proyectos
  csvRows.push(['Nivel 3: Proyecto (Linea de Negocio)', ...monthsShort, 'Total %']);
  state.projects.forEach(p => {
    const label = p.name + (p.lineaNegocio ? ' (' + p.lineaNegocio + ')' : '');
    let totalProj = 0, totalAct = 0;
    const mPcts = monthsFull.map(mNum => {
      const monthKey = year + '-' + mNum;
      let pM = 0, aM = 0;
      (p.assignments||[]).forEach(a => {
        if(a.projectedByMonth && a.projectedByMonth[monthKey]) pM += Number(a.projectedByMonth[monthKey]||0);
      });
      state.realEntries.forEach(e => {
        if(e.projectId === p.id && e.month === monthKey) aM += Number(e.hours||0);
      });
      totalProj += pM; totalAct += aM;
      return pM > 0 ? Math.round((aM/pM)*100) + '%' : (aM > 0 ? '!h' : '—');
    });
    const totPct = totalProj > 0 ? Math.round((totalAct/totalProj)*100) + '%' : '—';
    csvRows.push([label, ...mPcts, totPct]);
  });

  let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.map(e => e.map(x => '"' + String(x||'').replace(/"/g, '""') + '"').join(",")).join("\n");
  let encodedUri = encodeURI(csvContent);
  let link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "matriz_cumplimiento_hh_" + year + ".csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function downloadJSONBackup(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
    projects: state.projects,
    people: state.people,
    realEntries: state.realEntries,
    config: state.config,
    exportedAt: new Date().toISOString()
  }, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", "hh_tracker_backup_" + (new Date().toISOString().slice(0,10)) + ".json");
  document.body.appendChild(dlAnchorElem);
  dlAnchorElem.click();
  dlAnchorElem.remove();
  showToast("✅ Respaldo JSON descargado con éxito.");
}

function uploadJSONBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const imported = JSON.parse(e.target.result);
      if(imported.projects && Array.isArray(imported.projects)) state.projects = imported.projects;
      if(imported.people && Array.isArray(imported.people)) state.people = imported.people;
      if(imported.realEntries && Array.isArray(imported.realEntries)) state.realEntries = imported.realEntries;
      if(imported.config) state.config = imported.config;

      persistProjects();
      persistPeople();
      persistEntries();
      persistConfig();
      renderAll();
      showToast("✅ Respaldo restaurado con éxito.");
    } catch(err){
      alert("Error al leer el archivo JSON de respaldo. Verifique que el formato sea válido.");
    }
  };
  reader.readAsText(file);
}

  const q = normalizeStr(query);
  let results = [];

  // 1. Projects & PEPs
  state.projects.forEach(p => {
    if(!q || normalizeStr(p.name).includes(q) || (p.pep && normalizeStr(p.pep).includes(q)) || (p.lineaNegocio && normalizeStr(p.lineaNegocio).includes(q))){
      results.push({
        type: 'Proyecto',
        icon: '📂',
        title: p.name,
        sub: (p.pep ? 'PEP: ' + p.pep + ' · ' : '') + (p.lineaNegocio || 'Sin LN'),
        action: () => { toggleOmniboxModal(); dashGoto({projectId: p.id}); }
      });
    }
  });

  // 2. Roles
  getAllRoles().forEach(r => {
    if(!q || normalizeStr(r).includes(q)){
      const peopleInR = peopleWithRole(r);
      results.push({
        type: 'Rol / Cargo',
        icon: '👤',
        title: r,
        sub: peopleInR.length + ' integrante(s) en este rol',
        action: () => { toggleOmniboxModal(); setDashMode('roles'); }
      });
    }
  });

  // 3. Business Lines
  (state.config.lineasNegocio||[]).forEach(l => {
    if(!q || normalizeStr(l.nombre).includes(q) || (l.unidad && normalizeStr(l.unidad).includes(q))){
      results.push({
        type: 'Línea de Negocio',
        icon: '🏷️',
        title: l.nombre,
        sub: l.unidad ? 'Unidad: ' + l.unidad : 'Sin unidad',
        action: () => { toggleOmniboxModal(); dashGoto({linea: l.nombre, unidad: l.unidad||''}); }
      });
    }
  });

  // 4. Business Units
  (state.config.unidades||[]).forEach(u => {
    if(!q || normalizeStr(u).includes(q)){
      results.push({
        type: 'Unidad de Negocio',
        icon: '🏢',
        title: u,
        sub: 'Unidad de Negocio',
        action: () => { toggleOmniboxModal(); dashGoto({unidad: u}); }
      });
    }
  });

  if(results.length === 0){
    container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted)">No se encontraron coincidencias</div>';
    return;
  }

  container.innerHTML = results.slice(0, 12).map((item, idx) => {
    return `<div onclick="window._omniboxActions[${idx}]()" style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:8px; border:1px solid var(--border); cursor:pointer; transition:background .15s;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:16px;">${item.icon}</span>
        <div>
          <div style="font-weight:700; font-size:13.5px;">${item.title}</div>
          <div style="font-size:11.5px; color:var(--muted);">${item.sub}</div>
        </div>
      </div>
      <span class="chip">${item.type}</span>
    </div>`;
  }).join('');

  window._omniboxActions = results.slice(0, 12).map(r => r.action);
}

// Resumen de rentabilidad agregada del portafolio: la misma capa financiera que se ve
// por proyecto (sección 5.1 de la propuesta: tres lecturas de margen), pero sumada
// a nivel de cartera completa, con ranking de riesgo clickeable a cada proyecto.
function renderAnalisisFinancieroGeneral(){
  const projectsConVenta = state.projects.filter(p=>p.tipo!=='admin' && Number(p.montoVenta||0)>0);
  if(projectsConVenta.length===0) return '';
  const year = String(new Date().getFullYear());

  let venta=0;
  const detalle = projectsConVenta.map(p=>{
    const m = margenesProject(p);
    venta += m.venta;
    return {p, m};
  });
  const facturadoUF = facturadoUFEnAnio(projectsConVenta, year);
  const numProyectos = projectsConVenta.length;
  const promedioPorProyectoUF = numProyectos>0 ? venta/numProyectos : 0;

  const metaPortafolioUF = (state.config.unidades||[]).reduce((s,u)=>{
    const mc = findMetaConfig('unidad', u, year);
    return s + (mc ? Number(mc.metaUF||0) : 0);
  }, 0);
  const hayMetaPortafolio = (state.config.unidades||[]).some(u=>findMetaConfig('unidad', u, year));
  const avanceMetaPct = (hayMetaPortafolio && metaPortafolioUF>0) ? (facturadoUF/metaPortafolioUF*100) : null;

  let sanos=0, enRiesgo=0, criticos=0;
  detalle.forEach(({m})=>{
    const pct = m.proyectadoCierre.pct;
    if(pct==null) return;
    if(pct>=30) sanos++; else if(pct>=15) enRiesgo++; else criticos++;
  });

  const ranking = detalle.slice().sort((a,b)=>{
    const pa = a.m.proyectadoCierre.pct==null ? 999 : a.m.proyectadoCierre.pct;
    const pb = b.m.proyectadoCierre.pct==null ? 999 : b.m.proyectadoCierre.pct;
    return pa-pb;
  });
  const rankingRows = ranking.map(({p,m})=>{
    const pctDev = m.devengado.pct;
    const pctProy = m.proyectadoCierre.pct;
    const t = projectTotals(p);
    return '<tr class="expand-toggle" onclick="openProjectDetail(\''+p.id+'\')">'
      + '<td><b>'+p.name+'</b><div class="muted" style="font-size:11px">'+(p.lineaNegocio||'Sin línea de negocio')+'</div></td>'
      + '<td class="mono" style="text-align:right">'+fmtCLP(m.venta)+'</td>'
      + '<td class="mono" style="text-align:right; color:'+pctBadgeColor(pctProy)+'; font-weight:700">'+(pctProy==null?'—':pctProy.toFixed(0)+'%')+'</td>'
      + '<td class="mono" style="text-align:right; color:'+pctBadgeColor(pctDev)+'; font-weight:700">'+(pctDev==null?'—':pctDev.toFixed(0)+'%')+'</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(t.projectedHours)+' h</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(t.actualHours)+' h</td>'
      + '</tr>';
  }).join('');

  // Desglose por Unidad y por Línea de Negocio.
  const filasUnidad = (state.config.unidades||[]).map(u=>{
    const s = metaScopeStats('unidad', u, year);
    const mc = findMetaConfig('unidad', u, year);
    return {icon:'🏢', nombre:u, s, metaUF: mc ? Number(mc.metaUF||0) : null};
  }).filter(f=>f.s.numProyectos>0);
  const filasLinea = (state.config.lineasNegocio||[]).map(l=>l.nombre).map(l=>{
    const s = metaScopeStats('linea', l, year);
    const mc = findMetaConfig('linea', l, year);
    return {icon:'🏷️', nombre:l, s, metaUF: mc ? Number(mc.metaUF||0) : null};
  }).filter(f=>f.s.numProyectos>0);
  const filasDesglose = filasUnidad.concat(filasLinea).map(f=>{
    // % Avance Meta = lo adjudicado/vendido sobre la meta anual (avance comercial).
    // % Facturación = de lo adjudicado, cuánto ya se ha facturado (avance de cobro) — son dos preguntas distintas.
    const avanceMeta = (f.metaUF!=null && f.metaUF>0) ? (f.s.venta/f.metaUF*100) : null;
    const pctFacturacion = f.s.venta>0 ? (f.s.facturado/f.s.venta*100) : null;
    return '<tr><td>'+f.icon+' <b>'+f.nombre+'</b></td>'
      + '<td class="mono" style="text-align:right">'+f.s.numProyectos+'</td>'
      + '<td class="mono" style="text-align:right">'+(f.metaUF!=null ? fmtCLP(f.metaUF) : '<span class="muted">Sin meta</span>')+'</td>'
      + '<td class="mono" style="text-align:right">'+fmtCLP(f.s.venta)+'</td>'
      + '<td class="mono" style="text-align:right; color:'+(avanceMeta==null?'var(--muted)':pctBadgeColor(avanceMeta))+'; font-weight:700">'+(avanceMeta==null?'—':avanceMeta.toFixed(0)+'%')+'</td>'
      + '<td class="mono" style="text-align:right">'+fmtCLP(f.s.facturado)+'</td>'
      + '<td class="mono" style="text-align:right; color:'+(pctFacturacion==null?'var(--muted)':pctBadgeColor(pctFacturacion))+'; font-weight:700">'+(pctFacturacion==null?'—':pctFacturacion.toFixed(0)+'%')+'</td>'
      + '</tr>';
  }).join('');

  return '<div class="card" style="margin-bottom:20px">'
    + '<div class="card-title" style="font-size:15px; font-weight:700; margin-bottom:4px">💰 Análisis Financiero General</div>'
    + '<div class="card-sub" style="font-size:12.5px; margin-bottom:14px">🟢 '+sanos+' sano(s) · 🟡 '+enRiesgo+' en riesgo · 🔴 '+criticos+' crítico(s) — clasificación según margen proyectado al cierre de cada proyecto</div>'

    + '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-bottom:20px">'
    + kpiBlock('Meta de facturación '+year, 'Suma de las metas anuales configuradas por Unidad de Negocio (Configuración → Metas de Facturación) para '+year+'.', hayMetaPortafolio ? fmtCLP(metaPortafolioUF) : '<span class="muted" style="font-size:15px">Sin meta configurada</span>')
    + kpiBlock('Facturado a la fecha / meta', 'Lo ya facturado este año (hitos marcados como "Facturado") comparado con la meta de facturación del portafolio.', fmtCLP(facturadoUF) + (hayMetaPortafolio ? ' <span class="muted" style="font-size:15px; font-weight:500">/ '+fmtCLP(metaPortafolioUF)+'</span>' : ''), avanceMetaPct!=null ? ('Avance: '+avanceMetaPct.toFixed(0)+'% de la meta') : null)
    + kpiBlock('Cantidad de proyectos', 'Proyectos activos con un monto de venta definido.', String(numProyectos))
    + kpiBlock('Monto promedio de proyectos', 'Venta total del portafolio dividida por la cantidad de proyectos — el tamaño típico de un proyecto.', fmtCLP(promedioPorProyectoUF))
    + '</div>'

    + (filasDesglose ? (
      '<div class="section-label">Desglose por Unidad y Línea de Negocio ('+year+')</div>'
      + '<div style="overflow-x:auto"><table><thead><tr>'
      + '<th>Ámbito</th>'
      + '<th class="num" title="Cantidad de proyectos con venta definida en este ámbito">Nº Proyectos</th>'
      + '<th class="num" title="Meta de facturación configurada para este ámbito en '+year+'">Meta Facturación</th>'
      + '<th class="num" title="Suma del monto vendido/adjudicado de todos sus proyectos">Total adjudicado</th>'
      + '<th class="num" title="Total adjudicado dividido por la meta de este ámbito — cuánto se ha vendido respecto a la meta anual">% Avance Meta</th>'
      + '<th class="num" title="Monto ya facturado este '+year+' en este ámbito">Facturado</th>'
      + '<th class="num" title="Facturado dividido por el total adjudicado — de lo vendido, cuánto ya se ha cobrado">% Facturación</th>'
      + '</tr></thead><tbody>'+filasDesglose+'</tbody></table></div>'
    ) : '')

    + '<div class="section-label">🚦 Rentabilidad por Proyecto (peor margen proyectado primero)</div>'
    + '<div style="overflow-x:auto"><table><thead><tr>'
    + '<th>Proyecto</th>'
    + '<th class="num" title="Monto de venta/adjudicación del proyecto">Monto adjudicación</th>'
    + '<th class="num" title="% sobre la venta total si el proyecto sigue como va">Margen proyectado</th>'
    + '<th class="num" title="% sobre el esfuerzo ya valorizado — rendimiento real de lo ejecutado hasta hoy">Margen real</th>'
    + '<th class="num">HH Proyectadas</th>'
    + '<th class="num">HH Reales</th>'
    + '</tr></thead><tbody>'+rankingRows+'</tbody></table></div>'
    + '</div>';
}

// Cronograma de hitos de facturación de todo el portafolio, ordenado por fecha,
// con los vencidos destacados — la vista "Facturación y descalces" que la propuesta
// describe como parte del panel de portafolio (sección 3.1 / Anexo C.4).
function renderDashVencimientosFacturacion(){
  const hoy = currentMonth()+'-'+String(new Date().getDate()).padStart(2,'0');
  const hitos = [];
  state.projects.forEach(p=>{
    if(p.tipo==='admin') return;
    (p.hitosFacturacion||[]).forEach(h=>{
      if(h.estado==='facturado') return;
      hitos.push({p, h, vencido: h.fecha && h.fecha < hoy});
    });
  });
  if(hitos.length===0) return '';
  hitos.sort((a,b)=> (a.h.fecha||'9999').localeCompare(b.h.fecha||'9999'));

  const rows = hitos.slice(0,8).map(({p,h,vencido})=>{
    const monto = p.montoVenta ? fmtCLP(p.montoVenta*Number(h.pctVenta||0)/100) : '—';
    return '<tr class="expand-toggle" onclick="openProjectDetail(\''+p.id+'\')">'
      + '<td><b>'+p.name+'</b></td>'
      + '<td>'+h.nombre+'</td>'
      + '<td class="mono" style="text-align:right">'+monto+'</td>'
      + '<td>'+(h.fecha||'—')+'</td>'
      + '<td><span class="badge '+(vencido?'pausa':'iniciar')+'">'+(vencido?'Vencido':'Pendiente')+'</span></td>'
      + '</tr>';
  }).join('');

  return '<div class="card" style="margin-bottom:20px">'
    + '<div class="card-title" style="font-size:15px; font-weight:700; margin-bottom:4px">📅 Próximos Vencimientos de Facturación</div>'
    + '<div class="card-sub" style="font-size:12px; margin-bottom:10px">Hitos pendientes de todo el portafolio, ordenados por fecha' + (hitos.length>8 ? ' (mostrando los 8 más próximos de '+hitos.length+')' : '') + '</div>'
    + '<table><thead><tr><th>Proyecto</th><th>Hito</th><th class="num">Monto</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + '</div>';
}

// Metas de facturación por Unidad/Línea: avance, falta, desviación vs. ritmo esperado
// del año, promedio por proyecto y el monto/margen que le tocaría a cada persona en
// promedio (referencial — no una cuota justa por persona, ver nota en metaScopeStats).
function renderMetasFacturacion(){
  const metas = state.config.metasFacturacion||[];
  if(metas.length===0) return '';
  const verCosto = canSeeCostoEmpresa();

  const cards = metas.map(meta=>{
    const stats = metaScopeStats(meta.tipo, meta.nombre, meta.periodo);
    const avancePct = meta.metaUF>0 ? (stats.facturado/meta.metaUF*100) : 0;
    const falta = Math.max(0, meta.metaUF - stats.facturado);
    const fraccion = fraccionAnioTranscurrida(meta.periodo);
    const esperadoAFecha = meta.metaUF * fraccion;
    const desviacion = stats.facturado - esperadoAFecha;
    const desviacionColor = desviacion >= 0 ? 'var(--teal)' : 'var(--red)';
    const metaPorPersona = stats.numPersonas>0 ? (meta.metaUF/stats.numPersonas) : null;
    const margenEstimadoPorPersona = (metaPorPersona!=null && stats.margenPromedioPct!=null) ? metaPorPersona*(stats.margenPromedioPct/100) : null;
    const icon = meta.tipo==='unidad' ? '🏢' : '🏷️';

    return '<div class="card" style="margin-bottom:16px">'
      + '<div class="card-header"><div><div class="card-title">'+icon+' '+meta.nombre+' — Meta '+meta.periodo+'</div>'
      + '<div class="card-sub">'+stats.numProyectos+' proyecto(s) con venta · '+stats.numPersonas+' persona(s) en el equipo</div></div>'
      + '<button class="btn btn-ghost btn-sm" onclick="deleteMetaFacturacionByRef(\''+meta.tipo+'\',\''+meta.nombre.replace(/'/g,"\\'")+'\',\''+meta.periodo+'\')">Eliminar meta</button></div>'
      + '<div style="max-width:560px; margin-bottom:14px">'+gauge(meta.metaUF, stats.facturado, v=>fmtCLP(v), 'meta')+'</div>'
      + '<div style="display:flex; gap:24px; flex-wrap:wrap">'
      + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Facturado / Meta</div><div class="mono" style="font-size:17px; font-weight:700">'+fmtCLP(stats.facturado)+' / '+fmtCLP(meta.metaUF)+'</div></div>'
      + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Falta</div><div class="mono" style="font-size:17px; font-weight:700">'+fmtCLP(falta)+'</div></div>'
      + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Desviación vs. ritmo esperado ('+(fraccion*100).toFixed(0)+'% del año)</div><div class="mono" style="font-size:17px; font-weight:700; color:'+desviacionColor+'">'+(desviacion>=0?'+':'')+fmtCLP(desviacion)+'</div></div>'
      + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Promedio por proyecto</div><div class="mono" style="font-size:17px; font-weight:700">'+fmtCLP(stats.promedioPorProyecto)+'</div></div>'
      + '</div>'
      + '<div class="section-label">👤 Referencial por persona <span class="muted" style="font-weight:400; text-transform:none; font-size:11.5px">(meta ÷ dotación — no es una cuota individual justa, distintos roles facturan distinto)</span></div>'
      + '<div style="display:flex; gap:24px; flex-wrap:wrap">'
      + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Meta de facturación / persona</div><div class="mono" style="font-size:17px; font-weight:700">'+(metaPorPersona!=null?fmtCLP(metaPorPersona):'—')+'</div></div>'
      + (verCosto ? '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Margen estimado / persona</div><div class="mono" style="font-size:17px; font-weight:700">'+(margenEstimadoPorPersona!=null?fmtCLP(margenEstimadoPorPersona):'—')+'</div></div>' : '')
      + '</div>'
      + '</div>';
  }).join('');

  return '<div class="section-label" style="margin-top:24px">🎯 Metas de Facturación</div>' + cards;
}
function deleteMetaFacturacionByRef(tipo, nombre, periodo){
  if(!confirm('¿Eliminar esta meta de facturación?')) return;
  state.config.metasFacturacion = (state.config.metasFacturacion||[]).filter(m=>!(m.tipo===tipo && m.nombre===nombre && m.periodo===periodo));
  persistConfig(); renderAll();
}

// Ocupación por rol: cuánta capacidad tiene cada rol este mes y cuánto ya está
// comprometido el próximo mes según lo proyectado — responde "¿qué rol tiene
// espacio para tomar un proyecto nuevo?". Es por rol (no por persona individual)
// porque las proyecciones de horas del sistema se cargan a nivel de rol, no de
// persona específica — mezclar niveles daría una falsa precisión.
function renderOcupacionEquipo(){
  const roles = getAllRoles();
  if(roles.length===0) return '';
  const mesActual = currentMonth();
  const [y,m] = mesActual.split('-').map(Number);
  const mesSiguiente = (m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'));

  const rows = roles.map(r=>{
    const cap = roleCapacity(r);
    const realEsteMes = roleProjectHoursInMonth(r, mesActual) + roleAdminHoursInMonth(r, mesActual);
    let proyectadoProxMes = 0;
    state.projects.forEach(pr=>{
      (pr.assignments||[]).forEach(a=>{
        if(a.role===r) proyectadoProxMes += Number((a.projectedByMonth||{})[mesSiguiente]||0);
      });
    });
    const pctEsteMes = cap>0 ? (realEsteMes/cap*100) : 0;
    const pctProxMes = cap>0 ? (proyectadoProxMes/cap*100) : 0;
    const colorProx = pctProxMes>100 ? 'var(--red)' : (pctProxMes>=70 ? 'var(--amber)' : 'var(--teal)');
    const disponible = Math.max(0, cap - proyectadoProxMes);
    return '<tr>'
      + '<td><b>'+r+'</b></td>'
      + '<td class="mono" style="text-align:right">'+fmtH(cap)+' h</td>'
      + '<td class="mono" style="text-align:right">'+pctEsteMes.toFixed(0)+'%</td>'
      + '<td class="mono" style="text-align:right; color:'+colorProx+'; font-weight:700">'+pctProxMes.toFixed(0)+'%</td>'
      + '<td class="mono" style="text-align:right; color:'+(disponible>0?'var(--teal)':'var(--muted)')+'">'+fmtH(disponible)+' h</td>'
      + '</tr>';
  }).join('');

  return '<div class="card" style="margin-bottom:20px">'
    + '<div class="card-title" style="font-size:15px; font-weight:700; margin-bottom:4px">🧑‍💼 Ocupación del Equipo por Rol</div>'
    + '<div class="card-sub" style="font-size:12px; margin-bottom:10px">¿Qué rol tiene capacidad disponible para tomar un proyecto nuevo el próximo mes ('+fmtMonth(mesSiguiente)+')?</div>'
    + '<div style="overflow-x:auto"><table><thead><tr><th>Rol</th><th class="num">Capacidad mensual</th><th class="num">% ocupado este mes</th><th class="num">% comprometido próx. mes</th><th class="num">Disponible próx. mes</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '</div>';
}

function renderDashPersonComplianceTable(){
  if(state.people.length===0) return '';
  const rows = state.people.map(person=>{
    const cap = personCapacity(person);
    const m = currentMonth();
    const pm = personProjectHoursInMonth(person.id, m);
    const am = personAdminHoursInMonth(person.id, m);
    const total = pm+am;
    const pct = cap>0 ? (total/cap*100) : 0;
    return '<tr class="expand-toggle" onclick="openPersonDetail(\''+person.id+'\')">'
      + '<td><b>'+person.name+'</b></td>'
      + '<td>'+person.role+'</td>'
      + '<td>'+(person.lineaNegocio||'<span class="muted">Sin línea</span>')+'</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(pm)+' h</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(am)+' h</td>'
      + '<td style="min-width:160px">'+gauge(cap, total)+'</td>'
      + '</tr>';
  }).join('');
  return '<div class="card" style="margin-bottom:20px">'
    + '<div class="card-title" style="font-size:15px; font-weight:700; margin-bottom:4px">👥 Cumplimiento por Persona — '+fmtMonth(currentMonth())+'</div>'
    + '<div class="card-sub" style="font-size:12px; margin-bottom:10px">Haz clic en una persona para ver su detalle (proyectos, historial, capacidad)</div>'
    + '<div style="overflow-x:auto"><table><thead><tr><th>Persona</th><th>Rol</th><th>Línea</th><th class="num">Proyecto (mes)</th><th class="num">Admin (mes)</th><th>Consumo vs. capacidad</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '</div>';
}

function renderDashGlobal(){
  const totals = getFilteredTotals();
  const totalProj = totals.projClient + totals.projAdmin;
  const totalAct = totals.actClient + totals.actAdmin;

  let html = renderDashInsightsBanner();

  html += renderAnalisisFinancieroGeneral();
  html += renderCurvasPortafolioTop();
  html += renderDashVencimientosFacturacion();
  html += renderMetasFacturacion();
  html += renderOcupacionEquipo();

  html += '<div class="section-label">Consolidado General del Portafolio (Horas Hombre)</div>';

  html += '<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:16px; margin-bottom:20px;">'
    + '<div class="card" style="margin-bottom:0">'
    + '<div class="card-title" style="font-size:14px; margin-bottom:2px">📂 Proyectos Cliente</div>'
    + '<div class="card-sub" style="font-size:11.5px; margin-bottom:10px">Planificado vs. Ejecutado en período seleccionado</div>'
    + gauge(totals.projClient, totals.actClient)
    + '</div>'
    + '<div class="card" style="margin-bottom:0">'
    + '<div class="card-title" style="font-size:14px; margin-bottom:2px">⚙️ Administración Interna</div>'
    + '<div class="card-sub" style="font-size:11.5px; margin-bottom:10px">Planificado vs. Ejecutado en período seleccionado</div>'
    + gauge(totals.projAdmin, totals.actAdmin)
    + '</div>'
    + '<div class="card" style="margin-bottom:0">'
    + '<div class="card-title" style="font-size:14px; margin-bottom:2px">📊 Total Consolidado Portafolio</div>'
    + '<div class="card-sub" style="font-size:11.5px; margin-bottom:10px">Suma Total Portafolio en período seleccionado</div>'
    + gauge(totalProj, totalAct)
    + '</div>'
    + '</div>';

  // Gráficos del Dashboard
  html += renderDashboardVisualsHeader();

  // Secuencia de 3 Tablas Matrices de Macro a Micro
  html += renderDashUnidadesComplianceTable();
  html += renderDashLineasComplianceTable();
  html += renderDashProjectComplianceTable();
  html += renderDashPersonComplianceTable();

  return html;
}

function renderDashboard(){
  if(state.projects.length===0 && state.people.length===0){
    return '<div class="card"><div class="empty">'
      + '<div class="display">Aún no hay datos cargados</div>'
      + '<p>Crea tu equipo y tu primer proyecto para empezar a monitorear HH.</p>'
      + '<div style="margin-top:16px"><button class="btn btn-primary" onclick="switchMainView(\'config\')">Ir a Configuración</button></div>'
      + '</div></div>';
  }
  const mode = state.dashMode || 'global';
  const selector = renderDashModeSelector();
  const timeFilter = renderDashTimeFilterPanel();

  if(mode === 'personas' || mode === 'roles') return selector + timeFilter + renderDashAllRoles();
  return selector + timeFilter + renderDashGlobal();
}

function renderDashRoot(){
  const unidades = state.config.unidades||[];
  const clasificados = new Set();
  (state.config.lineasNegocio||[]).forEach(l=>{ if(l.unidad) peopleInLinea(l.nombre).forEach(p=>clasificados.add(p.id)); });
  const sinUnidad = state.people.filter(p=>!clasificados.has(p.id));

  let html = '';
  if(unidades.length===0 && sinUnidad.length===0){
    return '<div class="card"><div class="empty"><div class="display">Sin unidades configuradas</div><p>Crea Unidades y Líneas de Negocio en Configuración para ver el desglose del portafolio.</p><div style="margin-top:12px"><button class="btn btn-primary" onclick="switchMainView(\'config\')">Ir a Configuración</button></div></div></div>';
  }
  html += unidades.map(u=>{
    const ids = new Set(peopleInUnidad(u).map(p=>p.id));
    return dashCardFor(u, 'Unidad', ids, "dashGoto({unidad:'"+u+"'})");
  }).join('');
  if(sinUnidad.length){
    const ids = new Set(sinUnidad.map(p=>p.id));
    html += dashCardFor('Sin unidad asignada', 'Personas sin línea/unidad', ids, "switchMainView('config')");
  }
  return html;
}

function renderDashUnidad(){
  const unidad = state.dashNav.unidad;
  const lineas = lineasDeUnidad(unidad);
  if(lineas.length===0){
    return '<div class="card"><div class="empty"><div class="display">Sin líneas de negocio en '+unidad+'</div><p>Asigna líneas de negocio a esta unidad desde Configuración.</p></div></div>';
  }
  return lineas.map(l=>{
    const ids = new Set(peopleInLinea(l).map(p=>p.id));
    return dashCardFor(l, 'Línea de Negocio', ids, "dashGoto({unidad:'"+unidad+"',linea:'"+l+"'})");
  }).join('');
}

function renderDashLinea(){
  const nav = state.dashNav;
  const personIds = new Set(peopleInLinea(nav.linea).map(p=>p.id));
  const projects = projectsForPeopleIds(personIds);
  if(projects.length===0){
    return '<div class="card"><div class="empty"><div class="display">Sin proyectos para esta línea</div><p>Ningún proyecto tiene personas de "'+nav.linea+'" asignadas todavía.</p></div></div>';
  }
  return projects.map(p=>{
    const t = projectTotalsForPeople(p, personIds);
    const sm = statusMeta(p.status);
    const periodo = p.startMonth ? ' · '+fmtMonth(p.startMonth)+' – '+fmtMonth(p.endMonth) : '';
    return '<div class="card expand-toggle" onclick="dashGoto({unidad:\''+nav.unidad+'\',linea:\''+nav.linea+'\',projectId:\''+p.id+'\'})">'
      + '<div class="card-header"><div><div class="card-title">'+p.name+' <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></div>'
      + '<div class="card-sub">'+(p.client||'Sin cliente')+periodo+' · horas de esta línea en el proyecto</div></div>'
      + '<span class="link-btn">Ver ▶</span></div>'
      + '<div style="max-width:520px">'+gauge(t.projectedHours, t.actualHours)+'</div>'
      + '</div>';
  }).join('');
}

function renderDashProyecto(){
  const nav = state.dashNav;
  const p = state.projects.find(x=>x.id===nav.projectId);
  if(!p) return '<div class="card"><div class="empty">Proyecto no encontrado.</div></div>';
  const t = projectTotals(p);
  const sm = statusMeta(p.status);
  const periodo = p.startMonth ? fmtMonth(p.startMonth)+' – '+fmtMonth(p.endMonth) : 'Sin período';

  let html = '<div class="card">'
    + '<div class="card-title">'+p.name+' <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></div>'
    + '<div class="card-sub">'+(p.pep?'PEP '+p.pep+' · ':'')+(p.client||'Sin cliente')+' · '+periodo+'</div>'
    + '<div style="max-width:520px; margin-top:12px">'+gauge(t.projectedHours, t.actualHours)+'</div>'
    + '</div>';

  const assignments = p.assignments||[];
  if(assignments.length===0){
    html += '<div class="card"><p class="muted" style="font-size:13px">Sin proyecciones por rol registradas todavía.</p></div>';
    return html;
  }
  const roleRows = assignments.map(a=>{
    const roleName = a.role; if(!roleName) return '';
    const proj = assignmentProjectedTotal(a);
    const act = projectRealHoursForRole(p.id, roleName);
    return '<div class="person-row">'
      + '<div><div class="person-name">'+roleName+'</div><div class="person-role">'+(peopleWithRole(roleName).length)+' integrante(s) en este rol</div></div>'
      + '<div>'+gauge(proj, act)+'</div><div></div>'
      + '</div>';
  }).join('');

  html += '<div class="card"><div class="section-label" style="margin-top:0">Consumo por rol en este proyecto</div>'+roleRows+'</div>';
  return html;
}

function renderDashPersona(){
  const nav = state.dashNav;
  const p = state.projects.find(x=>x.id===nav.projectId);
  const person = getPerson(nav.personId);
  if(!p || !person) return '<div class="card"><div class="empty">No encontrado.</div></div>';
  const a = (p.assignments||[]).find(x=>x.personId===person.id);
  const proj = a ? assignmentProjectedTotal(a) : 0;
  const act = projectRealHoursForPerson(p.id, person.id);
  const months = monthRange(p.startMonth, p.endMonth);

  const monthRows = months.map(m=>{
    const pm = (a && a.projectedByMonth[m]) ? Number(a.projectedByMonth[m]) : 0;
    const rm = state.realEntries.filter(e=>e.category==='project' && e.projectId===p.id && e.personId===person.id && e.month===m)
      .reduce((s,e)=>s+Number(e.hours||0),0);
    const pct = pm>0 ? (rm/pm*100) : (rm>0?999:0);
    const color = ratioColor(pm>0? rm/pm : (rm>0?2:0));
    return '<tr><td>'+fmtMonth(m)+'</td><td class="mono" style="text-align:right">'+fmtH(pm)+'</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(rm)+'</td>'
      + '<td class="mono" style="text-align:right; color:'+color+'">'+(pm>0?pct.toFixed(0)+'%':(rm>0?'—':'0%'))+'</td></tr>';
  }).join('');

  return '<div class="card">'
    + '<div class="card-title">'+person.name+'</div>'
    + '<div class="card-sub">'+person.role+' · '+(person.lineaNegocio||'Sin línea')+'</div>'
    + '<div style="max-width:520px; margin-top:12px">'+gauge(proj, act)+'</div>'
    + '</div>'
    + '<div class="card"><div class="section-label" style="margin-top:0">Tendencia mensual en este proyecto</div>'
    + (months.length ? '<table><thead><tr><th>Mes</th><th class="num">Proyectado</th><th class="num">Real</th><th class="num">%</th></tr></thead><tbody>'+monthRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">El proyecto no tiene período definido.</p>')
    + '</div>';
}
// ---------- Proyectos ----------
function renderProyectos(){
  if(!state.projectSearchQuery) state.projectSearchQuery = '';
  if(!state.projectStatusFilter) state.projectStatusFilter = 'all';
  if(!state.projectTypeFilter) state.projectTypeFilter = 'all';
  if(!state.projectLineaFilter) state.projectLineaFilter = 'all';

  const statusOpts = '<option value="all">Todos los estados</option>'
    + STATUS_OPTS.map(s => '<option value="'+s.v+'" '+(state.projectStatusFilter===s.v?'selected':'')+'>'+s.label+'</option>').join('');

  const typeOpts = '<option value="all">Todos los tipos (Proyectos y Admin)</option>'
    + '<option value="proyecto" '+(state.projectTypeFilter==='proyecto'?'selected':'')+'>📂 Proyectos cliente</option>'
    + '<option value="admin" '+(state.projectTypeFilter==='admin'?'selected':'')+'>⚙️ Administración interna</option>';

  const lineas = state.config.lineasNegocio || [];
  const lineaOpts = '<option value="all">Todas las Líneas de Negocio</option>'
    + lineas.map(l => '<option value="'+l.nombre+'" '+(state.projectLineaFilter===l.nombre?'selected':'')+'>🏷️ '+l.nombre+'</option>').join('');

  let filtered = state.projects.filter(p => {
    if(state.projectStatusFilter !== 'all' && p.status !== state.projectStatusFilter) return false;
    if(state.projectTypeFilter !== 'all' && (p.tipo||'proyecto') !== state.projectTypeFilter) return false;
    if(state.projectLineaFilter !== 'all' && (p.lineaNegocio||'') !== state.projectLineaFilter) return false;
    if(state.projectSearchQuery){
      const q = state.projectSearchQuery.toLowerCase();
      const matchName = (p.name||'').toLowerCase().includes(q);
      const matchPep = (p.pep||'').toLowerCase().includes(q);
      const matchClient = (p.client||'').toLowerCase().includes(q);
      const matchLinea = (p.lineaNegocio||'').toLowerCase().includes(q);
      if(!matchName && !matchPep && !matchClient && !matchLinea) return false;
    }
    return true;
  });

  let html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap">'
    + '<div style="display:flex; gap:8px; flex:1; max-width:840px; flex-wrap:wrap">'
    + '<input type="text" placeholder="🔍 Buscar por nombre, cliente, PEP o línea..." value="'+(state.projectSearchQuery||'')+'" oninput="state.projectSearchQuery=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px; flex:1; min-width:180px;">'
    + '<select onchange="state.projectLineaFilter=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px;">'+lineaOpts+'</select>'
    + '<select onchange="state.projectTypeFilter=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px;">'+typeOpts+'</select>'
    + '<select onchange="state.projectStatusFilter=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px;">'+statusOpts+'</select>'
    + '</div>'
    + '<button class="btn btn-primary" onclick="openProjectModal()">+ Nuevo registro / proyecto</button>'
    + '</div>';

  if(filtered.length===0){
    html += '<div class="card"><div class="empty"><div class="display">Sin registros que coincidan</div><p>Prueba ajustando los filtros de búsqueda o línea de negocio.</p></div></div>';
    return html;
  }

  html += filtered.map(p=>{
    const sm = statusMeta(p.status);
    const isAdmin = p.tipo === 'admin';
    const typeBadge = isAdmin
      ? '<span class="chip" style="background:var(--amber-bg); color:var(--amber); font-weight:700; margin-left:6px">⚙️ Administración</span>'
      : '<span class="chip" style="background:var(--teal-bg); color:var(--teal); font-weight:700; margin-left:6px">📂 Proyecto</span>';
    const periodo = p.startMonth ? fmtMonth(p.startMonth)+' – '+fmtMonth(p.endMonth) : 'Sin período definido';
    const lineaText = p.lineaNegocio ? ' · LN: <b>'+p.lineaNegocio+'</b>' : ' · <span class="muted">Sin LN</span>';

    return '<div class="card">'
      + '<div class="card-header">'
      + '<div><div class="card-title">'+p.name+typeBadge+' <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></div>'
      + '<div class="card-sub">'+(p.pep?'PEP '+p.pep+' · ':'')+(p.client||'Sin cliente')+lineaText+' · '+periodo+'</div></div>'
      + '<div style="display:flex; gap:6px; flex-wrap:wrap">'
      + '<button class="btn btn-primary btn-sm" onclick="openProjectDetail(\''+p.id+'\')">Ver detalle</button>'
      + '<button class="btn btn-secondary btn-sm" onclick="openProjectModal(\''+p.id+'\')">Editar</button>'
      + '<button class="btn btn-ghost btn-sm" onclick="deleteProject(\''+p.id+'\')">Eliminar</button>'
      + '</div></div>'
      + '</div>';
  }).join('');
  return html;
}

function renderPeopleManager(p){
  const months = monthRange(p.startMonth, p.endMonth);
  const rows = (p.assignments||[]).map(a=>{
    const roleName = a.role;
    if(!roleName) return '';
    const proj = assignmentProjectedTotal(a);
    const act = projectRealHoursForRole(p.id, roleName);
    return '<tr>'
      + '<td><b>'+roleName+'</b></td>'
      + '<td class="mono" style="text-align:right">'+fmtH(proj)+' h</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(act)+' h</td>'
      + '<td style="text-align:right">'
      + '<button class="btn btn-ghost btn-sm" onclick="openProjectionModal(\''+p.id+'\',\''+roleName.replace(/'/g,"\\'")+'\')">Proyección</button>'
      + '<button class="btn btn-ghost btn-sm" onclick="removeRoleAssignment(\''+p.id+'\',\''+roleName.replace(/'/g,"\\'")+'\')">Quitar</button>'
      + '</td></tr>';
  }).join('');
  const excelBlock = months.length
    ? '<button class="btn btn-secondary btn-sm" onclick="openProjectionModal(\''+p.id+'\')">+ Proyectar nuevo rol</button>'
      + '<button class="btn btn-secondary btn-sm" onclick="downloadProjectionTemplate(\''+p.id+'\')">Descargar plantilla proyección por ROL</button>'
      + '<label class="btn btn-secondary btn-sm" style="margin-bottom:0">Cargar proyección Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="uploadProjectionExcel(event,\''+p.id+'\')"></label>'
    : '<span class="muted" style="font-size:12px; align-self:center">Define mes inicio/término (botón Editar) para habilitar la carga de proyección por roles.</span>';
  return '<div class="section-label">Roles y proyecciones de horas del proyecto</div>'
    + ((p.assignments||[]).length
        ? '<table><thead><tr><th>Rol / Cargo</th><th class="num">HH proyectadas</th><th class="num">HH reales (equipo)</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
        : '<p class="muted" style="font-size:13px; margin-bottom:8px">Sin proyecciones por rol registradas aún.</p>')
    + '<div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center">'
    + excelBlock
    + '</div>';
}

// ---------- Rentabilidad y facturación del proyecto ----------
function renderFinanzasProyecto(p){
  const m = margenesProject(p);
  const verCosto = canSeeCostoEmpresa();

  let html = '<div class="section-label" style="margin-top:20px">💰 Rentabilidad del proyecto</div>';

  if(!p.montoVenta){
    html += '<div class="muted" style="font-size:13px; margin-bottom:10px">Sin monto de venta definido — edita el proyecto para ingresarlo y habilitar el cálculo de márgenes.</div>';
  } else {
    html += '<div style="display:flex; gap:8px; flex-wrap:wrap; font-size:13px; margin-bottom:12px">'
      + '<span class="chip">Venta contratada: <b>'+fmtCLP(m.venta)+'</b></span>'
      + (verCosto ? '<span class="chip">Costo devengado: <b>'+fmtCLP(m.costoDevengado)+'</b></span><span class="chip">Costo por terminar: <b>'+fmtCLP(m.costoPorTerminar)+'</b></span>' : '<span class="chip muted">🔒 Costo empresa oculto para el rol "'+state.viewAsRole+'"</span>')
      + '</div>'
      + '<div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px">'
      + margenCard('Margen devengado', '% sobre el esfuerzo ya valorizado — ¿el trabajo hecho hasta hoy rinde plata?', m.devengado)
      + margenCard('Margen proyectado al cierre', '% sobre la venta total — si todo sigue como va, ¿cómo termina el proyecto?', m.proyectadoCierre)
      + margenCard('Margen comercial de cierre', p.status==='cerrado' ? '% sobre la venta — resultado final, el proyecto ya cerró' : 'Se calcula solo cuando el proyecto cierra', m.comercialCierre)
      + '</div>';
  }

  // Hitos de facturación
  const hitos = p.hitosFacturacion || [];
  const descalce = projectDescalce(p);
  if(descalce){
    const brechaColor = descalce.brecha > 20 ? 'var(--red)' : (descalce.brecha > 10 ? 'var(--amber)' : 'var(--teal)');
    html += '<div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin:10px 0"><span style="width:9px; height:9px; border-radius:50%; background:'+brechaColor+'; display:inline-block"></span> Esfuerzo consumido: <b>'+descalce.pctEsfuerzo.toFixed(0)+'%</b> · Facturado: <b>'+descalce.pctFacturado.toFixed(0)+'%</b> '+(descalce.brecha>10?'<span style="color:'+brechaColor+'; font-weight:700">· Descalce de '+descalce.brecha.toFixed(0)+' pts — hay esfuerzo sin cobrar</span>':'')+'</div>';
  }

  const hitoRows = hitos.map(h=>{
    const vencido = h.estado==='pendiente' && h.fecha && h.fecha < currentMonth()+'-31';
    return '<tr>'
      + '<td>'+h.nombre+'</td>'
      + '<td class="mono" style="text-align:right">'+Number(h.pctVenta||0)+'%</td>'
      + '<td class="mono" style="text-align:right">'+(p.montoVenta ? fmtCLP(p.montoVenta*Number(h.pctVenta||0)/100) : '—')+'</td>'
      + '<td>'+(h.fecha||'—')+'</td>'
      + '<td><span class="badge '+(h.estado==='facturado'?'activo':(vencido?'pausa':'cerrado'))+'">'+(h.estado==='facturado'?'Facturado':(vencido?'Vencido':'Pendiente'))+'</span></td>'
      + '<td style="text-align:right">'
      + (h.estado!=='facturado' ? '<button class="btn btn-ghost btn-sm" onclick="marcarHitoFacturado(\''+p.id+'\',\''+h.id+'\')">Marcar facturado</button>' : '')
      + '<button class="btn btn-ghost btn-sm" onclick="deleteHitoFacturacion(\''+p.id+'\',\''+h.id+'\')">Eliminar</button>'
      + '</td></tr>';
  }).join('');

  html += '<div class="section-label" style="margin-top:16px">📅 Hitos de facturación</div>'
    + (hitos.length ? '<table><thead><tr><th>Hito</th><th class="num">% Venta</th><th class="num">Monto</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>'+hitoRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin hitos de facturación definidos.</p>')
    + '<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="openHitoModal(\''+p.id+'\')">+ Agregar hito de facturación</button></div>';

  // Costos adicionales: materiales, consultores externos (por hora o monto fijo), etc.
  // No son horas del equipo interno, así que se llevan aparte y se suman al costo del
  // proyecto (devengado si ya se incurrió, por terminar si es una estimación futura).
  html += '<div class="section-label" style="margin-top:20px">📦 Costos Adicionales (materiales, consultores externos, etc.)</div>';
  if(!verCosto){
    html += '<p class="muted" style="font-size:13px">🔒 Oculto para el rol "'+state.viewAsRole+'" — mismo criterio que el costo empresa.</p>';
  } else {
    const costos = p.costosAdicionales || [];
    const costoRows = costos.map(c=>{
      const monto = costoAdicionalMonto(c);
      const modalidadLabel = c.modalidad==='tarifa_hora' ? fmtCLP(c.tarifaUFHora)+'/h × '+fmtH(c.horas)+'h' : 'Monto fijo';
      return '<tr>'
        + '<td>'+c.concepto+'</td>'
        + '<td>'+({material:'Material', consultor_externo:'Consultor externo', otro:'Otro'}[c.categoria]||'Otro')+'</td>'
        + '<td class="muted" style="font-size:12px">'+modalidadLabel+'</td>'
        + '<td class="mono" style="text-align:right">'+fmtCLP(monto)+'</td>'
        + '<td><span class="badge '+(c.estado==='incurrido'?'activo':'iniciar')+'">'+(c.estado==='incurrido'?'Incurrido':'Estimado')+'</span></td>'
        + '<td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="deleteCostoAdicional(\''+p.id+'\',\''+c.id+'\')">Eliminar</button></td>'
        + '</tr>';
    }).join('');
    html += (costos.length ? '<table><thead><tr><th>Concepto</th><th>Categoría</th><th>Modalidad</th><th class="num">Monto</th><th>Estado</th><th></th></tr></thead><tbody>'+costoRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin costos adicionales registrados.</p>')
      + '<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="openCostoAdicionalModal(\''+p.id+'\')">+ Agregar costo adicional</button></div>';
  }

  return html;
}

function renderProjectDetailCharts(id){
  const p = state.projects.find(x=>x.id===id);
  if(activeCharts.curvaS){ activeCharts.curvaS.destroy(); activeCharts.curvaS=null; }
  if(!p || p.tipo==='admin' || !p.startMonth || !p.endMonth) return;
  const ctx = document.getElementById('curvaSChart');
  if(!ctx) return;
  const months = monthRange(p.startMonth, p.endMonth);
  let cumProj=0, cumAct=0;
  const projData=[], actData=[];
  months.forEach(m=>{
    let projM=0;
    (p.assignments||[]).forEach(a=>{ projM += Number((a.projectedByMonth||{})[m]||0); });
    let actM=0;
    state.realEntries.forEach(e=>{ if(e.projectId===p.id && e.month===m) actM += Number(e.hours||0); });
    cumProj += projM; cumAct += actM;
    projData.push(cumProj); actData.push(cumAct);
  });
  activeCharts.curvaS = new Chart(ctx, {
    type:'line',
    data:{ labels: months.map(fmtMonth), datasets:[
      {label:'Plan acumulado', data:projData, borderColor:'#1E2A5E', backgroundColor:'rgba(30,42,94,0.08)', fill:true, tension:0.25},
      {label:'Real acumulado', data:actData, borderColor:'#1E9E8B', backgroundColor:'rgba(30,158,139,0.12)', fill:true, tension:0.25}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'top'}, tooltip:{callbacks:{label:function(c){ return c.dataset.label+': '+fmtH(c.raw)+' h'; }}} },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:function(v){ return v+' h'; } } } }
    }
  });
}

function personProjectsWithHours(personId){
  const map = {};

    map[e.projectId] = (map[e.projectId]||0) + Number(e.hours||0);
  });
  return Object.keys(map).map(pid=>({project: state.projects.find(p=>p.id===pid), hours: map[pid]})).filter(x=>x.project);
}

    + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">HH administración (histórico)</div><div class="mono" style="font-size:19px; font-weight:700">'+fmtH(totalAdminHours)+' h</div></div>'
    + '<div><div class="muted" style="font-size:11px; text-transform:uppercase">Meta Proyecto / Admin</div><div class="mono" style="font-size:19px; font-weight:700">'+targetProj+'% / '+targetAdmin+'%</div></div>'
    + '</div></div>';

  const projRows = projectsWithHours.map(x=>{
    const sm = statusMeta(x.project.status);
    return '<tr class="expand-toggle" onclick="openProjectDetail(\''+x.project.id+'\')">'
      + '<td><b>'+x.project.name+'</b> <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></td>'

      + '</tr>';
  }).join('');
  html += '<div class="card"><div class="section-label" style="margin-top:0">Proyectos donde ha registrado horas</div>'
    + (projRows ? '<table><thead><tr><th>Proyecto</th><th class="num">HH reales</th></tr></thead><tbody>'+projRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin horas registradas todavía.</p>')
    + '</div>';

  const monthRows = months.map(m=>{
    const pm = personProjectHoursInMonth(id, m);
    const am = personAdminHoursInMonth(id, m);
    const total = pm+am;

    + '</div>';

  return html;

function saveProject(projectId){
  const name = document.getElementById('f_name').value.trim();
  const tipo = document.getElementById('f_tipo').value;
  const lineaNegocio = document.getElementById('f_linea').value;
  const pep = document.getElementById('f_pep').value.trim();
  const client = document.getElementById('f_client').value.trim();
  const status = document.getElementById('f_status').value;
  const fechaInicio = document.getElementById('f_start').value;
  const fechaCierre = document.getElementById('f_end').value;
  const startMonth = fechaInicio ? fechaInicio.slice(0,7) : '';
  const endMonth = fechaCierre ? fechaCierre.slice(0,7) : '';
  const montoVenta = Number(document.getElementById('f_montoventa_clp').value) || 0;
  if(!name){ showToast('Ingresa un nombre.'); return; }
  if(fechaInicio && fechaCierre && fechaInicio>fechaCierre){ showToast('La fecha de inicio debe ser anterior o igual a la de cierre.'); return; }
  if(projectId){
    const p = state.projects.find(x=>x.id===projectId);
    p.name=name; p.tipo=tipo; p.lineaNegocio=lineaNegocio; p.pep=pep; p.client=client; p.status=status;
    p.fechaInicio=fechaInicio; p.fechaCierre=fechaCierre; p.startMonth=startMonth; p.endMonth=endMonth; p.montoVenta=montoVenta;
  }else{
    state.projects.push({id:uid('proj'), name, tipo, lineaNegocio, pep, client, status, fechaInicio, fechaCierre, startMonth, endMonth, montoVenta, assignments:[], hitosFacturacion:[], costosAdicionales:[]});
  }
  persistProjects(); closeModal(); renderAll(); showToast(tipo==='admin' ? 'PEP de Administración guardado.' : 'Proyecto guardado.');
}

  if(!confirm('¿Eliminar este proyecto y todos sus registros de horas asociados? Esta acción no se puede deshacer.')) return;
  state.projects = state.projects.filter(p=>p.id!==id);

  if(months.length===0){ showToast('Define mes inicio/término primero.'); return; }
  const allRoles = getAllRoles();
  if(allRoles.length===0){ showToast('Registra personas con sus roles en Configuración antes de descargar la plantilla.'); return; }
  
  // Hoja 1: Carga Proyección (por ROL)
  const monthHeaders = months.map(monthLabelFull);
  const headerProj = ['Línea de Negocio','Rol'].concat(monthHeaders);
  
  const projectLinea = p.lineaNegocio || '';
  const rowsProj = allRoles.map(roleName => {
    const a = (p.assignments||[]).find(x=>x.role===roleName);
    const peopleInR = peopleWithRole(roleName);
    const lineasStr = Array.from(new Set(peopleInR.map(p=>p.lineaNegocio).filter(Boolean))).join(', ') || projectLinea;
    const row = [lineasStr, roleName];
    months.forEach(m => row.push((a && a.projectedByMonth[m]) ? a.projectedByMonth[m] : ''));
    return row;
  });
  const wsProj = XLSX.utils.aoa_to_sheet([headerProj].concat(rowsProj));

  // Hoja 2: Catálogo de Roles (referencia)
  const headerCat = ['Rol / Cargo', 'Cantidad de Integrantes', 'Integrantes', 'Líneas de Negocio'];
  const rowsCat = allRoles.map(roleName => {
    const peopleInR = peopleWithRole(roleName);
    const namesStr = peopleInR.map(p => p.name).join(', ');
    const lineasStr = Array.from(new Set(peopleInR.map(p=>p.lineaNegocio).filter(Boolean))).join(', ');
    return [roleName, peopleInR.length, namesStr, lineasStr];
  });
  const wsCat = XLSX.utils.aoa_to_sheet([headerCat].concat(rowsCat));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsProj, 'Carga Proyección');
  XLSX.utils.book_append_sheet(wb, wsCat, 'Catálogo de Roles');
  XLSX.writeFile(wb, 'proyeccion_roles_'+p.name.replace(/[^a-z0-9]+/gi,'_')+'.xlsx');
}

function uploadProjectionExcel(evt, projectId){
  const file = evt.target.files[0]; if(!file) return;
  const p = state.projects.find(x=>x.id===projectId);
  const months = monthRange(p.startMonth, p.endMonth);
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const targetSheetName = wb.SheetNames.find(n => {
        const norm = normalizeStr(n);
        return norm.includes('carga') || norm.includes('proyeccion') || norm.includes('rol');
      }) || wb.SheetNames[0];

      const ws = wb.Sheets[targetSheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(rows.length===0){ showToast('La hoja de proyección no tiene filas con datos.'); evt.target.value=''; return; }

      const headerCols = Object.keys(rows[0]);
      const monthHeaderMap = {};
      headerCols.forEach(h=>{
        const parsed = parseMonthLabel(h);
        if(parsed && months.includes(parsed)) monthHeaderMap[h] = parsed;
      });
      if(Object.keys(monthHeaderMap).length===0){
        showToast('No reconocí ninguna columna de mes en el archivo. Usa el formato "Marzo 2026" (mes + año).');
        evt.target.value=''; return;
      }
      let matched=0;
      rows.forEach(row=>{
        const roleName = String(row['Rol']||row['Cargo']||row['Rol / Cargo']||row['Persona']||'').trim();
        if(!roleName) return;

        let a = (p.assignments||[]).find(x=>x.role===roleName || normalizeStr(x.role)===normalizeStr(roleName));
        if(!a){
          if(!p.assignments) p.assignments = [];
          a = { role: roleName, projectedByMonth: {} };
          p.assignments.push(a);
        }
        let hasValue = false;
        Object.keys(monthHeaderMap).forEach(h=>{
          if(row[h]!==''){
            const numVal = Number(row[h])||0;
            if(numVal > 0) {
              a.projectedByMonth[monthHeaderMap[h]] = numVal;
              hasValue = true;
            } else {
              delete a.projectedByMonth[monthHeaderMap[h]];
            }
          }
        });
        if(hasValue) matched++;
      });
      persistProjects(); renderAll();
      showToast('Proyección cargada: '+matched+' rol(es) actualizados en el proyecto.');
    }catch(err){ console.error(err); showToast('No se pudo leer el archivo. Verifica el formato.'); }
    evt.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function deleteGroupEntries(personId, month){
  const person = getPerson(personId);

function getFilteredMonthsListForHeatmap(){
  const years = (state.dashYearsFilter || []).filter(y => y !== 'all');
  const months = (state.dashMonthsFilter || []).filter(m => m !== 'all');

  if(years.length > 0 && months.length > 0){
    const list = [];
    years.slice().sort().forEach(y => {
      months.slice().sort().forEach(m => {
        list.push(y + '-' + m);
      });
    });
    return list;
  } else if(years.length > 0){
    const list = [];
    const allMonths = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    years.slice().sort().forEach(y => {
      allMonths.forEach(m => {
        list.push(y + '-' + m);
      });
    });
    return list;
  }
  return lastMonthsDesc(6);
}

function extractPepCode(label){
  if(!label) return null;
  const str = String(label).trim();
  const m1 = str.match(/\b(\d{3,5}(?:\.[A-Za-z0-9]+)+)\b/i);
  if(m1) return m1[1].toUpperCase();
  const m2 = str.match(/\b(PEP[-_\s]?[A-Za-z0-9\.-]+)\b/i);
  if(m2) return m2[1].toUpperCase();
  const firstWord = str.split(/\s+/)[0].toUpperCase();
  return firstWord || null;
}

function findMatchingProject(label){
  if(!label) return null;
  const rawLabel = String(label).trim();
  const normLabel = normalizeStr(rawLabel);
  const codeInLabel = extractPepCode(rawLabel);

  // 1. Coincidencia por código PEP extraído (ej: 3981.N.F99)
  if(codeInLabel){
    const projByCode = state.projects.find(pr => {
      const prCode = extractPepCode(pr.pep || pr.name);
      return prCode && prCode === codeInLabel;
    });
    if(projByCode) return projByCode;
  }

  // 2. Coincidencia por inclusión de texto del PEP (ej: si uno incluye al otro)
  const projByContain = state.projects.find(pr => {
    if(!pr.pep) return false;
    const prPepNorm = normalizeStr(pr.pep);
    return prPepNorm && (normLabel.includes(prPepNorm) || prPepNorm.includes(normLabel));
  });
  if(projByContain) return projByContain;

  // 3. Coincidencia por nombre de proyecto
  const projByName = state.projects.find(pr => {
    if(!pr.name) return false;
    const prNameNorm = normalizeStr(pr.name);
    return prNameNorm && (normLabel.includes(prNameNorm) || prNameNorm.includes(normLabel));
  });

  return projByName || null;
}

function isAdminLabel(label){

}
function cleanNameWords(str){
  if(!str) return [];
  const stopWords = new Set(['de', 'del', 'la', 'las', 'los', 'san', 'santa', 'y', 'e', 'von', 'van']);
  const sanitized = normalizeStr(str)
    .replace(/[.,;:_\-\/\\()[\]"'\`]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return sanitized
    .split(/\s+/)
    .filter(w => w.length > 0 && !stopWords.has(w) && !/^[a-z]\.?$/.test(w));
}
function namesMatch(a, b){
  if(!a || !b) return false;
  const cleanA = cleanNameWords(a).join(' ');
  const cleanB = cleanNameWords(b).join(' ');
  if(!cleanA || !cleanB) return false;
  if(cleanA === cleanB) return true;
  if(cleanA.includes(cleanB) || cleanB.includes(cleanA)) return true;

  const wordsA = cleanNameWords(a);
  const wordsB = cleanNameWords(b);

  const setB = new Set(wordsB);
  const setA = new Set(wordsA);
  let sharedInA = 0;
  wordsA.forEach(w => { if(setB.has(w)) sharedInA++; });

  let sharedInB = 0;
  wordsB.forEach(w => { if(setA.has(w)) sharedInB++; });

  const minWords = Math.min(wordsA.length, wordsB.length);
  if(sharedInA >= minWords || sharedInB >= minWords) return true;
  if(sharedInA >= 2 || sharedInB >= 2) return true;

  return false;
}
function addRealEntryHours(category, projectId, personId, month, hours){
  let entry = state.realEntries.find(e =>
    e.category === category &&
    e.personId === personId &&
    e.month === month &&
    (category === 'admin' ? e.projectId === projectId : e.projectId === projectId)
  );
  if(entry){
    // PEP ya existía para esta persona y mes: SE REEMPLAZAN / ACTUALIZAN las horas
    entry.hours = Number(hours);
    entry.source = 'excel';
  } else {
    // PEP nuevo para esta persona y mes: SE AGREGA
    state.realEntries.push({id:uid('ent'), category, projectId, personId, month, hours:Number(hours), note:'', source:'excel', loggedBy:'', createdAt:Date.now()});
  }
}

function parseMonthFromCell(cell){
  if(cell == null || cell === '') return null;
  
  // 1. Date Objects (SheetJS)
  if(cell instanceof Date && !isNaN(cell.getTime())){
    const y = cell.getUTCFullYear();
    const m = String(cell.getUTCMonth() + 1).padStart(2, '0');
    return y + '-' + m;
  }
  
  // 2. Excel Serial Numbers (e.g. 46204..46234 for July 2026)
  const num = Number(cell);
  if(!isNaN(num) && num > 35000 && num < 70000){
    const utcDays = Math.floor(num - 25569);
    const dateObj = new Date(utcDays * 86400 * 1000);
    if(!isNaN(dateObj.getTime())){
      const y = dateObj.getUTCFullYear();
      const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
      return y + '-' + m;
    }
  }
  
  // 3. Strings
  if(typeof cell === 'string'){
    const str = cell.trim();
    const parsedLabel = parseMonthLabel(str);
    if(parsedLabel) return parsedLabel;
    
    // Formato latino DD/MM/YYYY o DD-MM-YYYY (ej. 08/07/2026 -> 2026-07)
    const ddmmyyyy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(ddmmyyyy){
      const month = parseInt(ddmmyyyy[2], 10);
      const year = parseInt(ddmmyyyy[3], 10);
      if(month >= 1 && month <= 12){
        return year + '-' + String(month).padStart(2, '0');
      }
    }

    // Formato ISO YYYY-MM-DD o YYYY/MM/DD
    const yyyymmdd = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if(yyyymmdd){
      const year = parseInt(yyyymmdd[1], 10);
      const month = parseInt(yyyymmdd[2], 10);
      if(month >= 1 && month <= 12){
        return year + '-' + String(month).padStart(2, '0');
      }
    }
  }
  return null;
}

function uploadTimesheetExcel(){
  const fileInput = document.getElementById('bulk_file');
  const file = fileInput.files[0];
  if(!file){ showToast('Selecciona un archivo.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const parsed = {}; // { nombreHoja: { cellA: str, projectsMap: { etiquetaProyecto: { 'YYYY-MM': horas } } } }

      wb.SheetNames.forEach(sheetName=>{
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        if(!rows || rows.length===0) return;

        let headerRowIdx = rows.findIndex(r => {
          const v = String(r[0]||'').trim().toLowerCase();
          return v === 'proyecto' || v.startsWith('proyecto') || v === 'pep';
        });

        if(headerRowIdx===-1){
          headerRowIdx = rows.findIndex(r => {
            let dateCount = 0;
            (r||[]).forEach((c, i)=>{
              if(i>1 && parseMonthFromCell(c)) dateCount++;
            });
            return dateCount >= 3;
          });
        }
        if(headerRowIdx===-1) return;

        const headerRow = rows[headerRowIdx];
        const cellA3 = String(headerRow[0]||'').trim();
        const dateCols = [];
        headerRow.forEach((cell, idx)=>{
          if(idx === 0 || idx === 1) return;
          const monthStr = parseMonthFromCell(cell);
          if(monthStr){
            dateCols.push({idx, month: monthStr});
          }
        });
        if(dateCols.length===0) return;

        const projectsMap = {};
        for(let i=headerRowIdx+1; i<rows.length; i++){
          const row = rows[i];
          const label = String(row[0]||'').trim();
          if(!label || label.toLowerCase() === 'total' || label.toLowerCase() === 't') continue;
          dateCols.forEach(dc=>{
            const hours = Number(row[dc.idx]);
            if(!isNaN(hours) && hours>=0){
              if(!projectsMap[label]) projectsMap[label] = {};
              projectsMap[label][dc.month] = (projectsMap[label][dc.month]||0) + hours;
            }
          });
        }
        if(Object.keys(projectsMap).length){
          parsed[sheetName.trim()] = {
            cellA: cellA3,
            projectsMap
          };
        }
      });

      if(Object.keys(parsed).length===0){
        showToast('No se encontraron hojas con horas cargadas en el archivo.');
        fileInput.value=''; return;
      }

      // 1. Limpia adecuadamente los registros de Excel anteriores para las personas del archivo
      Object.entries(parsed).forEach(([sheetName, sheetData])=>{
        let person = state.people.find(p=>namesMatch(sheetName, p.name));
        if(!person && sheetData.cellA){
          person = state.people.find(p=>namesMatch(sheetData.cellA, p.name));
        }
        if(!person) return;

        const monthsInSheet = new Set();
        Object.values(sheetData.projectsMap).forEach(monthsObj=>{
          Object.keys(monthsObj).forEach(m=> monthsInSheet.add(m));
        });

        // Limpiar de realEntries de origen excel las entradas de los meses involucrados para esta persona
        state.realEntries = state.realEntries.filter(entry=>{
          if(entry.personId === person.id && entry.source === 'excel' && (monthsInSheet.has(entry.month) || entry.month === '2026-08')) return false;
          return true;
        });
      });

      let matchedCount=0, adminCount=0;
      const unmatchedPeople=[], unmatchedProjects=[];

      // 2. Imputación de horas
      Object.entries(parsed).forEach(([sheetName, sheetData])=>{
        const projectsMap = sheetData.projectsMap;
        let person = state.people.find(p=>namesMatch(sheetName, p.name));
        if(!person && sheetData.cellA){
          person = state.people.find(p=>namesMatch(sheetData.cellA, p.name));
        }
        if(!person){ unmatchedPeople.push(sheetName); return; }

        Object.entries(projectsMap).forEach(([label, monthsObj])=>{
          const project = findMatchingProject(label);
          const code = extractPepCode(label) || label;
          Object.entries(monthsObj).forEach(([month, hours])=>{
            if(project){
              const cat = (project.tipo === 'admin') ? 'admin' : 'project';
              addRealEntryHours(cat, project.id, person.id, month, hours);
              if(cat==='admin') adminCount++; else matchedCount++;
            }else{
              unmatchedProjects.push(person.name+' — '+label+' ('+(code||'sin PEP')+') — '+fmtMonth(month)+': '+fmtH(hours)+' h');
            }
          });
        });
      });

      persistEntries(); renderKPIs(); renderContent();
      if(unmatchedPeople.length || unmatchedProjects.length){
        showUnmatchedTimesheetModal(matchedCount, adminCount, unmatchedPeople, unmatchedProjects);
      }else{
        showToast('Carga completa: '+matchedCount+' registro(s) sumados a proyectos, '+adminCount+' a administración.');
      }
      fileInput.value='';
    }catch(err){
      console.error(err);
      showToast('No se pudo leer el archivo. Verifica que sea el formato de planilla esperado.');
    }
  };
  reader.readAsArrayBuffer(file);
}
