<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HH Tracker — Monitoreo de Horas por Proyecto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --navy: #1E2A5E;
  --navy-dark: #141B3D;
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --border: #E2E4EC;
  --text: #1A1D29;
  --muted: #6B7280;
  --teal: #1E9E8B;
  --teal-bg: #E6F5F2;
  --amber: #DB9A2E;
  --amber-bg: #FBF1DF;
  --red: #D6493E;
  --red-bg: #FBE7E5;
  --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
  --radius: 12px;
}

[data-theme="dark"]{
  --navy: #38BDF8;
  --navy-dark: #0F172A;
  --bg: #0B0F19;
  --surface: #151D2A;
  --border: #232D3F;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --teal: #2DD4BF;
  --teal-bg: rgba(45, 212, 191, 0.15);
  --amber: #F59E0B;
  --amber-bg: rgba(245, 158, 11, 0.15);
  --red: #F87171;
  --red-bg: rgba(248, 113, 113, 0.15);
  --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter', system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:60px;
  transition: background 0.25s ease, color 0.25s ease;
}
.mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; }
.muted{ color:var(--muted); }
button{ font-family:inherit; cursor:pointer; }
input, select, textarea{ font-family:inherit; font-size:14px; color:var(--text); background:var(--surface); }

.topbar{
  background:linear-gradient(135deg, #141B3D 0%, #0F172A 100%);
  color:#fff;
  padding:24px 32px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.topbar-inner{ max-width:1180px; margin:0 auto; }
.topbar h1{ font-size:24px; font-weight:700; letter-spacing:-0.02em; }
.topbar .subtitle{ color:#B9C0E0; font-size:13.5px; margin-top:4px; }

.quick-timer-bar{
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  padding: 10px 16px;
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.quick-timer-display{
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: #5FE3CC;
  min-width: 80px;
}

.kpi-strip{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:22px; }
.kpi{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius); padding:12px 14px; }
.kpi .kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#A9B1D6; }
.kpi .kpi-value{ font-size:20px; font-weight:600; margin-top:4px; font-family:'JetBrains Mono', monospace; }
.kpi .kpi-value.teal{ color:#5FE3CC; }
.kpi .kpi-value.amber{ color:#F5C15A; }
.kpi .kpi-value.red{ color:#F28A81; }

.tabs{ max-width:1180px; margin:0 auto; display:flex; gap:4px; padding:0 32px; margin-top:18px; border-bottom:1px solid var(--border); background:var(--bg); flex-wrap:wrap; }
.tab-btn{ background:none; border:none; padding:12px 16px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2.5px solid transparent; transition:all .15s; }
.tab-btn:hover{ color:var(--navy); }
.tab-btn.active{ color:var(--navy); border-bottom-color:var(--teal); }

.content{ max-width:1180px; margin:24px auto 0; padding:0 32px; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
.card-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
.card-title{ font-size:16px; font-weight:700; }
.card-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }

.badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
.badge.activo{ background:var(--teal-bg); color:var(--teal); }
.badge.pausa{ background:var(--amber-bg); color:var(--amber); }
.badge.cerrado{ background:var(--bg); color:var(--muted); border:1px solid var(--border); }
.badge.iniciar{ background:var(--teal-bg); color:var(--teal); }

.btn{ border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; border:1px solid transparent; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary{ background:var(--teal); color:#0F172A; }
.btn-primary:hover{ opacity:0.9; }
.btn-secondary{ background:var(--surface); color:var(--text); border-color:var(--border); }
.btn-secondary:hover{ background:var(--bg); }
.btn-ghost{ background:none; color:var(--muted); padding:6px 10px; }
.btn-ghost:hover{ color:var(--red); }
.btn-sm{ padding:6px 11px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.gauge{ width:100%; }
.gauge-track{ position:relative; height:9px; background:var(--bg); border-radius:5px; overflow:visible; border:1px solid var(--border); }
.gauge-fill{ height:100%; border-radius:5px; transition:width .3s; }
.gauge-marker{ position:absolute; top:-3px; width:2px; height:15px; background:var(--text); border-radius:1px; }
.gauge-label{ display:flex; align-items:baseline; gap:5px; margin-top:6px; font-size:12.5px; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); padding:8px 10px; border-bottom:1.5px solid var(--border); }
td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; color:var(--text); }
tr:last-child td{ border-bottom:none; }
td.mono, th.num{ text-align:right; }

.form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
.field input, .field select, .field textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }

.empty{ text-align:center; padding:50px 20px; color:var(--muted); }
.empty .display{ font-size:17px; color:var(--text); margin-bottom:6px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(15,23,42,0.7); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; backdrop-filter:blur(4px); }
.modal-overlay.open{ display:flex; }
.modal{ background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:24px; width:100%; max-width:540px; box-shadow:var(--card-shadow); }
.modal h3{ font-size:17px; margin-bottom:16px; color:var(--text); }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); color:var(--text); border:1px solid var(--border); padding:11px 20px; border-radius:8px; font-size:13.5px; opacity:0; transition:all .25s; z-index:200; pointer-events:none; max-width:80vw; box-shadow:var(--card-shadow); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.person-row{ display:grid; grid-template-columns:1.4fr 1fr 1.6fr auto; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.person-row:last-child{ border-bottom:none; }
.person-name{ font-weight:600; font-size:13.5px; color:var(--text); }
.person-role{ font-size:12px; color:var(--muted); }

.section-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:700; margin:18px 0 8px; }
.loading{ text-align:center; padding:80px; color:var(--muted); }
.link-btn{ background:none; border:none; color:var(--teal); font-weight:600; font-size:13px; }
.hidden{ display:none !important; }
.expand-toggle{ cursor:pointer; user-select:none; }
.chip{ background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:2px 8px; font-size:11.5px; color:var(--muted); }
.filter-bar{ display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.breadcrumb{ margin-bottom:16px; font-size:13px; display:flex; align-items:center; flex-wrap:wrap; }
.breadcrumb a{ cursor:pointer; color:var(--muted); font-weight:600; }
.breadcrumb a:hover{ color:var(--teal); text-decoration:underline; }
.breadcrumb a.active{ color:var(--text); }
.crumb-sep{ margin:0 6px; color:var(--border); }
.topbar-btn{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#D7DBEF; padding:9px 18px; border-radius:8px; font-size:13.5px; font-weight:700; transition:all .15s; }
.topbar-btn:hover{ background:rgba(255,255,255,0.16); color:#fff; }
.topbar-btn.active{ background:var(--teal); color:#0F172A; }
.alert-item{ padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:6px; }
.alert-item.red{ background:var(--red-bg); color:var(--red); }
.alert-item.amber{ background:var(--amber-bg); color:var(--amber); }


/* Responsive Design (PC, Tablet y Celular) */
@media (max-width: 992px) {
  .topbar { padding: 20px 20px 16px; }
  .tabs, .content { padding: 0 20px; }
  .kpi-strip { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}

@media (max-width: 640px) {
  .topbar { padding: 16px 14px 14px; }
  .topbar h1 { font-size: 20px; }
  .topbar .subtitle { font-size: 12px; }
  .topbar-btn { padding: 7px 12px; font-size: 12px; }
  #topNavButtons { width: 100%; justify-content: flex-start; margin-top: 8px; flex-wrap: wrap; }
  
  .tabs { padding: 0 14px; overflow-x: auto; flex-wrap: nowrap; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  .tab-btn { padding: 10px 12px; font-size: 13px; flex-shrink: 0; }
  
  .content { padding: 0 12px; margin-top: 14px; }
  .card { padding: 14px; border-radius: 10px; }
  .card-title { font-size: 15px; }
  
  .kpi-strip { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
  .kpi:last-child { grid-column: span 2; }
  .kpi { padding: 10px 12px; }
  .kpi .kpi-value { font-size: 17px; }
  
  .person-row { grid-template-columns: 1fr; gap: 8px; padding: 12px 0; }
  .filter-bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .filter-bar select, .filter-bar input, .filter-bar button { width: 100%; }

  .modal-overlay { padding: 16px 10px; }
  .modal { padding: 18px 14px; width: 96%; }

  /* Tablas con desplazamiento suave táctil en celulares */
  .card div[style*="overflow-x:auto"], table {
    -webkit-overflow-scrolling: touch;
  }
}

/* Styles for Print / PDF Export */
@media print {
  body { background:#fff; padding-bottom:0; }
  .topbar-btn, #topNavButtons, .modal-overlay, .toast, .no-print, button, input[type="file"], .filter-card-actions { display:none !important; }
  .card { border:1px solid #ccc; box-shadow:none; break-inside:avoid; }
  .topbar { background:#141B3D !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap">
      <div class="expand-toggle" onclick="switchMainView('dashboard')">
        <h1>HH Tracker</h1>
        <div class="subtitle">Monitoreo de horas hombre por proyecto, persona y rol — proyectado vs. real</div>
      </div>
      <div style="display:flex; gap:8px" id="topNavButtons"></div>
    </div>
    <div class="kpi-strip" id="kpiStrip"></div>
  </div>
</div>

<div id="subnav"></div>

<div class="content" id="content">
  <div class="loading">Cargando datos…</div>
</div>

<footer style="max-width:1180px; margin:40px auto 0; padding:20px 32px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px">
  <div><strong>HH Tracker v2.0</strong> — Monitoreo Consolidado de Horas Hombre</div>
  <div>Desarrollado por <strong>Ricardo Klempau</strong></div>
  <div style="display:flex; align-items:center; gap:8px"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--teal)"></span> Sincronizado en tiempo real con Firebase Firestore</div>
</footer>


<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// ---------- State ----------
let state = {
  projects: [],      // {id,name,client,status,startMonth,endMonth,assignments:[{personId,projectedByMonth:{'YYYY-MM':hrs}}]}
  people: [],         // {id,name,role,rateOverride,capacityOverride}
  realEntries: [],    // {id,category:'project'|'admin',projectId,personId,month,hours,note,source,loggedBy,createdAt}
  config: {roleRates:{}, targetProjectPct:80, targetAdminPct:20, monthlyCapacity:180},
  mainView: 'dashboard',
  hhSubTab: 'proyectos',
  dashMode: 'global', // 'global' | 'hierarchy' | 'unidades' | 'lineas' | 'proyectos' | 'personas'
  loaded: false,
  expandedProject: null,
  dashNav: {unidad:null, linea:null, projectId:null, personId:null},
  entryFilterMonth: 'all',
  capacityMonth: null,
  userName: ''
};

let activeCharts = {};

const STATUS_OPTS = [
  {v:'iniciar', label:'Por iniciar', cls:'iniciar'},
  {v:'activo', label:'Activo', cls:'activo'},
  {v:'pausa', label:'En pausa', cls:'pausa'},
  {v:'cerrado', label:'Cerrado', cls:'cerrado'}
];
const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_ES_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function normalizeStr(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}
function monthLabelFull(m){ // 'YYYY-MM' -> 'Marzo 2026'
  const parts = m.split('-');
  const name = MONTHS_ES_FULL[parseInt(parts[1],10)-1];
  return name.charAt(0).toUpperCase()+name.slice(1)+' '+parts[0];
}
function parseMonthLabel(label){ // 'marzo 2026' / 'MarzO   2026' / 'Marzo, 2026' -> 'YYYY-MM' o null
  const norm = normalizeStr(label).replace(/,/g,' ').replace(/\s+/g,' ');
  const match = norm.match(/^([a-z]+)\s+(\d{4})$/);
  if(!match) return null;
  let word = match[1];
  if(word==='setiembre') word='septiembre';
  const idx = MONTHS_ES_FULL.indexOf(word);
  if(idx===-1) return null;
  return match[2]+'-'+String(idx+1).padStart(2,'0');
}

// ---------- Storage (Firebase Firestore) ----------
function defaultConfig(){ return {roleRates:{}, unidades:[], lineasNegocio:[], targetProjectPct:80, targetAdminPct:20, monthlyCapacity:180}; }
function migrateConfigShape(){
  if(!state.config.unidades) state.config.unidades=[];
  if(!state.config.lineasNegocio) state.config.lineasNegocio=[];
  let changed=false;
  state.config.lineasNegocio = state.config.lineasNegocio.map(l=>{
    if(typeof l === 'string'){ changed=true; return {nombre:l, unidad:''}; }
    return l;
  });
  return changed;
}
function getUnidadForLinea(lineaNombre){
  const l = (state.config.lineasNegocio||[]).find(x=>x.nombre===lineaNombre);
  return l ? (l.unidad||'') : '';
}
function lineasDeUnidad(unidad){
  return (state.config.lineasNegocio||[]).filter(l=>l.unidad===unidad).map(l=>l.nombre);
}
function peopleInLinea(lineaNombre){ return state.people.filter(p=>p.lineaNegocio===lineaNombre); }
function peopleInUnidad(unidad){ return state.people.filter(p=>getUnidadForLinea(p.lineaNegocio)===unidad); }
function projectsForPeopleIds(personIds){
  return state.projects.filter(p=>(p.assignments||[]).some(a=>personIds.has(a.personId)));
}
function projectTotalsForPeople(project, personIds){
  let projectedHours=0, actualHours=0, projectedCost=0, actualCost=0;
  (project.assignments||[]).forEach(a=>{
    if(personIds && !personIds.has(a.personId)) return;
    const person = getPerson(a.personId); if(!person) return;
    const proj = assignmentProjectedTotal(a);
    const act = projectRealHoursForPerson(project.id, a.personId);
    const rate = personRate(person);
    projectedHours += proj; actualHours += act; projectedCost += proj*rate; actualCost += act*rate;
  });
  return {projectedHours, actualHours, projectedCost, actualCost};
}

const firebaseConfig = {
  apiKey: "AIzaSyDq00jxts_xGmF_ZMA98-0qd313vE-eKks",
  authDomain: "hh-circularexpande.firebaseapp.com",
  projectId: "hh-circularexpande",
  storageBucket: "hh-circularexpande.firebasestorage.app",
  messagingSenderId: "861286796980",
  appId: "1:861286796980:web:7e42688bb4fe7c77a4d1e1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FS_COLLECTION = 'hhtracker_data'; // Colección real de producción

async function fsSet(key, jsonString){
  try{
    await db.collection(FS_COLLECTION).doc(key).set({
      json: jsonString,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){ console.error('fsSet error', key, e); return false; }
}

// Cada documento se sincroniza en tiempo real: si otra persona carga datos
// desde otro navegador, este cliente se actualiza solo, sin recargar la página.
const _fsLoadedFlags = {projects:false, people:false, real_entries:false, config:false};
function _fsCheckAllLoaded(){
  if(!state.loaded && Object.values(_fsLoadedFlags).every(Boolean)){
    state.loaded = true;
    state.capacityMonth = currentMonth();
    migrateProjectPeople();
    if(migrateConfigShape()) persistConfig();
  }
  if(state.loaded) renderAll();
}

function initFirestoreSync(){
  state.userName = localStorage.getItem('hh_username') || '';

  db.collection(FS_COLLECTION).doc('projects').onSnapshot(doc=>{
    state.projects = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : [];
    _fsLoadedFlags.projects = true; _fsCheckAllLoaded();
  }, err=>{ console.error(err); showToast('Error de conexión con la base de datos.'); });

  db.collection(FS_COLLECTION).doc('people').onSnapshot(doc=>{
    state.people = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : [];
    _fsLoadedFlags.people = true; _fsCheckAllLoaded();
  }, err=>{ console.error(err); });

  db.collection(FS_COLLECTION).doc('real_entries').onSnapshot(doc=>{
    state.realEntries = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : [];
    _fsLoadedFlags.real_entries = true; _fsCheckAllLoaded();
  }, err=>{ console.error(err); });

  db.collection(FS_COLLECTION).doc('config').onSnapshot(doc=>{
    state.config = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : defaultConfig();
    _fsLoadedFlags.config = true; _fsCheckAllLoaded();
  }, err=>{ console.error(err); });
}

function migrateProjectPeople(){
  let changed = false;
  const nameToId = {};
  state.people.forEach(p=> nameToId[p.name.trim().toLowerCase()] = p.id);
  state.projects.forEach(proj=>{
    if(proj.people && Array.isArray(proj.people)){
      changed = true;
      if(!proj.assignments) proj.assignments = [];
      proj.people.forEach(op=>{
        const key = (op.name||'').trim().toLowerCase();
        let gid = nameToId[key];
        if(!gid){
          gid = uid('pers');
          state.people.push({id:gid, name:op.name, role:op.role||'Consultor', rateOverride:(op.rate!=null?op.rate:null), capacityOverride:null});
          nameToId[key] = gid;
        }
        if(op.role && !state.config.roleRates.hasOwnProperty(op.role)) state.config.roleRates[op.role] = op.rate||0;
        const pbm = {};
        if(op.projectedHours) pbm[currentMonth()] = op.projectedHours;
        proj.assignments.push({personId:gid, projectedByMonth:pbm, _oldId:op.id});
      });
      delete proj.people;
    }
    if(!proj.assignments) proj.assignments = [];
    if(!proj.startMonth) proj.startMonth = '';
    if(!proj.endMonth) proj.endMonth = '';
  });
  if(changed){ persistProjects(); persistPeople(); persistConfig(); }
}

async function persistProjects(){ const ok = await fsSet('projects', JSON.stringify(state.projects)); if(!ok) showToast('No se pudo guardar el proyecto (revisa tu conexión).'); }

// ---------- Helpers ----------
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtH(n){ return new Intl.NumberFormat('es-CL',{maximumFractionDigits:1}).format(n||0); }
function fmtMoney(n){ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Math.round(n||0)); }
function currentMonth(){ return new Date().toISOString().slice(0,7); }
function fmtMonth(m){ if(!m) return '—'; const parts=m.split('-'); return MONTHS_ES[parseInt(parts[1],10)-1] + ' ' + parts[0]; }
function monthRange(start,end){
  if(!start||!end) return [];
  const sp=start.split('-').map(Number), ep=end.split('-').map(Number);
  let y=sp[0], m=sp[1]; const ye=ep[0], me=ep[1];
  const res=[]; let guard=0;
  while((y<ye || (y===ye && m<=me)) && guard<120){
    res.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
    guard++;
  }
  return res;
}
function addMonthsAgo(n){
  const d = new Date(); const res=[];
  for(let i=n-1;i>=0;i--){
    const dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
    res.push(dt.toISOString().slice(0,7));
  }
  return res;
}
function monthsForward(n){
  const d = new Date(); const res=[];
  for(let i=0;i<n;i++){
    const dt = new Date(d.getFullYear(), d.getMonth()+i, 1);
    res.push(dt.toISOString().slice(0,7));
  }
  return res;
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
function statusMeta(v){ return STATUS_OPTS.find(s=>s.v===v) || STATUS_OPTS[0]; }
function ratioColor(ratio){
  if(ratio > 1.1) return 'var(--red)';
  if(ratio >= 0.9) return 'var(--teal)';
  return 'var(--amber)';
}
function getPerson(id){ return state.people.find(p=>p.id===id); }
function roleRate(role){ return Number(state.config.roleRates[role]||0); }
function personRate(person){ if(!person) return 0; return (person.rateOverride!=null && person.rateOverride!=='') ? Number(person.rateOverride) : roleRate(person.role); }
function personCapacity(person){ if(!person) return Number(state.config.monthlyCapacity||180); return (person.capacityOverride!=null && person.capacityOverride!=='') ? Number(person.capacityOverride) : Number(state.config.monthlyCapacity||180); }
function personTargetProjectPct(person){ if(!person) return Number(state.config.targetProjectPct||80); return (person.targetProjectPctOverride!=null && person.targetProjectPctOverride!=='') ? Number(person.targetProjectPctOverride) : Number(state.config.targetProjectPct||80); }
function personTargetAdminPct(person){ if(!person) return Number(state.config.targetAdminPct||20); return (person.targetAdminPctOverride!=null && person.targetAdminPctOverride!=='') ? Number(person.targetAdminPctOverride) : Number(state.config.targetAdminPct||20); }
function assignmentProjectedTotal(a){ return Object.values(a.projectedByMonth||{}).reduce((s,v)=>s+Number(v||0),0); }
function projectRealHoursForPerson(projectId, personId){ return state.realEntries.filter(e=>e.category==='project' && e.projectId===projectId && e.personId===personId).reduce((s,e)=>s+Number(e.hours||0),0); }
function personProjectHoursInMonth(personId, month){ return state.realEntries.filter(e=>e.category==='project' && e.personId===personId && e.month===month).reduce((s,e)=>s+Number(e.hours||0),0); }
function personAdminHoursInMonth(personId, month){ return state.realEntries.filter(e=>e.category==='admin' && e.personId===personId && e.month===month).reduce((s,e)=>s+Number(e.hours||0),0); }
function lastMonthsDesc(n){ return addMonthsAgo(n).slice().reverse(); }

function projectTotals(project){ return projectTotalsForPeople(project, null); }

function gauge(projected, actual){
  projected = Number(projected)||0; actual = Number(actual)||0;
  const scale = Math.max(projected, actual, 1) * 1.15;
  const markerPct = (projected/scale*100).toFixed(2);
  const fillPct = (actual/scale*100).toFixed(2);
  const ratio = projected>0 ? actual/projected : (actual>0 ? 2 : 0);
  const color = ratioColor(ratio);
  const pctLabel = projected>0 ? (ratio*100).toFixed(0)+'%' : (actual>0 ? '—' : '0%');
  return '<div class="gauge">'
    + '<div class="gauge-track">'
    + '<div class="gauge-fill" style="width:'+fillPct+'%;background:'+color+'"></div>'
    + '<div class="gauge-marker" style="left:'+markerPct+'%"></div>'
    + '</div>'
    + '<div class="gauge-label"><span class="mono" style="font-weight:600">'+fmtH(actual)+' h</span><span class="muted">/ '+fmtH(projected)+' h proy.</span><span class="mono" style="color:'+color+';font-weight:700;margin-left:auto">'+pctLabel+'</span></div>'
    + '</div>';
}

function getAvailableYears(){
  const set = new Set();
  const currentY = String(new Date().getFullYear());
  set.add(currentY);
  (state.realEntries||[]).forEach(e => { if(e.month) set.add(e.month.slice(0,4)); });
  (state.projects||[]).forEach(p => {
    (p.assignments||[]).forEach(a => {
      Object.keys(a.projectedByMonth||{}).forEach(m => set.add(m.slice(0,4)));
    });
  });
  return Array.from(set).sort().reverse();
}

function initDashFilters(){
  if(!Array.isArray(state.dashYearsFilter)) state.dashYearsFilter = [String(new Date().getFullYear())];
  if(!Array.isArray(state.dashMonthsFilter)) state.dashMonthsFilter = [];
  initEntityFilters();
}

function initEntityFilters(){
  if(!state.dashFilterUnidad) state.dashFilterUnidad = 'all';
  if(!state.dashFilterLinea) state.dashFilterLinea = 'all';
  if(!state.dashFilterProyecto) state.dashFilterProyecto = 'all';
}

function setDashEntityFilter(type, value){
  initEntityFilters();
  if(type === 'unidad') {
    state.dashFilterUnidad = value;
    if(value !== 'all' && state.dashFilterLinea !== 'all'){
      const lineasInU = new Set(lineasDeUnidad(value));
      if(!lineasInU.has(state.dashFilterLinea)) state.dashFilterLinea = 'all';
    }
  } else if(type === 'linea') {
    state.dashFilterLinea = value;
    if(value !== 'all'){
      const obj = (state.config.lineasNegocio||[]).find(l => l.nombre === value);
      if(obj && obj.unidad) state.dashFilterUnidad = obj.unidad;
    }
  } else if(type === 'proyecto') {
    state.dashFilterProyecto = value;
    if(value !== 'all'){
      const proj = state.projects.find(p => p.id === value);
      if(proj && proj.lineaNegocio) {
        state.dashFilterLinea = proj.lineaNegocio;
        const obj = (state.config.lineasNegocio||[]).find(l => l.nombre === proj.lineaNegocio);
        if(obj && obj.unidad) state.dashFilterUnidad = obj.unidad;
      }
    }
  }
  renderAll();
}

function resetDashEntityFilters(){
  state.dashFilterUnidad = 'all';
  state.dashFilterLinea = 'all';
  state.dashFilterProyecto = 'all';
  renderAll();
}

function isProjectInEntityFilter(p){
  initEntityFilters();
  if(!p) return true;

  if(state.dashFilterProyecto !== 'all' && p.id !== state.dashFilterProyecto) return false;
  if(state.dashFilterLinea !== 'all' && (p.lineaNegocio || '') !== state.dashFilterLinea) return false;

  if(state.dashFilterUnidad !== 'all'){
    const unidadPeople = new Set(peopleInUnidad(state.dashFilterUnidad).map(x=>x.id));
    const hasAssignedInUnidad = (p.assignments||[]).some(a => unidadPeople.has(a.personId));
    const lineasInU = new Set(lineasDeUnidad(state.dashFilterUnidad));
    const isLineInUnidad = p.lineaNegocio && lineasInU.has(p.lineaNegocio);
    if(!hasAssignedInUnidad && !isLineInUnidad) return false;
  }

  return true;
}

function isPersonInEntityFilter(person){
  initEntityFilters();
  if(!person) return true;

  if(state.dashFilterUnidad !== 'all'){
    const unidadPeople = new Set(peopleInUnidad(state.dashFilterUnidad).map(x=>x.id));
    if(!unidadPeople.has(person.id)) return false;
  }

  if(state.dashFilterLinea !== 'all'){
    if((person.lineaNegocio || '') !== state.dashFilterLinea) return false;
  }

  if(state.dashFilterProyecto !== 'all'){
    const proj = state.projects.find(x => x.id === state.dashFilterProyecto);
    if(proj){
      const assignedIds = new Set((proj.assignments||[]).map(a => a.personId));
      if(!assignedIds.has(person.id)) return false;
    }
  }

  return true;
}

function isMonthInFilter(monthStr){
  if(!monthStr) return false;
  initDashFilters();
  const parts = monthStr.split('-');
  if(parts.length < 2) return false;
  const y = parts[0], m = parts[1];

  const yearMatch = state.dashYearsFilter.length === 0 || state.dashYearsFilter.includes('all') || state.dashYearsFilter.includes(y);
  const monthMatch = state.dashMonthsFilter.length === 0 || state.dashMonthsFilter.includes('all') || state.dashMonthsFilter.includes(m);
  return yearMatch && monthMatch;
}

function toggleDashYear(year){
  initDashFilters();
  if(year === 'all'){
    state.dashYearsFilter = ['all'];
  } else {
    state.dashYearsFilter = state.dashYearsFilter.filter(x => x !== 'all');
    if(state.dashYearsFilter.includes(year)){
      state.dashYearsFilter = state.dashYearsFilter.filter(x => x !== year);
    } else {
      state.dashYearsFilter.push(year);
    }
    if(state.dashYearsFilter.length === 0) state.dashYearsFilter = ['all'];
  }
  renderContent();
}

function toggleDashMonth(monthNum){
  initDashFilters();
  if(monthNum === 'all'){
    state.dashMonthsFilter = [];
  } else {
    state.dashMonthsFilter = state.dashMonthsFilter.filter(x => x !== 'all');
    if(state.dashMonthsFilter.includes(monthNum)){
      state.dashMonthsFilter = state.dashMonthsFilter.filter(x => x !== monthNum);
    } else {
      state.dashMonthsFilter.push(monthNum);
    }
  }
  renderContent();
}

function getFilteredTotals(){
  initEntityFilters();
  let projClient = 0, actClient = 0;
  let projAdmin = 0, actAdmin = 0;

  state.projects.forEach(p => {
    if(!isProjectInEntityFilter(p)) return;
    const isAdmin = p.tipo === 'admin';
    (p.assignments||[]).forEach(a => {
      Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
        if(isMonthInFilter(m)){
          if(isAdmin) projAdmin += Number(h||0);
          else projClient += Number(h||0);
        }
      });
    });
  });

  state.realEntries.forEach(e => {
    if(isMonthInFilter(e.month)){
      const hours = Number(e.hours||0);
      const proj = state.projects.find(p => p.id === e.projectId);
      if(proj && !isProjectInEntityFilter(proj)) return;
      if(e.category === 'admin') {
        actAdmin += hours;
      } else {
        if(proj && proj.tipo === 'admin') actAdmin += hours;
        else actClient += hours;
      }
    }
  });

  return { projClient, actClient, projAdmin, actAdmin };
}

function dashCardFor(label, sublabel, personIds, onClick){
  const people = state.people.filter(p=>personIds.has(p.id));
  const projects = projectsForPeopleIds(personIds);
  let projH=0, actH=0;
  projects.forEach(pr=>{ const t = projectTotalsForPeople(pr, personIds); projH+=t.projectedHours; actH+=t.actualHours; });

    + '<div class="card-header"><div><div class="card-title">'+label+'</div><div class="card-sub">'+sublabel+' · '+people.length+' persona(s) · '+projects.length+' proyecto(s)</div></div>'

function createUnidadChart(canvasId, chartKey, filterType){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(activeCharts[chartKey]){ activeCharts[chartKey].destroy(); activeCharts[chartKey]=null; }

  const unidades = state.config.unidades || [];
  const labelsU = [];
  const projU = [];
  const actU = [];

  unidades.forEach(u => {
    labelsU.push(u);
    const personIds = new Set(peopleInUnidad(u).map(p=>p.id));
    let pH = 0, aH = 0;

    state.projects.forEach(p => {
      const matchProj = (filterType === 'all') || (filterType === 'proyectos' && p.tipo !== 'admin') || (filterType === 'admin' && p.tipo === 'admin');
      if(matchProj){
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId)){
            Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
              if(isMonthInFilter(m)) pH += Number(h||0);
            });
          }
        });
      }
    });

    state.realEntries.forEach(e => {
      if(isMonthInFilter(e.month) && personIds.has(e.personId)){
        let isAdmin = e.category === 'admin';
        if(!isAdmin && e.projectId){
          const proj = state.projects.find(p => p.id === e.projectId);
          if(proj && proj.tipo === 'admin') isAdmin = true;
        }
        const matchEntry = (filterType === 'all') || (filterType === 'proyectos' && !isAdmin) || (filterType === 'admin' && isAdmin);
        if(matchEntry){
          aH += Number(e.hours||0);
        }
      }
    });

    projU.push(pH);
    actU.push(aH);
  });

  const realColor = (filterType === 'admin') ? '#DB9A2E' : '#1E9E8B';

  activeCharts[chartKey] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labelsU.length ? labelsU : ['Sin unidades'],
      datasets: [
        { label: 'HH Proyectadas', data: projU.length ? projU : [0], backgroundColor: '#1E2A5E', borderRadius: 4, maxBarThickness: 35 },
        { label: 'HH Reales (Ejecutadas)', data: actU.length ? actU : [0], backgroundColor: realColor, borderRadius: 4, maxBarThickness: 35 }

    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top' },
        tooltip: { callbacks: { label: function(c){ return c.dataset.label + ': ' + fmtH(c.raw) + ' h'; } } }
      },
      scales: { x: { beginAtZero: true, ticks: { callback: function(val){ return val + ' h'; } } } }
    }
  });

function exportFullReportExcel(){
  try {
    const wb = XLSX.utils.book_new();

    // Tab 1: Proyectos
    const projHeaders = ['PEP', 'Nombre Proyecto', 'Cliente', 'Estado', 'Fecha Inicio', 'Fecha Cierre', 'Monto Adjudicado (CLP)', 'HH Proyectadas', 'HH Reales', 'Avance %', 'Costo Proyectado (CLP)', 'Costo Real (CLP)', 'Desviacion Costo (CLP)'];
    const projRows = state.projects.map(p => {
      const t = projectTotals(p);
      const dev = t.actualCost - t.projectedCost;
      const pct = t.projectedHours > 0 ? Math.round((t.actualHours / t.projectedHours) * 100) + '%' : '—';
      return [
        p.pep || '',
        p.name,
        p.client || '',
        p.status,
        p.fechaInicio || '',
        p.fechaCierre || '',
        p.montoAdjudicacion || 0,
        t.projectedHours,
        t.actualHours,
        pct,
        t.projectedCost,
        t.actualCost,
        dev
      ];
    });
    const wsProj = XLSX.utils.aoa_to_sheet([projHeaders].concat(projRows));
    XLSX.utils.book_append_sheet(wb, wsProj, 'Resumen Proyectos');

    // Tab 2: Equipo
    const teamHeaders = ['Nombre', 'Línea de Negocio', 'Unidad', 'Rol', 'Tarifa/h (CLP)', 'Capacidad Mensual (h)', 'Total HH Proyectadas', 'Total HH Reales'];
    const teamRows = state.people.map(p => {
      let totalProj = 0, totalAct = 0;
      state.projects.forEach(pr => {
        (pr.assignments || []).forEach(a => {
          if (a.personId === p.id) {
            totalProj += assignmentProjectedTotal(a);
            totalAct += projectRealHoursForPerson(pr.id, p.id);
          }
        });
      });
      return [
        p.name,
        p.lineaNegocio || '',
        getUnidadForLinea(p.lineaNegocio),
        p.role,
        personRate(p),
        personCapacity(p),
        totalProj,
        totalAct
      ];
    });
    const wsTeam = XLSX.utils.aoa_to_sheet([teamHeaders].concat(teamRows));
    XLSX.utils.book_append_sheet(wb, wsTeam, 'Resumen Equipo');

    // Tab 3: Registros Reales
    const entryHeaders = ['Mes', 'Categoría', 'Proyecto / Referencia', 'Persona', 'Rol', 'Horas Reales', 'Nota', 'Fuente'];
    const entryRows = state.realEntries.map(e => {
      const person = getPerson(e.personId);
      const proj = e.projectId ? state.projects.find(pr => pr.id === e.projectId) : null;
      return [
        e.month,
        e.category === 'admin' ? 'Administración' : 'Proyecto',
        e.category === 'admin' ? 'Administración' : (proj ? proj.name : 'Proyecto Eliminado'),
        person ? person.name : '',
        person ? person.role : '',
        e.hours,
        e.note || '',
        e.source || 'manual'
      ];
    });
    const wsEntries = XLSX.utils.aoa_to_sheet([entryHeaders].concat(entryRows));
    XLSX.utils.book_append_sheet(wb, wsEntries, 'Registros Reales');

    XLSX.writeFile(wb, 'HH_Tracker_Reporte_Consolidado_' + currentMonth() + '.xlsx');
    showToast('Reporte Excel generado correctamente.');
  } catch(err) {
    console.error(err);
    showToast('Error al exportar reporte Excel.');
  }
}

function renderDashUnidadesComplianceTable(){
  initDashFilters();
  const year = (state.dashYearsFilter.length === 1 && state.dashYearsFilter[0] !== 'all')
    ? state.dashYearsFilter[0]
    : String(new Date().getFullYear());

  const monthsShort = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const monthsFull = monthsShort.map((m, idx) => {
    return { num: String(idx + 1).padStart(2, '0'), name: m };
  });

  const unidades = (state.config.unidades || []).filter(u => {
    if(state.dashFilterUnidad !== 'all' && u !== state.dashFilterUnidad) return false;
    return true;
  });
  if(unidades.length === 0){
    return '<div class="card"><div class="empty"><div class="display">Sin Unidades de Negocio configuradas o coincidentes con el filtro</div></div></div>';
  }

  let headCols = monthsFull.map(m => '<th class="num" style="font-size:11.5px; padding:6px 8px; text-align:center">' + m.name + '</th>').join('');
  headCols += '<th class="num" style="font-size:11.5px; padding:6px 8px; text-align:center; background:var(--surface)">Total %</th>';

  const rows = unidades.map(u => {
    const personIds = new Set(peopleInUnidad(u).map(p=>p.id));

    let totalProj = 0, totalAct = 0;
    const monthCells = monthsFull.map(m => {
      const monthKey = year + '-' + m.num;
      const isFiltered = isMonthInFilter(monthKey);

      let projM = 0, actM = 0;
      state.projects.forEach(p => {
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId) && a.projectedByMonth && a.projectedByMonth[monthKey]){
            projM += Number(a.projectedByMonth[monthKey] || 0);
          }
        });
      });

      state.realEntries.forEach(e => {
        if(isMonthInFilter(e.month) && e.month === monthKey && personIds.has(e.personId)){
          actM += Number(e.hours || 0);
        }
      });

      totalProj += projM;
      totalAct += actM;

      if(!isFiltered) return '<td class="muted" style="text-align:center; opacity:0.35; font-size:11px">—</td>';

      if(projM === 0 && actM === 0) return '<td class="muted" style="text-align:center; font-size:11px">—</td>';

      if(projM === 0 && actM > 0){
        return '<td style="text-align:center; font-size:11px; font-weight:700; color:var(--amber)" title="' + fmtH(actM) + 'h ejec. sin proyección">!' + fmtH(actM) + 'h</td>';
      }

      const ratio = actM / projM;
      const pctVal = Math.round(ratio * 100);
      let color = 'var(--teal)';
      if(ratio > 1.1) color = 'var(--red)';
      else if(ratio < 0.7) color = 'var(--amber)';

      return '<td style="text-align:center; font-size:11.5px; font-weight:700; color:' + color + '" title="Proy: ' + fmtH(projM) + 'h | Real: ' + fmtH(actM) + 'h">' + pctVal + '%</td>';
    }).join('');

    const totalRatio = totalProj > 0 ? (totalAct / totalProj) : (totalAct > 0 ? 2 : 0);
    const totalPct = totalProj > 0 ? Math.round(totalRatio * 100) + '%' : (totalAct > 0 ? '—' : '0%');
    let totalColor = 'var(--teal)';
    if(totalRatio > 1.1) totalColor = 'var(--red)';
    else if(totalRatio < 0.7 && totalProj > 0) totalColor = 'var(--amber)';

    return '<tr>'
      + '<td style="font-size:12.5px; padding:8px 10px; font-weight:700;">🏢 ' + u + '</td>'
      + monthCells
      + '<td class="mono" style="text-align:center; font-weight:800; font-size:12px; color:' + totalColor + '; background:var(--surface)">' + totalPct + '</td>'
      + '</tr>';
  }).join('');

  return '<div class="card" style="margin-bottom:20px;">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">'
    + '<div>'
    + '<div class="card-title" style="font-size:15px; font-weight:700">🏢 Nivel 1: Matriz de Cumplimiento por Unidad de Negocio (%)</div>'
    + '<div class="card-sub" style="font-size:12px">% Cumplimiento (HH Reales vs. Proyectadas) acumuladas por Unidad — Año ' + year + '</div>'
    + '</div>'
    + '</div>'
    + '<div style="overflow-x:auto">'
    + '<table style="width:100%; border-collapse:collapse; min-width:860px;">'
    + '<thead><tr style="border-bottom:2px solid var(--border)">'
    + '<th style="text-align:left; font-size:12px; padding:6px 10px;">Unidad de Negocio</th>'
    + headCols
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>'
    + '</div>'
    + '</div>';
}

    (p.assignments||[]).forEach(a => {
      Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
        if(isMonthInFilter(m)) pProjH += Number(h||0);
      });
    });
    state.realEntries.forEach(e => {
      if(isMonthInFilter(e.month)){
        if(e.category !== 'admin' && e.projectId === p.id){
          pActH += Number(e.hours||0);
        } else if(p.tipo === 'admin' && e.category === 'admin'){
          pActH += Number(e.hours||0);
        }
      }
    });

    totalProjH += pProjH;
    totalActH += pActH;
    
    if(pProjH > 0 && pActH > pProjH * 1.1){
      overbudgetProjects.push({ name: p.name, proj: pProjH, act: pActH });
    } else if(pProjH === 0 && pActH > 0){
      unprojectedHoursProjects.push({ name: p.name, act: pActH });
    }
  });

  // Find most efficient line
  let bestLine = '—', bestLineRatio = 999;
  (state.config.lineasNegocio||[]).forEach(l => {
    const personIds = new Set(peopleInLinea(l.nombre).map(p=>p.id));
    let pH = 0, aH = 0;
    state.projects.forEach(p => {
      (p.assignments||[]).forEach(a => {
        if(personIds.has(a.personId)){
          Object.entries(a.projectedByMonth||{}).forEach(([m, h]) => {
            if(isMonthInFilter(m)) pH += Number(h||0);
          });
        }
      });
    });
    state.realEntries.forEach(e => {
      if(isMonthInFilter(e.month) && personIds.has(e.personId)){
        aH += Number(e.hours||0);
      }
    });

    if(pH > 0){
      const diff = Math.abs(1 - (aH / pH));
      if(diff < bestLineRatio){
        bestLineRatio = diff;
        bestLine = l.nombre + ' (' + Math.round((aH / pH)*100) + '% cumplimiento)';
      }
    }
  });

  let insightsList = [];
  if(overbudgetProjects.length > 0){
    insightsList.push('<div class="alert-item red">🚨 <b>Desviación Crítica:</b> ' + overbudgetProjects.length + ' proyecto(s) superan el 110% de HH planificadas (' + overbudgetProjects.map(p=>p.name).join(', ') + ').</div>');
  } else {
    insightsList.push('<div class="alert-item teal" style="background:#E6F5F2; color:#1E9E8B">🟢 <b>Presupuesto Saludable:</b> Ningún proyecto excede significativamente el margen proyectado.</div>');
  }

  if(unprojectedHoursProjects.length > 0){
    insightsList.push('<div class="alert-item amber">⚠️ <b>Horas No Planificadas:</b> ' + unprojectedHoursProjects.length + ' proyecto(s) registraron ejecuciones sin contar con proyección previa.</div>');
  }

  if(bestLine !== '—'){
    insightsList.push('<div class="alert-item" style="background:#E8F0FE; color:#1E2A5E">🏆 <b>Línea de Negocio Destacada:</b> ' + bestLine + '.</div>');
  }

  return '<div class="card" style="background:linear-gradient(135deg, #FFFFFF 0%, #F8F9FD 100%); border:1px solid #DCE1F0; margin-bottom:20px;">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">'
    + '<div style="display:flex; align-items:center; gap:8px;">'
    + '<span style="font-size:20px;">💡</span>'
    + '<div>'
    + '<div class="card-title" style="font-size:15px; font-weight:700">Diagnóstico e Insights del Portafolio</div>'
    + '<div class="card-sub" style="font-size:12px">Análisis analítico automatizado 100% local en tiempo real — Año ' + year + '</div>'
    + '</div>'
    + '</div>'
    + '<div style="display:flex; gap:10px;">'
    + '<button class="btn btn-secondary btn-sm no-print" onclick="exportComplianceMatrixCSV()">📥 Exportar Matriz CSV/Excel</button>'
    + '</div>'
    + '</div>'
    + '<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:10px; margin-top:8px;">'
    + insightsList.join('')
    + '</div>'
    + '</div>';
}

function exportComplianceMatrixCSV(){
  initDashFilters();
  const year = (state.dashYearsFilter.length === 1 && state.dashYearsFilter[0] !== 'all')
    ? state.dashYearsFilter[0]
    : String(new Date().getFullYear());

  const monthsShort = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const monthsFull = monthsShort.map((m, idx) => String(idx + 1).padStart(2, '0'));

  let csvRows = [];
  csvRows.push(['MATRIZ DE CUMPLIMIENTO DE HORAS HOMBRE (%) - AÑO ' + year]);
  csvRows.push([]);

  // 1. Unidades
  csvRows.push(['Nivel 1: Unidad de Negocio', ...monthsShort, 'Total %']);
  (state.config.unidades||[]).forEach(u => {
    const personIds = new Set(peopleInUnidad(u).map(p=>p.id));
    let totalProj = 0, totalAct = 0;
    const mPcts = monthsFull.map(mNum => {
      const monthKey = year + '-' + mNum;
      let pM = 0, aM = 0;
      state.projects.forEach(p => {
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId) && a.projectedByMonth && a.projectedByMonth[monthKey]) pM += Number(a.projectedByMonth[monthKey]||0);
        });
      });
      state.realEntries.forEach(e => {
        if(e.month === monthKey && personIds.has(e.personId)) aM += Number(e.hours||0);
      });
      totalProj += pM; totalAct += aM;
      return pM > 0 ? Math.round((aM/pM)*100) + '%' : (aM > 0 ? '!h' : '—');
    });
    const totPct = totalProj > 0 ? Math.round((totalAct/totalProj)*100) + '%' : '—';
    csvRows.push([u, ...mPcts, totPct]);
  });

  csvRows.push([]);
  // 2. Lineas
  csvRows.push(['Nivel 2: Linea de Negocio (Unidad)', ...monthsShort, 'Total %']);
  (state.config.lineasNegocio||[]).forEach(l => {
    const personIds = new Set(peopleInLinea(l.nombre).map(p=>p.id));
    const label = l.nombre + (l.unidad ? ' (' + l.unidad + ')' : '');
    let totalProj = 0, totalAct = 0;
    const mPcts = monthsFull.map(mNum => {
      const monthKey = year + '-' + mNum;
      let pM = 0, aM = 0;
      state.projects.forEach(p => {
        (p.assignments||[]).forEach(a => {
          if(personIds.has(a.personId) && a.projectedByMonth && a.projectedByMonth[monthKey]) pM += Number(a.projectedByMonth[monthKey]||0);
        });
      });
      state.realEntries.forEach(e => {
        if(e.month === monthKey && personIds.has(e.personId)) aM += Number(e.hours||0);
      });
      totalProj += pM; totalAct += aM;
      return pM > 0 ? Math.round((aM/pM)*100) + '%' : (aM > 0 ? '!h' : '—');
    });
    const totPct = totalProj > 0 ? Math.round((totalAct/totalProj)*100) + '%' : '—';
    csvRows.push([label, ...mPcts, totPct]);
  });

  csvRows.push([]);
  // 3. Proyectos
  csvRows.push(['Nivel 3: Proyecto (Linea de Negocio)', ...monthsShort, 'Total %']);
  state.projects.forEach(p => {
    const label = p.name + (p.lineaNegocio ? ' (' + p.lineaNegocio + ')' : '');
    let totalProj = 0, totalAct = 0;
    const mPcts = monthsFull.map(mNum => {
      const monthKey = year + '-' + mNum;
      let pM = 0, aM = 0;
      (p.assignments||[]).forEach(a => {
        if(a.projectedByMonth && a.projectedByMonth[monthKey]) pM += Number(a.projectedByMonth[monthKey]||0);
      });
      state.realEntries.forEach(e => {
        if(e.projectId === p.id && e.month === monthKey) aM += Number(e.hours||0);
      });
      totalProj += pM; totalAct += aM;
      return pM > 0 ? Math.round((aM/pM)*100) + '%' : (aM > 0 ? '!h' : '—');
    });
    const totPct = totalProj > 0 ? Math.round((totalAct/totalProj)*100) + '%' : '—';
    csvRows.push([label, ...mPcts, totPct]);
  });

  let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.map(e => e.map(x => '"' + String(x||'').replace(/"/g, '""') + '"').join(",")).join("\n");
  let encodedUri = encodeURI(csvContent);
  let link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "matriz_cumplimiento_hh_" + year + ".csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function downloadJSONBackup(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
    projects: state.projects,
    people: state.people,
    realEntries: state.realEntries,
    config: state.config,
    exportedAt: new Date().toISOString()
  }, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", "hh_tracker_backup_" + (new Date().toISOString().slice(0,10)) + ".json");
  document.body.appendChild(dlAnchorElem);
  dlAnchorElem.click();
  dlAnchorElem.remove();
  showToast("✅ Respaldo JSON descargado con éxito.");
}

function uploadJSONBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const imported = JSON.parse(e.target.result);
      if(imported.projects && Array.isArray(imported.projects)) state.projects = imported.projects;
      if(imported.people && Array.isArray(imported.people)) state.people = imported.people;
      if(imported.realEntries && Array.isArray(imported.realEntries)) state.realEntries = imported.realEntries;
      if(imported.config) state.config = imported.config;

      persistProjects();
      persistPeople();
      persistEntries();
      persistConfig();
      renderAll();
      showToast("✅ Respaldo restaurado con éxito.");
    } catch(err){
      alert("Error al leer el archivo JSON de respaldo. Verifique que el formato sea válido.");
    }
  };
  reader.readAsText(file);
}

function renderOmniboxResults(query){
  const container = document.getElementById('omniboxResults');
  if(!container) return;

  const q = normalizeStr(query);
  let results = [];

  // 1. Projects & PEPs
  state.projects.forEach(p => {
    if(!q || normalizeStr(p.name).includes(q) || (p.pep && normalizeStr(p.pep).includes(q)) || (p.lineaNegocio && normalizeStr(p.lineaNegocio).includes(q))){
      results.push({
        type: 'Proyecto',
        icon: '📂',
        title: p.name,
        sub: (p.pep ? 'PEP: ' + p.pep + ' · ' : '') + (p.lineaNegocio || 'Sin LN'),
        action: () => { toggleOmniboxModal(); dashGoto({projectId: p.id}); }
      });
    }
  });

  // 2. People
  state.people.forEach(p => {
    if(!q || normalizeStr(p.name).includes(q) || (p.role && normalizeStr(p.role).includes(q)) || (p.lineaNegocio && normalizeStr(p.lineaNegocio).includes(q))){
      results.push({
        type: 'Persona',
        icon: '👤',
        title: p.name,
        sub: p.role + (p.lineaNegocio ? ' · LN: ' + p.lineaNegocio : ''),
        action: () => { toggleOmniboxModal(); dashGoto({personId: p.id}); }
      });
    }
  });

  // 3. Business Lines
  (state.config.lineasNegocio||[]).forEach(l => {
    if(!q || normalizeStr(l.nombre).includes(q) || (l.unidad && normalizeStr(l.unidad).includes(q))){
      results.push({
        type: 'Línea de Negocio',
        icon: '🏷️',
        title: l.nombre,
        sub: l.unidad ? 'Unidad: ' + l.unidad : 'Sin unidad',
        action: () => { toggleOmniboxModal(); dashGoto({linea: l.nombre, unidad: l.unidad||''}); }
      });
    }
  });

  // 4. Business Units
  (state.config.unidades||[]).forEach(u => {
    if(!q || normalizeStr(u).includes(q)){
      results.push({
        type: 'Unidad de Negocio',
        icon: '🏢',
        title: u,
        sub: 'Unidad de Negocio',
        action: () => { toggleOmniboxModal(); dashGoto({unidad: u}); }
      });
    }
  });

  if(results.length === 0){
    container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted)">No se encontraron coincidencias</div>';
    return;
  }

  container.innerHTML = results.slice(0, 12).map((item, idx) => {
    return `<div onclick="window._omniboxActions[${idx}]()" style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:8px; border:1px solid var(--border); cursor:pointer; transition:background .15s;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:16px;">${item.icon}</span>
        <div>
          <div style="font-weight:700; font-size:13.5px;">${item.title}</div>
          <div style="font-size:11.5px; color:var(--muted);">${item.sub}</div>
        </div>
      </div>
      <span class="chip">${item.type}</span>
    </div>`;
  }).join('');

  window._omniboxActions = results.slice(0, 12).map(r => r.action);
}

  const projects = projectsForPeopleIds(personIds);
  if(projects.length===0){
    return '<div class="card"><div class="empty"><div class="display">Sin proyectos para esta línea</div><p>Ningún proyecto tiene personas de "'+nav.linea+'" asignadas todavía.</p></div></div>';
  }
  return projects.map(p=>{
    const t = projectTotalsForPeople(p, personIds);
    const sm = statusMeta(p.status);
    const periodo = p.startMonth ? ' · '+fmtMonth(p.startMonth)+' – '+fmtMonth(p.endMonth) : '';
    return '<div class="card expand-toggle" onclick="dashGoto({unidad:\''+nav.unidad+'\',linea:\''+nav.linea+'\',projectId:\''+p.id+'\'})">'
      + '<div class="card-header"><div><div class="card-title">'+p.name+' <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></div>'
      + '<div class="card-sub">'+(p.client||'Sin cliente')+periodo+' · horas de esta línea en el proyecto</div></div>'
      + '<span class="link-btn">Ver ▶</span></div>'
      + '<div style="max-width:520px">'+gauge(t.projectedHours, t.actualHours)+'</div>'
      + '</div>';
  }).join('');
}

function renderDashProyecto(){
  const nav = state.dashNav;
  const p = state.projects.find(x=>x.id===nav.projectId);
  if(!p) return '<div class="card"><div class="empty">Proyecto no encontrado.</div></div>';
  const t = projectTotals(p);
  const sm = statusMeta(p.status);
  const devCost = t.actualCost - t.projectedCost;
  const periodo = p.startMonth ? fmtMonth(p.startMonth)+' – '+fmtMonth(p.endMonth) : 'Sin período';
  const montoLine = p.montoAdjudicacion!=null
    ? '<span>Adjudicado: <b class="mono" style="color:var(--text)">'+fmtMoney(p.montoAdjudicacion)+'</b></span>'
      + '<span>% consumido: <b class="mono" style="color:'+(p.montoAdjudicacion>0 && (t.actualCost/p.montoAdjudicacion)>1 ? 'var(--red)':'var(--text)')+'">'+(p.montoAdjudicacion>0? (t.actualCost/p.montoAdjudicacion*100).toFixed(0)+'%':'—')+'</b></span>'
    : '';

  let html = '<div class="card">'
    + '<div class="card-title">'+p.name+' <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></div>'
    + '<div class="card-sub">'+(p.pep?'PEP '+p.pep+' · ':'')+(p.client||'Sin cliente')+' · '+periodo+'</div>'
    + '<div style="max-width:520px; margin-top:12px">'+gauge(t.projectedHours, t.actualHours)+'</div>'
    + '<div style="display:flex; gap:22px; margin-top:12px; font-size:12.5px; flex-wrap:wrap" class="muted">'
    + '<span>$ proyectado: <b class="mono" style="color:var(--text)">'+fmtMoney(t.projectedCost)+'</b></span>'
    + '<span>$ real: <b class="mono" style="color:var(--text)">'+fmtMoney(t.actualCost)+'</b></span>'
    + '<span>Desviación: <b class="mono" style="color:'+(devCost>0?'var(--red)':'var(--teal)')+'">'+(devCost>0?'+':'')+fmtMoney(devCost)+'</b></span>'
    + montoLine
    + '</div></div>';

  const assignments = p.assignments||[];
  if(assignments.length===0){
    html += '<div class="card"><p class="muted" style="font-size:13px">Sin personas asignadas todavía.</p></div>';
    return html;
  }
  const byRole = {};
  assignments.forEach(a=>{
    const person = getPerson(a.personId); if(!person) return;
    const act = projectRealHoursForPerson(p.id, a.personId);
    const proj = assignmentProjectedTotal(a);
    if(!byRole[person.role]) byRole[person.role] = {projected:0, actual:0};
    byRole[person.role].projected += proj; byRole[person.role].actual += act;
  });
  const roleRows = Object.entries(byRole).map(function(entry){
    const role=entry[0], v=entry[1];
    return '<div style="margin-bottom:10px"><div style="font-size:12.5px; font-weight:600; margin-bottom:4px">'+role+'</div>'+gauge(v.projected, v.actual)+'</div>';
  }).join('');
  const personRows = assignments.map(a=>{
    const person = getPerson(a.personId); if(!person) return '';
    const act = projectRealHoursForPerson(p.id, a.personId);
    const proj = assignmentProjectedTotal(a);
    return '<div class="person-row expand-toggle" onclick="dashGoto({unidad:\''+(state.dashNav.unidad||'')+'\',linea:\''+(state.dashNav.linea||'')+'\',projectId:\''+p.id+'\',personId:\''+person.id+'\'})">'
      + '<div><div class="person-name">'+person.name+'</div><div class="person-role">'+person.role+'</div></div>'
      + '<div class="muted mono" style="font-size:12.5px">'+fmtMoney(personRate(person))+'/h</div>'
      + '<div>'+gauge(proj, act)+'</div><div class="link-btn">Ver ▶</div>'
      + '</div>';
  }).join('');
  html += '<div class="card"><div class="section-label" style="margin-top:0">Consumo por rol</div>'+roleRows
    + '<div class="section-label">Consumo por persona (clic para ver tendencia mensual)</div>'+personRows+'</div>';
  return html;
}

function renderDashPersona(){
  const nav = state.dashNav;
  const p = state.projects.find(x=>x.id===nav.projectId);
  const person = getPerson(nav.personId);
  if(!p || !person) return '<div class="card"><div class="empty">No encontrado.</div></div>';
  const a = (p.assignments||[]).find(x=>x.personId===person.id);
  const proj = a ? assignmentProjectedTotal(a) : 0;
  const act = projectRealHoursForPerson(p.id, person.id);
  const months = monthRange(p.startMonth, p.endMonth);

  const monthRows = months.map(m=>{
    const pm = (a && a.projectedByMonth[m]) ? Number(a.projectedByMonth[m]) : 0;
    const rm = state.realEntries.filter(e=>e.category==='project' && e.projectId===p.id && e.personId===person.id && e.month===m)
      .reduce((s,e)=>s+Number(e.hours||0),0);
    const pct = pm>0 ? (rm/pm*100) : (rm>0?999:0);
    const color = ratioColor(pm>0? rm/pm : (rm>0?2:0));
    return '<tr><td>'+fmtMonth(m)+'</td><td class="mono" style="text-align:right">'+fmtH(pm)+'</td>'
      + '<td class="mono" style="text-align:right">'+fmtH(rm)+'</td>'
      + '<td class="mono" style="text-align:right; color:'+color+'">'+(pm>0?pct.toFixed(0)+'%':(rm>0?'—':'0%'))+'</td></tr>';
  }).join('');

  return '<div class="card">'
    + '<div class="card-title">'+person.name+'</div>'
    + '<div class="card-sub">'+person.role+' · '+(person.lineaNegocio||'Sin línea')+' · '+fmtMoney(personRate(person))+'/h</div>'
    + '<div style="max-width:520px; margin-top:12px">'+gauge(proj, act)+'</div>'
    + '</div>'
    + '<div class="card"><div class="section-label" style="margin-top:0">Tendencia mensual en este proyecto</div>'
    + (months.length ? '<table><thead><tr><th>Mes</th><th class="num">Proyectado</th><th class="num">Real</th><th class="num">%</th></tr></thead><tbody>'+monthRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">El proyecto no tiene período definido.</p>')
    + '</div>';
}

function renderProyectos(){
  if(!state.projectSearchQuery) state.projectSearchQuery = '';

  if(!state.projectLineaFilter) state.projectLineaFilter = 'all';

  const statusOpts = '<option value="all">Todos los estados</option>'
    + STATUS_OPTS.map(s => '<option value="'+s.v+'" '+(state.projectStatusFilter===s.v?'selected':'')+'>'+s.label+'</option>').join('');

  const typeOpts = '<option value="all">Todos los tipos (Proyectos y Admin)</option>'
    + '<option value="proyecto" '+(state.projectTypeFilter==='proyecto'?'selected':'')+'>📂 Proyectos cliente</option>'
    + '<option value="admin" '+(state.projectTypeFilter==='admin'?'selected':'')+'>⚙️ Administración interna</option>';

  const lineas = state.config.lineasNegocio || [];
  const lineaOpts = '<option value="all">Todas las Líneas de Negocio</option>'
    + lineas.map(l => '<option value="'+l.nombre+'" '+(state.projectLineaFilter===l.nombre?'selected':'')+'>🏷️ '+l.nombre+'</option>').join('');

  let filtered = state.projects.filter(p => {
    if(state.projectStatusFilter !== 'all' && p.status !== state.projectStatusFilter) return false;
    if(state.projectTypeFilter !== 'all' && (p.tipo||'proyecto') !== state.projectTypeFilter) return false;
    if(state.projectLineaFilter !== 'all' && (p.lineaNegocio||'') !== state.projectLineaFilter) return false;
    if(state.projectSearchQuery){
      const q = state.projectSearchQuery.toLowerCase();
      const matchName = (p.name||'').toLowerCase().includes(q);
      const matchPep = (p.pep||'').toLowerCase().includes(q);
      const matchClient = (p.client||'').toLowerCase().includes(q);
      const matchLinea = (p.lineaNegocio||'').toLowerCase().includes(q);
      if(!matchName && !matchPep && !matchClient && !matchLinea) return false;
    }
    return true;
  });

  let html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap">'
    + '<div style="display:flex; gap:8px; flex:1; max-width:840px; flex-wrap:wrap">'
    + '<input type="text" placeholder="🔍 Buscar por nombre, cliente, PEP o línea..." value="'+(state.projectSearchQuery||'')+'" oninput="state.projectSearchQuery=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px; flex:1; min-width:180px;">'
    + '<select onchange="state.projectLineaFilter=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px;">'+lineaOpts+'</select>'
    + '<select onchange="state.projectTypeFilter=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px;">'+typeOpts+'</select>'
    + '<select onchange="state.projectStatusFilter=this.value; renderContent()" style="padding:8px 12px; border:1px solid var(--border); border-radius:8px;">'+statusOpts+'</select>'
    + '</div>'
    + '<button class="btn btn-primary" onclick="openProjectModal()">+ Nuevo registro / proyecto</button>'
    + '</div>';

  if(filtered.length===0){
    html += '<div class="card"><div class="empty"><div class="display">Sin registros que coincidan</div><p>Prueba ajustando los filtros de búsqueda o línea de negocio.</p></div></div>';
    return html;
  }

  html += filtered.map(p=>{
    const sm = statusMeta(p.status);
    const isAdmin = p.tipo === 'admin';
    const typeBadge = isAdmin
      ? '<span class="chip" style="background:#FBF1DF; color:#DB9A2E; font-weight:700; margin-left:6px">⚙️ Administración</span>'
      : '<span class="chip" style="background:#E6F5F2; color:#1E9E8B; font-weight:700; margin-left:6px">📂 Proyecto</span>';
    const expanded = state.expandedProject==='mgmt_'+p.id;
    const periodo = p.startMonth ? fmtMonth(p.startMonth)+' – '+fmtMonth(p.endMonth) : 'Sin período definido';
    const lineaText = p.lineaNegocio ? ' · LN: <b>'+p.lineaNegocio+'</b>' : ' · <span class="muted">Sin LN</span>';

    return '<div class="card">'
      + '<div class="card-header">'
      + '<div><div class="card-title">'+p.name+typeBadge+' <span class="badge '+sm.cls+'" style="margin-left:6px">'+sm.label+'</span></div>'
      + '<div class="card-sub">'+(p.pep?'PEP '+p.pep+' · ':'')+(p.client||'Sin cliente')+lineaText+' · '+periodo+'</div></div>'
      + '<div style="display:flex; gap:6px; flex-wrap:wrap">'
      + '<button class="btn btn-secondary btn-sm" onclick="toggleMgmt(\''+p.id+'\')">'+(expanded?'Cerrar':'Gestionar personas')+'</button>'
      + '<button class="btn btn-secondary btn-sm" onclick="openProjectModal(\''+p.id+'\')">Editar</button>'
      + '<button class="btn btn-ghost btn-sm" onclick="deleteProject(\''+p.id+'\')">Eliminar</button>'
      + '</div></div>'
      + (expanded ? renderPeopleManager(p) : '')
      + '</div>';
  }).join('');
  return html;
}

}

function saveProject(projectId){
  const name = document.getElementById('f_name').value.trim();
  const tipo = document.getElementById('f_tipo').value;
  const lineaNegocio = document.getElementById('f_linea').value;
  const pep = document.getElementById('f_pep').value.trim();
  const client = document.getElementById('f_client').value.trim();
  const status = document.getElementById('f_status').value;
  const fechaInicio = document.getElementById('f_start').value;
  const fechaCierre = document.getElementById('f_end').value;
  const startMonth = fechaInicio ? fechaInicio.slice(0,7) : '';
  const endMonth = fechaCierre ? fechaCierre.slice(0,7) : '';
  if(!name){ showToast('Ingresa un nombre.'); return; }
  if(fechaInicio && fechaCierre && fechaInicio>fechaCierre){ showToast('La fecha de inicio debe ser anterior o igual a la de cierre.'); return; }
  if(projectId){
    const p = state.projects.find(x=>x.id===projectId);
    p.name=name; p.tipo=tipo; p.lineaNegocio=lineaNegocio; p.pep=pep; p.client=client; p.status=status;
    p.fechaInicio=fechaInicio; p.fechaCierre=fechaCierre; p.startMonth=startMonth; p.endMonth=endMonth;
  }else{
    state.projects.push({id:uid('proj'), name, tipo, lineaNegocio, pep, client, status, fechaInicio, fechaCierre, startMonth, endMonth, assignments:[]});
  }
  persistProjects(); closeModal(); renderAll(); showToast(tipo==='admin' ? 'PEP de Administración guardado.' : 'Proyecto guardado.');
}
function deleteProject(id){
  if(!confirm('¿Eliminar este proyecto y todos sus registros de horas asociados? Esta acción no se puede deshacer.')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  state.realEntries = state.realEntries.filter(e=>e.projectId!==id);
  persistProjects(); persistEntries();
  renderAll(); showToast('Proyecto eliminado.');
}

// ---------- Asignaciones (solo vía Excel de proyección, o quitar manualmente) ----------
function removeAssignment(projectId, personId){
  if(!confirm('¿Quitar a esta persona del proyecto?')) return;

  p.assignments = p.assignments.filter(a=>a.personId!==personId);
  persistProjects(); renderAll(); showToast('Persona quitada del proyecto.');
}

}
function saveProjection(projectId, personId){
  const p = state.projects.find(x=>x.id===projectId);
  const a = p.assignments.find(x=>x.personId===personId);
  document.querySelectorAll('.proj-month-input').forEach(inp=>{
    const m = inp.dataset.month; const v = Number(inp.value)||0;
    if(v>0) a.projectedByMonth[m]=v; else delete a.projectedByMonth[m];
  });
  persistProjects(); closeModal(); renderAll(); showToast('Proyección guardada.');
}

function downloadProjectionTemplate(projectId){
  const p = state.projects.find(x=>x.id===projectId);
  const months = monthRange(p.startMonth, p.endMonth);
  if(months.length===0){ showToast('Define mes inicio/término primero.'); return; }
  if(state.people.length===0){ showToast('Agrega personas en Configuración → Equipo antes de descargar la plantilla.'); return; }
  
  // Hoja 1: Carga Proyección (ÚNICAMENTE personas de la Línea de Negocio del Proyecto)
  const projectLinea = p.lineaNegocio || '';
  const peopleInProjectLinea = projectLinea
    ? state.people.filter(person => person.lineaNegocio === projectLinea)
    : state.people;

  const monthHeaders = months.map(monthLabelFull);
  const headerProj = ['Línea de Negocio','Persona'].concat(monthHeaders);
  const rowsProj = peopleInProjectLinea.map(person=>{
    const a = (p.assignments||[]).find(x=>x.personId===person.id);
    const row = [person.lineaNegocio||'', person.name];
    months.forEach(m=> row.push((a && a.projectedByMonth[m]) ? a.projectedByMonth[m] : ''));
    return row;
  });
  const wsProj = XLSX.utils.aoa_to_sheet([headerProj].concat(rowsProj));

  // Hoja 2: Todas las Personas (Catálogo completo de referencia)
  const headerCat = ['Nombre Completo', 'Línea de Negocio', 'Unidad de Negocio', 'Rol', 'Tarifa HH (CLP)'];
  const rowsCat = state.people.map(person => [
    person.name,

function uploadProjectionExcel(evt, projectId){
  const file = evt.target.files[0]; if(!file) return;
  const p = state.projects.find(x=>x.id===projectId);
  const months = monthRange(p.startMonth, p.endMonth);
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      // Busca la hoja de carga ('Carga Proyección', 'Proyeccion' o la primera hoja)
      const targetSheetName = wb.SheetNames.find(n => {
        const norm = normalizeStr(n);
        return norm.includes('carga') || norm.includes('proyeccion');
      }) || wb.SheetNames[0];

      const ws = wb.Sheets[targetSheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(rows.length===0){ showToast('La hoja de proyección no tiene filas con datos.'); evt.target.value=''; return; }

      // Detecta qué columnas del archivo corresponden a qué mes, leyendo el encabezado en cualquier formato/capitalización
      const headerCols = Object.keys(rows[0]);
      const monthHeaderMap = {}; // texto real de la columna -> 'YYYY-MM'
      headerCols.forEach(h=>{
        const parsed = parseMonthLabel(h);
        if(parsed && months.includes(parsed)) monthHeaderMap[h] = parsed;
      });
      if(Object.keys(monthHeaderMap).length===0){
        showToast('No reconocí ninguna columna de mes en el archivo. Usa el formato "Marzo 2026" (mes + año).');
        evt.target.value=''; return;
      }
      let matched=0; const unmatched=[];
      rows.forEach(row=>{
        const name = String(row['Persona']||row['Nombre Completo']||'').trim();
        if(!name) return;
        const person = state.people.find(x=>namesMatch(name, x.name));
        if(!person){ unmatched.push(name); return; }
        let a = p.assignments.find(x=>x.personId===person.id);
        if(!a){ a = {personId:person.id, projectedByMonth:{}}; p.assignments.push(a); }
        Object.keys(monthHeaderMap).forEach(h=>{
          if(row[h]!==''){ a.projectedByMonth[monthHeaderMap[h]] = Number(row[h])||0; }
        });
        matched++;
      });
      persistProjects(); renderAll();
      if(unmatched.length) showUnmatchedModal(matched, unmatched.map(n=>n+' (persona no encontrada en Equipo)'));
      else showToast('Proyección cargada: '+matched+' persona(s) actualizadas.');
    }catch(err){ showToast('No se pudo leer el archivo. Verifica el formato.'); }
    evt.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}
