    + renderUfClpField('f_meta_valor_uf', 'f_meta_valor_clp', 'Meta anual de facturación', '')
    + '</div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMetaFacturacion()">Guardar</button></div>';
  openModal();
}
function saveMetaFacturacion(){
  const tipo = document.getElementById('f_meta_tipo').value;
  const periodo = document.getElementById('f_meta_periodo').value.trim();
  const nombre = tipo==='unidad' ? document.getElementById('f_meta_unidad').value : document.getElementById('f_meta_linea').value;
  const metaUF = Number(document.getElementById('f_meta_valor_clp').value)||0;
  if(!nombre || !periodo){ showToast('Selecciona un ámbito y un período.'); return; }
  if(!state.config.metasFacturacion) state.config.metasFacturacion=[];
  state.config.metasFacturacion.push({tipo, nombre, periodo, metaUF});
  persistConfig(); closeModal(); renderAll(); showToast('Meta guardada.');
}
function deleteMetaFacturacion(idx){
  if(!confirm('¿Eliminar esta meta de facturación?')) return;
  state.config.metasFacturacion.splice(idx,1);
  persistConfig(); renderAll();
}

// Simulación de accesos por rol: hoy es un selector manual porque la app no
// tiene login real todavía. El día que haya autenticación por persona (Supabase +
// RLS, ver ROADMAP.md), esto deja de ser seleccionable acá y pasa a resolverse
// solo según quién inició sesión — por eso vive en Configuración y no en el
// Dashboard, para que no se lea como una opción normal de uso diario.
function renderAccesoConfigCard(){
  const roleOpts = ORG_ROLES.map(r=>'<option value="'+r+'" '+(state.viewAsRole===r?'selected':'')+'>'+r+'</option>').join('');
  return '<div class="card">'
    + '<div class="card-header"><div><div class="card-title">🔐 Accesos y Roles</div>'
    + '<div class="card-sub">Hoy esto es solo una simulación para probar la app: elige un rol y verás qué información oculta (como el costo empresa). En producción, el acceso quedará asociado al login real de cada persona, no a un selector.</div></div></div>'
    + '<div class="form-grid" style="max-width:320px">'
    + '<div class="field"><label>🧪 Simular vista como…</label><select onchange="setViewAsRole(this.value)">'+roleOpts+'</select></div>'
    + '</div>'
    + '</div>';
}

function renderConfig(){
  const cfg = state.config;

  const unidadRows = (cfg.unidades||[]).map(u=>
    '<tr><td>'+u+'</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="deleteUnidad(\''+u+'\')">Eliminar</button></td></tr>'
  ).join('');

  const lineaRows = (cfg.lineasNegocio||[]).map(l=>
    '<tr><td>'+l.nombre+'</td><td>'+(l.unidad||'<span class="muted">Sin unidad</span>')+'</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="openLineaModal(\''+l.nombre+'\')">Editar</button><button class="btn btn-ghost btn-sm" onclick="deleteLineaNegocio(\''+l.nombre+'\')">Eliminar</button></td></tr>'
  ).join('');

  const peopleRows = state.people.map(p=>
    '<tr><td><b>'+p.name+'</b></td><td>'+(p.lineaNegocio||'<span class="muted">Sin línea</span>')+'</td><td>'+p.role+'</td>'
    + '<td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="openPersonModalGlobal(\''+p.id+'\')">Editar</button><button class="btn btn-ghost btn-sm" onclick="deleteGlobalPerson(\''+p.id+'\')">Eliminar</button></td></tr>'
  ).join('');

  const backupCard = '<div class="card" style="border-left:3px solid var(--teal);">'
    + '<div class="card-header"><div class="card-title">💾 Respaldos de Datos (Backup & Restore)</div></div>'
    + '<p class="muted" style="font-size:12.5px; margin-bottom:12px">Puedes descargar una copia de seguridad en formato JSON con todo el portafolio (proyectos, equipo, configuración y registros reales) o restaurarla en cualquier momento.</p>'
    + '<div style="display:flex; gap:10px; flex-wrap:wrap;">'
    + '<button class="btn btn-secondary btn-sm" onclick="downloadJSONBackup()">📥 Descargar Respaldo JSON</button>'
    + '<label class="btn btn-secondary btn-sm" style="margin-bottom:0; cursor:pointer;">📤 Cargar Respaldo JSON<input type="file" accept=".json" style="display:none" onchange="uploadJSONBackup(event)"></label>'
    + '<button class="btn btn-ghost btn-sm" onclick="restoreDemoData()">🔄 Restaurar datos de ejemplo</button>'
    + '</div></div>';

  const financeCard = renderFinanceConfigCard();
  const metasCard = renderMetasConfigCard();
  const accesoCard = renderAccesoConfigCard();

  return backupCard
    + accesoCard
    + financeCard
    + metasCard
    + '<div class="card"><div class="card-header"><div class="card-title">Unidades de Negocio</div><button class="btn btn-secondary btn-sm" onclick="openUnidadModal()">+ Agregar unidad</button></div>'
    + ((cfg.unidades||[]).length ? '<table><thead><tr><th>Nombre</th><th></th></tr></thead><tbody>'+unidadRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin unidades configuradas (ej: CircularHR, Expande).</p>')
    + '</div>'
    + '<div class="card"><div class="card-header"><div class="card-title">Líneas de Negocio</div><button class="btn btn-secondary btn-sm" onclick="openLineaModal()">+ Agregar línea</button></div>'
    + ((cfg.lineasNegocio||[]).length ? '<table><thead><tr><th>Nombre</th><th>Unidad</th><th></th></tr></thead><tbody>'+lineaRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin líneas de negocio configuradas.</p>')
    + '<p class="muted" style="font-size:12px; margin-top:10px">Cada línea de negocio pertenece a una unidad. Crea primero las unidades.</p></div>'
    + '<div class="card"><div class="card-header"><div><div class="card-title">Equipo</div></div><button class="btn btn-secondary btn-sm" onclick="openPersonModalGlobal()">+ Agregar persona</button></div>'
    + (state.people.length ? '<table><thead><tr><th>Nombre</th><th>Línea de Negocio</th><th>Rol</th><th></th></tr></thead><tbody>'+peopleRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin personas registradas. Agrégalas para poder asignarlas a proyectos.</p>')
    + '</div>';
}

function openUnidadModal(){
  document.getElementById('modalBody').innerHTML = '<h3>Nueva unidad</h3>'
    + '<div class="form-grid"><div class="field" style="grid-column:1/-1"><label>Nombre</label><input id="f_unidadname" placeholder="Ej: CircularHR"></div></div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveUnidad()">Guardar</button></div>';
  openModal();
}
function saveUnidad(){
  const name = document.getElementById('f_unidadname').value.trim();
  if(!name){ showToast('Ingresa un nombre.'); return; }
  if(!state.config.unidades) state.config.unidades=[];
  if(!state.config.unidades.includes(name)) state.config.unidades.push(name);
  persistConfig(); closeModal(); renderAll(); showToast('Unidad agregada.');
}
function deleteUnidad(name){
  if(!confirm('¿Eliminar esta unidad? Las líneas de negocio que la tengan asignada quedarán sin unidad.')) return;
  state.config.unidades = (state.config.unidades||[]).filter(u=>u!==name);
  (state.config.lineasNegocio||[]).forEach(l=>{ if(l.unidad===name) l.unidad=''; });
  persistConfig(); renderAll();
}

function openLineaModal(lineaNombre){
  const existing = lineaNombre ? (state.config.lineasNegocio||[]).find(l=>l.nombre===lineaNombre) : null;
  const unidadOpts = (state.config.unidades||[]).map(u=>'<option value="'+u+'" '+(existing&&existing.unidad===u?'selected':'')+'>'+u+'</option>').join('');
  document.getElementById('modalBody').innerHTML = '<h3>'+(existing?'Editar línea de negocio':'Nueva línea de negocio')+'</h3>'
    + '<div class="form-grid">'
    + '<div class="field" style="grid-column:1/-1"><label>Nombre</label><input id="f_lineaname" value="'+(existing?existing.nombre:'')+'" '+(existing?'disabled':'')+' placeholder="Ej: Consultoría RRHH"></div>'
    + '<div class="field" style="grid-column:1/-1"><label>Unidad</label><select id="f_lineaunidad"><option value="">Sin unidad</option>'+unidadOpts+'</select></div>'
    + '</div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveLineaNegocio('+(existing?"'"+existing.nombre+"'":'null')+')">Guardar</button></div>';
  openModal();
}
function saveLineaNegocio(existingNombre){
  const name = document.getElementById('f_lineaname').value.trim();
  const unidad = document.getElementById('f_lineaunidad').value;
  if(!name){ showToast('Ingresa un nombre.'); return; }
  if(!state.config.lineasNegocio) state.config.lineasNegocio=[];
  if(existingNombre){
    const l = state.config.lineasNegocio.find(x=>x.nombre===existingNombre);
    if(l) l.unidad = unidad;
  }else{
    if(!state.config.lineasNegocio.some(x=>x.nombre===name)) state.config.lineasNegocio.push({nombre:name, unidad});
  }
  persistConfig(); closeModal(); renderAll(); showToast('Línea de negocio guardada.');
}
function deleteLineaNegocio(name){
  if(!confirm('¿Eliminar esta línea de negocio del catálogo? Las personas que ya la tengan asignada no se modifican, solo dejará de sugerirse para nuevas personas.')) return;
  state.config.lineasNegocio = (state.config.lineasNegocio||[]).filter(l=>l.nombre!==name);
  persistConfig(); renderAll();
}


function saveCapacityConfig(){
  state.config.monthlyCapacity = Number(document.getElementById('cfg_capacity').value)||180;
  state.config.targetProjectPct = Number(document.getElementById('cfg_targetProject').value)||80;
  state.config.targetAdminPct = Number(document.getElementById('cfg_targetAdmin').value)||20;
  persistConfig(); showToast('Parámetros guardados.'); renderAll();
}

function openPersonModalGlobal(personId){
  const p = personId ? getPerson(personId) : null;
  const lineaOpts = (state.config.lineasNegocio||[]).map(l=>'<option value="'+l.nombre+'">').join('');
  document.getElementById('modalBody').innerHTML =
    '<h3>'+(p?'Editar persona':'Nueva persona')+'</h3>'
    + '<div class="form-grid">'
    + '<div class="field" style="grid-column:1/-1"><label>Nombre completo</label><input id="f_gname" value="'+(p?p.name:'')+'" placeholder="Ej: María Pérez"></div>'
    + '<div class="field" style="grid-column:1/-1"><label>Línea de Negocio</label><input id="f_glinea" list="lineaNegocioList" value="'+(p?(p.lineaNegocio||''):'')+'" placeholder="Selecciona o escribe una línea"><datalist id="lineaNegocioList">'+lineaOpts+'</datalist></div>'
    + '<div class="field" style="grid-column:1/-1"><label>Rol</label><input id="f_grole" value="'+(p?p.role:'')+'" placeholder="Ej: Consultor / Jefe de Proyecto / Especialista"></div>'
    + '</div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveGlobalPerson('+(p?"'"+p.id+"'":'null')+')">Guardar</button></div>';
  openModal();
}
function saveGlobalPerson(personId){
  const name = document.getElementById('f_gname').value.trim();
  const lineaNegocio = document.getElementById('f_glinea').value.trim();
  const role = document.getElementById('f_grole').value.trim();
  if(!name || !role){ showToast('Completa nombre y rol.'); return; }
  if(lineaNegocio){
    if(!state.config.lineasNegocio) state.config.lineasNegocio=[];
    if(!state.config.lineasNegocio.some(x=>x.nombre===lineaNegocio)) state.config.lineasNegocio.push({nombre:lineaNegocio, unidad:''});
  }
  if(personId){
    const p = getPerson(personId);
    p.name=name; p.lineaNegocio=lineaNegocio; p.role=role;
  }else{
    state.people.push({id:uid('pers'), name, lineaNegocio, role});
  }
  persistPeople(); persistConfig(); closeModal(); renderAll(); showToast('Persona guardada.');
}
function deleteGlobalPerson(id){
  if(!confirm('¿Eliminar esta persona? Se quitará de todos los proyectos donde esté asignada, junto con sus registros de horas.')) return;
  state.people = state.people.filter(p=>p.id!==id);
  state.projects.forEach(pr=>{ pr.assignments = (pr.assignments||[]).filter(a=>a.personId!==id); });
  state.realEntries = state.realEntries.filter(e=>e.personId!==id);
  persistPeople(); persistProjects(); persistEntries(); renderAll();
  showToast('Persona eliminada.');
}

// ---------- Modal generic ----------
function openModal(){ document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });

// ---------- Init ----------
initTheme();
renderTopButtons();
initLocalStorageSync();
</script>
</body>
</html>
