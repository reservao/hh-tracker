function extractPepCode(label){
  if(!label) return null;
  const str = String(label).trim();
  const m1 = str.match(/\b(\d{3,5}(?:\.[A-Za-z0-9]+)+)\b/i);
  if(m1) return m1[1].toUpperCase();
  const m2 = str.match(/\b(PEP[-_\s]?[A-Za-z0-9\.-]+)\b/i);
  if(m2) return m2[1].toUpperCase();
  const firstWord = str.split(/\s+/)[0].toUpperCase();
  return firstWord || null;
}

function findMatchingProject(label){
  if(!label) return null;
  const rawLabel = String(label).trim();
  const normLabel = normalizeStr(rawLabel);
  const codeInLabel = extractPepCode(rawLabel);

  // 1. Coincidencia por código PEP extraído (ej: 3981.N.F99)
  if(codeInLabel){
    const projByCode = state.projects.find(pr => {
      const prCode = extractPepCode(pr.pep || pr.name);
      return prCode && prCode === codeInLabel;
    });
    if(projByCode) return projByCode;
  }

  // 2. Coincidencia por inclusión de texto del PEP (ej: si uno incluye al otro)
  const projByContain = state.projects.find(pr => {
    if(!pr.pep) return false;
    const prPepNorm = normalizeStr(pr.pep);
    return prPepNorm && (normLabel.includes(prPepNorm) || prPepNorm.includes(normLabel));
  });
  if(projByContain) return projByContain;

  // 3. Coincidencia por nombre de proyecto
  const projByName = state.projects.find(pr => {
    if(!pr.name) return false;
    const prNameNorm = normalizeStr(pr.name);
    return prNameNorm && (normLabel.includes(prNameNorm) || prNameNorm.includes(normLabel));
  });

  return projByName || null;
}

function isAdminLabel(label){
  return normalizeStr(label).indexOf('administra') !== -1;
}
function cleanNameWords(str){
  if(!str) return [];
  const stopWords = new Set(['de', 'del', 'la', 'las', 'los', 'san', 'santa', 'y', 'e', 'von', 'van']);
  const sanitized = normalizeStr(str)
    .replace(/[.,;:_\-\/\\()[\]"'\`]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return sanitized
    .split(/\s+/)
    .filter(w => w.length > 0 && !stopWords.has(w) && !/^[a-z]\.?$/.test(w));
}
function namesMatch(a, b){
  if(!a || !b) return false;
  const cleanA = cleanNameWords(a).join(' ');
  const cleanB = cleanNameWords(b).join(' ');
  if(!cleanA || !cleanB) return false;
  if(cleanA === cleanB) return true;
  if(cleanA.includes(cleanB) || cleanB.includes(cleanA)) return true;

  const wordsA = cleanNameWords(a);
  const wordsB = cleanNameWords(b);

  const setB = new Set(wordsB);
  const setA = new Set(wordsA);
  let sharedInA = 0;
  wordsA.forEach(w => { if(setB.has(w)) sharedInA++; });

  let sharedInB = 0;
  wordsB.forEach(w => { if(setA.has(w)) sharedInB++; });

  const minWords = Math.min(wordsA.length, wordsB.length);
  if(sharedInA >= minWords || sharedInB >= minWords) return true;
  if(sharedInA >= 2 || sharedInB >= 2) return true;

  return false;
}
function addRealEntryHours(category, projectId, personId, month, hours){
  let entry = state.realEntries.find(e =>
    e.category === category &&
    e.personId === personId &&
    e.month === month &&
    (category === 'admin' ? e.projectId === projectId : e.projectId === projectId)
  );
  if(entry){
    // PEP ya existía para esta persona y mes: SE REEMPLAZAN / ACTUALIZAN las horas
    entry.hours = Number(hours);
    entry.source = 'excel';
  } else {
    // PEP nuevo para esta persona y mes: SE AGREGA
    state.realEntries.push({id:uid('ent'), category, projectId, personId, month, hours:Number(hours), note:'', source:'excel', loggedBy:'', createdAt:Date.now()});
  }
}

function parseMonthFromCell(cell){
  if(cell == null || cell === '') return null;
  if(cell instanceof Date && !isNaN(cell.getTime())){
    return cell.toISOString().slice(0, 7);
  }
  const num = Number(cell);
  if(!isNaN(num) && num > 35000 && num < 70000){
    const utcDays = Math.floor(num - 25569);
    const dateObj = new Date(utcDays * 86400 * 1000);
    if(!isNaN(dateObj.getTime())){
      return dateObj.toISOString().slice(0, 7);
    }
  }
  if(typeof cell === 'string'){
    const str = cell.trim();
    const parsedLabel = parseMonthLabel(str);
    if(parsedLabel) return parsedLabel;
    const d = new Date(str);
    if(!isNaN(d.getTime()) && d.getFullYear() > 2000 && d.getFullYear() < 2100){
      return d.toISOString().slice(0, 7);
    }
  }
  return null;
}

function uploadTimesheetExcel(){
  const fileInput = document.getElementById('bulk_file');
  const file = fileInput.files[0];
  if(!file){ showToast('Selecciona un archivo.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const parsed = {}; // { nombreHoja: { etiquetaProyecto: { 'YYYY-MM': horas } } }

      wb.SheetNames.forEach(sheetName=>{
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        const headerRowIdx = rows.findIndex(r => {
          const v = String(r[0]||'').trim().toLowerCase();
          return v === 'proyecto' || v.startsWith('proyecto') || v === 'pep';
        });
        if(headerRowIdx===-1) return;

        const headerRow = rows[headerRowIdx];
        const dateCols = [];
        headerRow.forEach((cell, idx)=>{
          if(idx === 0 || idx === 1) return;
          const monthStr = parseMonthFromCell(cell);
          if(monthStr){
            dateCols.push({idx, month: monthStr});
          }
        });
        if(dateCols.length===0) return;

        const projectsMap = {};
        for(let i=headerRowIdx+1; i<rows.length; i++){
          const row = rows[i];
          const label = String(row[0]||'').trim();
          if(!label || label.toLowerCase() === 'total' || label.toLowerCase() === 't') continue;
          dateCols.forEach(dc=>{
            const hours = Number(row[dc.idx]);
            if(!isNaN(hours) && hours>=0){
              if(!projectsMap[label]) projectsMap[label] = {};
              projectsMap[label][dc.month] = (projectsMap[label][dc.month]||0) + hours;
            }
          });
        }
        if(Object.keys(projectsMap).length) parsed[sheetName.trim()] = projectsMap;
      });

      if(Object.keys(parsed).length===0){
        showToast('No se encontraron hojas con horas cargadas en el archivo.');
        fileInput.value=''; return;
      }

      // Limpia adecuadamente los registros de Excel anteriores para las personas y meses del archivo
      Object.entries(parsed).forEach(([sheetPersonName, projectsMap])=>{
        const person = state.people.find(p=>namesMatch(sheetPersonName, p.name));
        if(!person) return;
        const monthsInSheet = new Set();
        Object.values(projectsMap).forEach(monthsObj=>{
          Object.keys(monthsObj).forEach(m=> monthsInSheet.add(m));
        });
        state.realEntries = state.realEntries.filter(entry=>{
          if(entry.personId === person.id && monthsInSheet.has(entry.month) && entry.source === 'excel') return false;
          return true;
        });
      });

      let matchedCount=0, adminCount=0;
      const unmatchedPeople=[], unmatchedProjects=[];

      Object.entries(parsed).forEach(([sheetPersonName, projectsMap])=>{
        const person = state.people.find(p=>namesMatch(sheetPersonName, p.name));
        if(!person){ unmatchedPeople.push(sheetPersonName); return; }
        Object.entries(projectsMap).forEach(([label, monthsObj])=>{
          const project = findMatchingProject(label);
          const code = extractPepCode(label) || label;
          Object.entries(monthsObj).forEach(([month, hours])=>{
            if(project){
              const cat = (project.tipo === 'admin') ? 'admin' : 'project';
              addRealEntryHours(cat, project.id, person.id, month, hours);
              if(cat==='admin') adminCount++; else matchedCount++;
            }else{
              unmatchedProjects.push(sheetPersonName+' — '+label+' ('+(code||'sin PEP')+') — '+fmtMonth(month)+': '+fmtH(hours)+' h');
            }
          });
        });
      });

      persistEntries(); renderKPIs(); renderContent();
      if(unmatchedPeople.length || unmatchedProjects.length){
        showUnmatchedTimesheetModal(matchedCount, adminCount, unmatchedPeople, unmatchedProjects);
      }else{
        showToast('Carga completa: '+matchedCount+' registro(s) sumados a proyectos, '+adminCount+' a administración.');
      }
      fileInput.value='';
    }catch(err){
      console.error(err);
      showToast('No se pudo leer el archivo. Verifica que sea el formato de planilla esperado.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function showUnmatchedTimesheetModal(matchedCount, adminCount, unmatchedPeople, unmatchedProjects){
  let html = '<h3>Carga procesada</h3>'
    + '<p style="font-size:13.5px; margin-bottom:10px">'+matchedCount+' registro(s) sumados a proyectos, '+adminCount+' a administración.</p>';
  if(unmatchedPeople.length){
    html += '<p style="font-size:13.5px; margin-bottom:6px"><b>'+unmatchedPeople.length+' hoja(s) con persona no encontrada en Equipo:</b></p>'
      + '<ul style="font-size:12.5px; color:var(--muted); max-height:140px; overflow-y:auto; padding-left:18px">'+unmatchedPeople.map(n=>'<li>'+n+'</li>').join('')+'</ul>';
  }
  if(unmatchedProjects.length){
    html += '<p style="font-size:13.5px; margin:10px 0 6px"><b>'+unmatchedProjects.length+' fila(s) con código de proyecto no encontrado (y que no parecen ser administración):</b></p>'
      + '<ul style="font-size:12.5px; color:var(--muted); max-height:160px; overflow-y:auto; padding-left:18px">'+unmatchedProjects.map(n=>'<li>'+n+'</li>').join('')+'</ul>';
  }
  html += '<p class="muted" style="font-size:12px; margin-top:10px">Revisa que el nombre de la hoja coincida con el nombre registrado en Configuración → Equipo, y que el código PEP del proyecto esté cargado igual en su ficha.</p>'
    + '<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>';
  document.getElementById('modalBody').innerHTML = html;
  openModal();
}

// ---------- Configuración ----------
function renderConfig(){
  const cfg = state.config;

  const unidadRows = (cfg.unidades||[]).map(u=>
    '<tr><td>'+u+'</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="deleteUnidad(\''+u+'\')">Eliminar</button></td></tr>'
  ).join('');

  const lineaRows = (cfg.lineasNegocio||[]).map(l=>
    '<tr><td>'+l.nombre+'</td><td>'+(l.unidad||'<span class="muted">Sin unidad</span>')+'</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="openLineaModal(\''+l.nombre+'\')">Editar</button><button class="btn btn-ghost btn-sm" onclick="deleteLineaNegocio(\''+l.nombre+'\')">Eliminar</button></td></tr>'
  ).join('');

  const peopleRows = state.people.map(p=>
    '<tr><td><b>'+p.name+'</b></td><td>'+(p.lineaNegocio||'<span class="muted">Sin línea</span>')+'</td><td>'+p.role+'</td>'
    + '<td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="openPersonModalGlobal(\''+p.id+'\')">Editar</button><button class="btn btn-ghost btn-sm" onclick="deleteGlobalPerson(\''+p.id+'\')">Eliminar</button></td></tr>'
  ).join('');

  const backupCard = '<div class="card" style="border:1px solid #DCE1F0; background:#F8F9FD;">'
    + '<div class="card-header"><div class="card-title">💾 Respaldos de Datos (Backup & Restore)</div></div>'
    + '<p class="muted" style="font-size:12.5px; margin-bottom:12px">Puedes descargar una copia de seguridad en formato JSON con todo el portafolio (proyectos, equipo, configuración y registros reales) o restaurarla en cualquier momento.</p>'
    + '<div style="display:flex; gap:10px; flex-wrap:wrap;">'
    + '<button class="btn btn-secondary btn-sm" onclick="downloadJSONBackup()">📥 Descargar Respaldo JSON</button>'
    + '<label class="btn btn-secondary btn-sm" style="margin-bottom:0; cursor:pointer;">📤 Cargar Respaldo JSON<input type="file" accept=".json" style="display:none" onchange="uploadJSONBackup(event)"></label>'
    + '</div></div>';

  return backupCard
    + '<div class="card"><div class="card-header"><div class="card-title">Unidades de Negocio</div><button class="btn btn-secondary btn-sm" onclick="openUnidadModal()">+ Agregar unidad</button></div>'
    + ((cfg.unidades||[]).length ? '<table><thead><tr><th>Nombre</th><th></th></tr></thead><tbody>'+unidadRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin unidades configuradas (ej: CircularHR, Expande).</p>')
    + '</div>'
    + '<div class="card"><div class="card-header"><div class="card-title">Líneas de Negocio</div><button class="btn btn-secondary btn-sm" onclick="openLineaModal()">+ Agregar línea</button></div>'
    + ((cfg.lineasNegocio||[]).length ? '<table><thead><tr><th>Nombre</th><th>Unidad</th><th></th></tr></thead><tbody>'+lineaRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin líneas de negocio configuradas.</p>')
    + '<p class="muted" style="font-size:12px; margin-top:10px">Cada línea de negocio pertenece a una unidad. Crea primero las unidades.</p></div>'
    + '<div class="card"><div class="card-header"><div><div class="card-title">Equipo</div></div><button class="btn btn-secondary btn-sm" onclick="openPersonModalGlobal()">+ Agregar persona</button></div>'
    + (state.people.length ? '<table><thead><tr><th>Nombre</th><th>Línea de Negocio</th><th>Rol</th><th></th></tr></thead><tbody>'+peopleRows+'</tbody></table>' : '<p class="muted" style="font-size:13px">Sin personas registradas. Agrégalas para poder asignarlas a proyectos.</p>')
    + '</div>';
}

function openUnidadModal(){
  document.getElementById('modalBody').innerHTML = '<h3>Nueva unidad</h3>'
    + '<div class="form-grid"><div class="field" style="grid-column:1/-1"><label>Nombre</label><input id="f_unidadname" placeholder="Ej: CircularHR"></div></div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveUnidad()">Guardar</button></div>';
  openModal();
}
function saveUnidad(){
  const name = document.getElementById('f_unidadname').value.trim();
  if(!name){ showToast('Ingresa un nombre.'); return; }
  if(!state.config.unidades) state.config.unidades=[];
  if(!state.config.unidades.includes(name)) state.config.unidades.push(name);
  persistConfig(); closeModal(); renderAll(); showToast('Unidad agregada.');
}
function deleteUnidad(name){
  if(!confirm('¿Eliminar esta unidad? Las líneas de negocio que la tengan asignada quedarán sin unidad.')) return;
  state.config.unidades = (state.config.unidades||[]).filter(u=>u!==name);
  (state.config.lineasNegocio||[]).forEach(l=>{ if(l.unidad===name) l.unidad=''; });
  persistConfig(); renderAll();
}

function openLineaModal(lineaNombre){
  const existing = lineaNombre ? (state.config.lineasNegocio||[]).find(l=>l.nombre===lineaNombre) : null;
  const unidadOpts = (state.config.unidades||[]).map(u=>'<option value="'+u+'" '+(existing&&existing.unidad===u?'selected':'')+'>'+u+'</option>').join('');
  document.getElementById('modalBody').innerHTML = '<h3>'+(existing?'Editar línea de negocio':'Nueva línea de negocio')+'</h3>'
    + '<div class="form-grid">'
    + '<div class="field" style="grid-column:1/-1"><label>Nombre</label><input id="f_lineaname" value="'+(existing?existing.nombre:'')+'" '+(existing?'disabled':'')+' placeholder="Ej: Consultoría RRHH"></div>'
    + '<div class="field" style="grid-column:1/-1"><label>Unidad</label><select id="f_lineaunidad"><option value="">Sin unidad</option>'+unidadOpts+'</select></div>'
    + '</div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveLineaNegocio('+(existing?"'"+existing.nombre+"'":'null')+')">Guardar</button></div>';
  openModal();
}
function saveLineaNegocio(existingNombre){
  const name = document.getElementById('f_lineaname').value.trim();
  const unidad = document.getElementById('f_lineaunidad').value;
  if(!name){ showToast('Ingresa un nombre.'); return; }
  if(!state.config.lineasNegocio) state.config.lineasNegocio=[];
  if(existingNombre){
    const l = state.config.lineasNegocio.find(x=>x.nombre===existingNombre);
    if(l) l.unidad = unidad;
  }else{
    if(!state.config.lineasNegocio.some(x=>x.nombre===name)) state.config.lineasNegocio.push({nombre:name, unidad});
  }
  persistConfig(); closeModal(); renderAll(); showToast('Línea de negocio guardada.');
}
function deleteLineaNegocio(name){
  if(!confirm('¿Eliminar esta línea de negocio del catálogo? Las personas que ya la tengan asignada no se modifican, solo dejará de sugerirse para nuevas personas.')) return;
  state.config.lineasNegocio = (state.config.lineasNegocio||[]).filter(l=>l.nombre!==name);
  persistConfig(); renderAll();
}

function openRoleModal(existingRole){
  const rate = existingRole ? state.config.roleRates[existingRole] : '';
  document.getElementById('modalBody').innerHTML =
    '<h3>'+(existingRole?'Editar rol':'Nuevo rol')+'</h3>'
    + '<div class="form-grid">'
    + '<div class="field"><label>Nombre del rol</label><input id="f_rolename" value="'+(existingRole||'')+'" '+(existingRole?'disabled':'')+' placeholder="Ej: Consultor Senior"></div>'
    + '<div class="field"><label>Tarifa por hora (CLP)</label><input id="f_rolerate" type="number" min="0" value="'+(rate!==undefined?rate:'')+'"></div>'
    + '</div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveRole(\''+(existingRole||'')+'\')">Guardar</button></div>';
  openModal();
}
function saveRole(oldName){
  const name = document.getElementById('f_rolename').value.trim();
  const rate = Number(document.getElementById('f_rolerate').value)||0;
  if(!name){ showToast('Ingresa un nombre de rol.'); return; }
  if(oldName && oldName!==name) delete state.config.roleRates[oldName];
  state.config.roleRates[name] = rate;
  persistConfig(); closeModal(); renderAll(); showToast('Rol guardado.');
}
function deleteRole(role){
  if(!confirm('¿Eliminar este rol del catálogo? Las personas con este rol quedarán sin tarifa por defecto.')) return;
  delete state.config.roleRates[role];
  persistConfig(); renderAll();
}
function saveCapacityConfig(){
  state.config.monthlyCapacity = Number(document.getElementById('cfg_capacity').value)||180;
  state.config.targetProjectPct = Number(document.getElementById('cfg_targetProject').value)||80;
  state.config.targetAdminPct = Number(document.getElementById('cfg_targetAdmin').value)||20;
  persistConfig(); showToast('Parámetros guardados.'); renderAll();
}

function openPersonModalGlobal(personId){
  const p = personId ? getPerson(personId) : null;
  const lineaOpts = (state.config.lineasNegocio||[]).map(l=>'<option value="'+l.nombre+'">').join('');
  document.getElementById('modalBody').innerHTML =
    '<h3>'+(p?'Editar persona':'Nueva persona')+'</h3>'
    + '<div class="form-grid">'
    + '<div class="field" style="grid-column:1/-1"><label>Nombre completo</label><input id="f_gname" value="'+(p?p.name:'')+'" placeholder="Ej: María Pérez"></div>'
    + '<div class="field" style="grid-column:1/-1"><label>Línea de Negocio</label><input id="f_glinea" list="lineaNegocioList" value="'+(p?(p.lineaNegocio||''):'')+'" placeholder="Selecciona o escribe una línea"><datalist id="lineaNegocioList">'+lineaOpts+'</datalist></div>'
    + '<div class="field" style="grid-column:1/-1"><label>Rol</label><input id="f_grole" value="'+(p?p.role:'')+'" placeholder="Ej: Consultor / Jefe de Proyecto / Especialista"></div>'
    + '</div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveGlobalPerson('+(p?"'"+p.id+"'":'null')+')">Guardar</button></div>';
  openModal();
}
function saveGlobalPerson(personId){
  const name = document.getElementById('f_gname').value.trim();
  const lineaNegocio = document.getElementById('f_glinea').value.trim();
  const role = document.getElementById('f_grole').value.trim();
  if(!name || !role){ showToast('Completa nombre y rol.'); return; }
  if(lineaNegocio){
    if(!state.config.lineasNegocio) state.config.lineasNegocio=[];
    if(!state.config.lineasNegocio.some(x=>x.nombre===lineaNegocio)) state.config.lineasNegocio.push({nombre:lineaNegocio, unidad:''});
  }
  if(personId){
    const p = getPerson(personId);
    p.name=name; p.lineaNegocio=lineaNegocio; p.role=role;
  }else{
    state.people.push({id:uid('pers'), name, lineaNegocio, role});
  }
  persistPeople(); persistConfig(); closeModal(); renderAll(); showToast('Persona guardada.');
}
function deleteGlobalPerson(id){
  if(!confirm('¿Eliminar esta persona? Se quitará de todos los proyectos donde esté asignada, junto con sus registros de horas.')) return;
  state.people = state.people.filter(p=>p.id!==id);
  state.projects.forEach(pr=>{ pr.assignments = (pr.assignments||[]).filter(a=>a.personId!==id); });
  state.realEntries = state.realEntries.filter(e=>e.personId!==id);
  persistPeople(); persistProjects(); persistEntries(); renderAll();
  showToast('Persona eliminada.');
}

// ---------- Modal generic ----------
function openModal(){ document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });

// ---------- Init ----------
initTheme();
renderTopButtons();
initFirestoreSync();
</script>
</body>
</html>
